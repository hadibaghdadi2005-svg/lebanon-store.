<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر لبنان | Lebanon Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cedar:#0F3D2E;
  --cedar-light:#175943;
  --brass:#C4972A;
  --brass-light:#E0B54A;
  --brick:#C2542D;
  --sand:#F1EAD9;
  --sand-dark:#E7DCC3;
  --paper:#FFFDF8;
  --ink:#1C231F;
  --ink-soft:#5B6259;
  --line:#DDD3B8;
  --radius:14px;
  --shadow:0 4px 18px rgba(15,61,46,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--sand);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
[dir="rtl"] body, [dir="rtl"] .font-body{font-family:'Tajawal',system-ui,sans-serif}
.font-display{font-family:'Fraunces',serif;font-optical-sizing:auto}
[dir="rtl"] .font-display{font-family:'Tajawal',system-ui,sans-serif;font-weight:800}
.font-mono{font-family:'IBM Plex Mono',monospace}
img,svg{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
.zellige-divider{
  height:14px;
  background-image: linear-gradient(45deg, var(--brass) 25%, transparent 25%), linear-gradient(-45deg, var(--brass) 25%, transparent 25%);
  background-size:16px 16px;
  opacity:.55;
}
.badge{
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;
  letter-spacing:.02em;
}
.badge-new{background:#DCEFE5;color:var(--cedar)}
.badge-best{background:#FBE9D2;color:#8A5A15}
.badge-offer{background:#FBDACB;color:var(--brick)}
.btn{
  border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brass);color:#221604}
.btn-primary:hover{background:var(--brass-light);box-shadow:0 6px 16px rgba(196,151,42,.35)}
.btn-outline{background:transparent;border:1.6px solid var(--paper);color:var(--paper)}
.btn-cedar{background:var(--cedar);color:var(--paper)}
.btn-cedar:hover{background:var(--cedar-light)}
.btn-ghost{background:var(--sand-dark);color:var(--ink)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:8px}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- HEADER ---------- */
header.site{
  position:sticky;top:0;z-index:40;background:var(--cedar);color:var(--paper);
}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:38px;height:38px;border-radius:9px;background:var(--brass);display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:20px;height:20px;stroke:var(--cedar);fill:none;stroke-width:2}
.logo-text{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1}
.logo-sub{font-size:10.5px;color:var(--brass-light);letter-spacing:.08em;text-transform:uppercase}
.searchbar{
  flex:1;display:flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:10px;padding:9px 14px;gap:8px;min-width:0;
}
.searchbar input{background:transparent;border:none;outline:none;color:var(--paper);width:100%;font-size:14px}
.searchbar input::placeholder{color:rgba(255,255,255,.55)}
.topbar-icons{display:flex;align-items:center;gap:16px;flex-shrink:0}
.icon-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:rgba(255,255,255,.85)}
.icon-btn .cart-count{
  position:absolute;top:-6px;inset-inline-end:-8px;background:var(--brick);color:#fff;font-size:10px;font-weight:700;
  width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.lang-switch{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--paper);
  padding:6px 10px;font-size:12.5px;font-weight:700;
}
.hamburger{display:none;background:none;border:none;color:var(--paper)}
.catbar{background:var(--cedar-light);border-top:1px solid rgba(255,255,255,.08)}
.catbar .container{display:flex;gap:22px;overflow-x:auto;padding:9px 20px;scrollbar-width:none}
.catbar .container::-webkit-scrollbar{display:none}
.catbar a{white-space:nowrap;font-size:13px;color:rgba(255,255,255,.82);font-weight:500}
.catbar a:hover{color:var(--brass-light)}

/* ---------- HERO ---------- */
.hero{
  position:relative;background:var(--cedar);color:var(--paper);padding:64px 0 76px;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;inset-inline-end:-8%;top:-20%;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle, rgba(196,151,42,.28), transparent 70%);
}
.hero-inner{position:relative;max-width:640px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-light);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--brass-light)}
.hero h1{font-size:44px;line-height:1.08;margin-bottom:16px}
.hero p{font-size:16.5px;color:rgba(255,255,255,.78);margin-bottom:28px;max-width:460px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- SECTIONS ---------- */
section{padding:52px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;gap:12px}
.section-head h2{font-size:26px}
.section-head .eyebrow{margin-bottom:6px}
.section-head a.view-all{font-size:13px;font-weight:700;color:var(--cedar);border-bottom:2px solid var(--brass)}

.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat-card{
  background:var(--paper);border-radius:var(--radius);padding:18px 10px;text-align:center;box-shadow:var(--shadow);
  border:1px solid var(--line);transition:transform .18s ease;
}
.cat-card:hover{transform:translateY(-3px)}
.cat-icon{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;background:var(--sand);display:flex;align-items:center;justify-content:center}
.cat-icon svg{width:22px;height:22px;stroke:var(--cedar);fill:none;stroke-width:1.7}
.cat-card span{font-size:12.5px;font-weight:700}

.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.prod-card{
  background:var(--paper);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s ease;
}
.prod-card:hover{transform:translateY(-4px)}
.prod-img{
  aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.prod-img svg{width:46%;height:46%;stroke:rgba(255,255,255,.92);fill:none;stroke-width:1.3}
.prod-badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:5px}
.wish-btn{
  position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,253,248,.9);
  border:none;display:flex;align-items:center;justify-content:center;
}
.wish-btn svg{width:15px;height:15px;stroke:var(--brick);fill:none;stroke-width:2}
.wish-btn.active svg{fill:var(--brick)}
.prod-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.prod-cat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.prod-name{font-size:14px;font-weight:700;line-height:1.3;min-height:36px}
.prod-rating{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.prod-rating svg{width:12px;height:12px;fill:var(--brass);stroke:none}
.prod-price-row{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.price-now{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--cedar)}
.price-was{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);text-decoration:line-through}
.stock-tag{font-size:11px;font-weight:700}
.stock-ok{color:var(--cedar)}
.stock-low{color:var(--brick)}
.stock-out{color:#999}
.add-cart-btn{
  margin-top:6px;width:100%;background:var(--cedar);color:var(--paper);border:none;border-radius:9px;padding:9px;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
}
.add-cart-btn:hover{background:var(--cedar-light)}
.add-cart-btn:disabled{background:#C7C2B4;cursor:not-allowed}

.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.why-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px}
.why-card .cat-icon{margin:0 0 12px}
.why-card h3{font-size:15px;margin-bottom:5px}
.why-card p{font-size:13px;color:var(--ink-soft);line-height:1.5}

.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.review-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.review-name{font-weight:700;font-size:13.5px}
.review-stars{display:flex;gap:2px}
.review-stars svg{width:12px;height:12px;fill:var(--brass);stroke:none}
.review-text{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:8px}
.review-meta{font-size:11.5px;color:#9B9484}

footer.site{background:var(--cedar);color:rgba(255,255,255,.82);padding:48px 0 20px;margin-top:20px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.3fr;gap:24px;margin-bottom:32px}
.footer-grid h4{color:var(--paper);font-size:13.5px;margin-bottom:14px}
.footer-grid ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.footer-grid a{font-size:13px;color:rgba(255,255,255,.7)}
.footer-grid a:hover{color:var(--brass-light)}
.footer-grid p{font-size:13px;color:rgba(255,255,255,.7);line-height:1.6}
.newsletter{display:flex;gap:8px;margin-top:10px}
.newsletter input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:12.5px}
.footer-bottom{border-top:1px solid rgba(255,255,255,.14);padding-top:18px;display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);flex-wrap:wrap;gap:10px}

/* ---------- DRAWER / MODALS ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,17,.5);z-index:90;display:none}
.overlay.open{display:block}
.drawer{
  position:fixed;top:0;inset-inline-end:0;height:100%;width:420px;max-width:92vw;background:var(--paper);z-index:95;
  transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;
}
[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:17px}
.close-btn{background:var(--sand);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.cart-line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--sand-dark)}
.cart-thumb{width:60px;height:60px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cart-thumb svg{width:50%;height:50%;stroke:#fff;fill:none;stroke-width:1.4}
.cart-info{flex:1;min-width:0}
.cart-info .name{font-size:13.5px;font-weight:700;margin-bottom:3px}
.cart-info .variant{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px}
.qty-row{display:flex;align-items:center;gap:8px}
.qty-btn{width:24px;height:24px;border-radius:6px;background:var(--sand-dark);border:none;font-weight:700;font-size:13px}
.qty-val{font-size:13px;font-weight:600;min-width:16px;text-align:center}
.remove-btn{font-size:11.5px;color:var(--brick);font-weight:700;margin-inline-start:auto;background:none;border:none}
.line-total{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.drawer-foot{border-top:1px solid var(--line);padding:16px 20px 20px;background:var(--sand)}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;color:var(--ink-soft)}
.sum-row.total{color:var(--ink);font-weight:800;font-size:16px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.empty-state{text-align:center;padding:60px 10px;color:var(--ink-soft)}
.empty-state svg{width:52px;height:52px;stroke:var(--line);fill:none;margin:0 auto 14px}

/* ---------- PRODUCT MODAL ---------- */
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--paper);z-index:95;border-radius:18px;
  width:920px;max-width:94vw;max-height:90vh;overflow-y:auto;display:none;box-shadow:0 30px 60px rgba(0,0,0,.35);
}
.modal.open{display:block}
.modal-close{position:sticky;top:14px;float:inline-end;margin-inline-end:14px;z-index:5;background:var(--paper);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.modal-gallery{background:var(--cedar);display:flex;flex-direction:column}
.gallery-main{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.gallery-main svg{width:38%;height:38%;stroke:rgba(255,255,255,.9);fill:none;stroke-width:1.2}
.gallery-swatches{display:flex;gap:8px;padding:14px;justify-content:center}
.swatch{width:44px;height:44px;border-radius:8px;border:2px solid rgba(255,255,255,.25);cursor:pointer}
.swatch.active{border-color:var(--brass)}
.modal-info{padding:26px 26px 30px;display:flex;flex-direction:column;gap:12px}
.modal-info h2{font-size:21px;line-height:1.3}
.modal-stars-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.modal-price-row{display:flex;align-items:baseline;gap:10px}
.modal-price-row .price-now{font-size:24px}
.discount-tag{background:#FBDACB;color:var(--brick);font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px}
.modal-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.variant-block label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px}
.variant-opts{display:flex;gap:8px;flex-wrap:wrap}
.variant-opt{padding:6px 14px;border-radius:8px;border:1.4px solid var(--line);font-size:12.5px;font-weight:600;background:var(--paper)}
.variant-opt.active{border-color:var(--cedar);background:var(--cedar);color:#fff}
.modal-actions{display:flex;gap:10px;align-items:center}
.spec-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.spec-table td{padding:7px 0;border-bottom:1px solid var(--sand-dark)}
.spec-table td:first-child{color:var(--ink-soft);width:38%}
.ai-box{background:var(--sand);border:1px dashed var(--brass);border-radius:12px;padding:14px}
.ai-box-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--cedar);margin-bottom:8px}
.ai-box-head svg{width:16px;height:16px}
.ai-log{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:150px;overflow-y:auto}
.ai-msg{font-size:12.5px;padding:8px 11px;border-radius:9px;max-width:88%;line-height:1.5}
.ai-msg.user{background:var(--cedar);color:#fff;align-self:flex-end;margin-inline-start:auto}
.ai-msg.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start}
.ai-input-row{display:flex;gap:6px}
.ai-input-row input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;outline:none}

/* ---------- CHATBOT ---------- */
.chat-fab{
  position:fixed;bottom:22px;inset-inline-end:22px;background:var(--brass);color:#221604;border:none;border-radius:30px;
  padding:13px 20px;font-weight:800;font-size:13.5px;box-shadow:0 8px 22px rgba(196,151,42,.4);z-index:80;display:flex;align-items:center;gap:8px;
}
.chat-panel{
  position:fixed;bottom:88px;inset-inline-end:22px;width:340px;max-width:90vw;height:440px;background:var(--paper);
  border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.28);z-index:80;display:none;flex-direction:column;overflow:hidden;
}
.chat-panel.open{display:flex}
.chat-head{background:var(--cedar);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.chat-head div span{display:block}
.chat-head .t1{font-weight:800;font-size:13.5px}
.chat-head .t2{font-size:11px;color:rgba(255,255,255,.65)}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sand)}
.chat-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:var(--sand)}
.chat-chip{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px 10px;font-size:11px}
.chat-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:6px}
.chat-foot input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;outline:none}
.chat-send{background:var(--cedar);color:#fff;border:none;border-radius:9px;width:38px;display:flex;align-items:center;justify-content:center}

/* ---------- CHECKOUT / ACCOUNT PAGES ---------- */
.page{padding:36px 0 60px}
.breadcrumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px}
.checkout-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:26px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h3{font-size:16px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:12px;font-weight:700;color:var(--ink-soft)}
.form-field input,.form-field select,.form-field textarea{
  padding:10px 12px;border:1.4px solid var(--line);border-radius:9px;font-size:13.5px;outline:none;font-family:inherit;background:var(--paper);color:var(--ink);
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--cedar)}
.pay-option{display:flex;align-items:center;gap:10px;border:1.4px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.pay-option.active{border-color:var(--cedar);background:var(--sand)}
.order-conf{text-align:center;padding:60px 20px}
.order-conf .check-circle{width:70px;height:70px;border-radius:50%;background:#DCEFE5;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.order-conf .check-circle svg{width:34px;height:34px;stroke:var(--cedar);stroke-width:2.4}
.order-num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--cedar);margin:12px 0}

/* ---------- ADMIN ---------- */
.admin-shell{display:flex;min-height:100vh}
.admin-side{width:220px;background:var(--cedar);color:#fff;padding:20px 14px;flex-shrink:0}
.admin-side .logo{margin-bottom:26px;padding:0 6px}
.admin-nav a{display:block;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.75);margin-bottom:3px}
.admin-nav a.active,.admin-nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.admin-main{flex:1;background:var(--sand);padding:26px 30px;overflow-x:hidden}
.admin-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-bottom:6px}
.stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ============ CART LOGIC ============ */
function addToCart(id, variant, qty){
  qty = qty || 1;
  variant = variant || (findProduct(id).variants[0]);
  const existing = state.cart.find(l=>l.id===id && l.variant===variant);
  if(existing){ existing.qty += qty; }
  else { state.cart.push({id, variant, qty}); }
  showToast(t('addedToCart'));
  render();
}
function removeFromCart(id, variant){
  state.cart = state.cart.filter(l=>!(l.id===id && l.variant===variant));
  render();
}
function changeQty(id, variant, delta){
  const line = state.cart.find(l=>l.id===id && l.variant===variant);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0) removeFromCart(id, variant);
  else render();
}
function cartCount(){ return state.cart.reduce((s,l)=>s+l.qty,0); }
function cartSubtotal(){
  return state.cart.reduce((s,l)=>{
    const p = findProduct(l.id);
    return s + p.price*l.qty;
  },0);
}
function deliveryFee(){
  if(!state.selectedGov) return 0;
  const sub = cartSubtotal();
  if(sub >= FREE_DELIVERY_MIN) return 0;
  return GOV_FEES[state.lang][state.selectedGov] ?? 0;
}
function discountAmount(){
  if(!state.coupon) return 0;
  const sub = cartSubtotal();
  if(state.coupon.type==='pct') return +(sub*state.coupon.value/100).toFixed(2);
  return state.coupon.value;
}
function cartTotal(){
  return Math.max(0, cartSubtotal() - discountAmount() + deliveryFee());
}
function toggleWishlist(id){
  if(state.wishlist.has(id)){ state.wishlist.delete(id); showToast(t('removedFromWish')); }
  else { state.wishlist.add(id); showToast(t('addedToWish')); }
  render();
}

/* ============ AI (SIMULATED) ============ */
function aiProductAnswer(p, question){
  const q = question.toLowerCase();
  const specs = specsFor(p);
  const specText = Object.entries(specs).map(([k,v])=>`${k}: ${v}`).join(' | ');
  const hay = (pdesc(p) + ' ' + specText).toLowerCase();

  if(state.lang==='ar'){
    if(/(مطبخ صغير|صغير)/.test(q)){
      if(/كغ|kg/.test(specText.toLowerCase()) || p.cat==='kitchen') return 'نعم، هذا المنتج مضغوط الحجم ومناسب للمساحات الصغيرة بناءً على أبعاده ووزنه.';
    }
    if(/(سعر|كم سعره|بكام)/.test(q)) return `سعر هذا المنتج حاليًا ${fmt(p.price)}` + (p.was>p.price? ` (بدلاً من ${fmt(p.was)})`:'') + '.';
    if(/(متوفر|بالمخزون|ستوك)/.test(q)) return p.stock>0 ? `نعم، متوفر حاليًا (${p.stock} قطعة متبقية).` : 'للأسف هذا المنتج غير متوفر حاليًا.';
    if(/(ضمان|كم مدة)/.test(q)){
      const w = Object.entries(specs).find(([k])=>k.includes('ضمان'));
      return w ? `الضمان: ${w[1]}.` : 'معلومات الضمان غير متوفرة لهذا المنتج.';
    }
    if(/(وزن|كم يزن)/.test(q)){
      const w = Object.entries(specs).find(([k])=>k.includes('وزن'));
      return w ? `الوزن: ${w[1]}.` : 'معلومة الوزن غير متوفرة لهذا المنتج.';
    }
    for(const [k,v] of Object.entries(specs)){
      if(q.includes(k.toLowerCase())) return `${k}: ${v}.`;
    }
    return 'هذه المعلومة غير متوفرة ضمن بيانات هذا المنتج حاليًا. يمكنك التواصل مع خدمة العملاء لمزيد من التفاصيل.';
  } else {
    if(/small kitchen|compact|small space/.test(q)){
      if(p.cat==='kitchen') return `Yes — based on its dimensions and weight, this product is compact and works well in small kitchens.`;
    }
    if(/price|cost|how much/.test(q)) return `This product is currently priced at ${fmt(p.price)}` + (p.was>p.price? ` (down from ${fmt(p.was)})`:'') + '.';
    if(/stock|available|in stock/.test(q)) return p.stock>0 ? `Yes, it's in stock — ${p.stock} units left.` : `Sorry, this product is currently out of stock.`;
    if(/warranty|guarantee/.test(q)){
      const w = Object.entries(specs).find(([k])=>k.toLowerCase().includes('warranty'));
      return w ? `Warranty: ${w[1]}.` : `Warranty information isn't listed for this product.`;
    }
    if(/weight|how heavy/.test(q)){
      const w = Object.entries(specs).find(([k])=>k.toLowerCase().includes('weight'));
      return w ? `Weight: ${w[1]}.` : `Weight information isn't listed for this product.`;
    }
    for(const [k,v] of Object.entries(specs)){
      if(q.includes(k.toLowerCase())) return `${k}: ${v}.`;
    }
    return `That information isn't available in this product's listing. Feel free to contact support for more details.`;
  }
}
function specsFor(p){ return state.lang==='ar' ? p.specs.ar : p.specs.en; }

function aiStoreAnswer(question){
  const q = question.toLowerCase();
  const inStock = PRODUCTS.filter(p=>p.stock>0);
  if(state.lang==='ar'){
    if(/(أرخص|أقل سعر)/.test(q)){
      const cheapest = [...inStock].sort((a,b)=>a.price-b.price)[0];
      return `أرخص منتج متوفر حاليًا هو "${pname(cheapest)}" بسعر ${fmt(cheapest.price)}.`;
    }
    if(/(توصيل|رسوم التوصيل|كم التوصيل)/.test(q)) return 'رسوم التوصيل تختلف حسب المحافظة (من $3 إلى $7)، والتوصيل مجاني للطلبات فوق $75.';
    if(/(إرجاع|استرجاع|سياسة)/.test(q)) return 'يمكنك إرجاع أي منتج خلال 7 أيام من الاستلام بشرط أن يكون بحالته الأصلية.';
    if(/(طلبي|وين طلبي|حالة الطلب)/.test(q)){
      if(state.lastOrder) return `طلبك رقم ${state.lastOrder.num} حالته حاليًا: "قيد التجهيز". سنرسل تحديثًا عند الشحن.`;
      return 'لم أجد طلبًا مرتبطًا بحسابك بعد. يمكنك إتمام الشراء أولاً لتتبع طلبك هنا.';
    }
    if(/(أعلى تقييم|أفضل تقييم)/.test(q)){
      const top = [...PRODUCTS].sort((a,b)=>b.rating-a.rating)[0];
      return `المنتج الأعلى تقييمًا هو "${pname(top)}" بتقييم ${top.rating}★.`;
    }
    const priceMatch = q.match(/(\\d+)/);
    if(/(أنصح|رشح|توصية|تحت|أقل من)/.test(q)){
      let pool = inStock;
      if(priceMatch) pool = pool.filter(p=>p.price <= Number(priceMatch[1]));
      pool = pool.sort((a,b)=>b.rating-a.rating).slice(0,3);
      if(pool.length===0) return 'لم أجد منتجات متوفرة ضمن هذا النطاق السعري حاليًا.';
      return 'إليك بعض الاقتراحات المتوفرة فعليًا في متجرنا: ' + pool.map(p=>`"${pname(p)}" (${fmt(p.price)})`).join('، ') + '.';
    }
    return 'يمكنني الإجابة على أسئلة حول المنتجات، الأسعار، التوصيل، والطلبات — بناءً على بيانات المتجر الفعلية فقط. جرّب إعادة صياغة سؤالك.';
  } else {
    if(/cheapest|lowest price/.test(q)){
      const cheapest = [...inStock].sort((a,b)=>a.price-b.price)[0];
      return `The cheapest in-stock item right now is "${pname(cheapest)}" at ${fmt(cheapest.price)}.`;
    }
    if(/delivery|shipping fee|how much.*delivery/.test(q)) return `Delivery fees range from $3–$7 depending on your governorate, and it's free on orders over $75.`;
    if(/return|refund|policy/.test(q)) return `You can return any item within 7 days of delivery, provided it's in its original condition.`;
    if(/where is my order|order status|my order/.test(q)){
      if(state.lastOrder) return `Order ${state.lastOrder.num} is currently "Processing". We'll update you once it ships.`;
      return `I don't see an order linked to your session yet. Complete checkout first and I can track it here.`;
    }
    if(/best rated|highest rating|top rated/.test(q)){
      const top = [...PRODUCTS].sort((a,b)=>b.rating-a.rating)[0];
      return `Our top-rated product is "${pname(top)}" at ${top.rating}★.`;
    }
    const priceMatch = q.match(/(\\d+)/);
    if(/recommend|suggest|under|good for/.test(q)){
      let pool = inStock;
      if(priceMatch) pool = pool.filter(p=>p.price <= Number(priceMatch[1]));
      pool = pool.sort((a,b)=>b.rating-a.rating).slice(0,3);
      if(pool.length===0) return `I couldn't find in-stock items in that price range right now.`;
      return `Here are a few options actually available in our store: ` + pool.map(p=>`"${pname(p)}" (${fmt(p.price)})`).join(', ') + '.';
    }
    return `I can help with questions about products, pricing, delivery, and orders — based only on real store data. Try rephrasing your question.`;
  }
}

  const code = (state.couponInput||'').trim().toUpperCase();
  if(COUPONS[code]){ state.coupon = COUPONS[code]; showToast(state.lang==='ar'?'تم تطبيق الرمز!':'Coupon applied!'); }
  else { state.coupon = null; showToast(state.lang==='ar'?'رمز غير صالح':'Invalid coupon'); }

}

/* ============ CHATBOT ============ */
function submitChat(){
  const input = document.getElementById('chat-input');
  if(!input || !input.value.trim()) return;
  const q = input.value.trim();
  state.chatLog.push({role:'user', text:q});
  state.chatLog.push({role:'bot', text: aiStoreAnswer(q)});
  input.value='';
  render();
  setTimeout(()=>{
    const body = document.getElementById('chat-body-el');
    if(body) body.scrollTop = body.scrollHeight;
    const inp = document.getElementById('chat-input');
    if(inp) inp.focus();
  },0);
}
function chatSuggest(q){
  document.getElementById('chat-input').value = q;
  submitChat();
}
function renderChat(){
  const suggestions = state.lang==='ar'
    ? ['ما هو أرخص منتج؟','كم رسوم التوصيل؟','رشحلي منتج تحت 30$','وين طلبي؟']
    : ['What\'s the cheapest item?','How much is delivery?','Recommend something under $30','Where is my order?'];
  return `
  <button class="chat-fab" onclick="toggleChat()">
    <svg class="icon" style="width:17px;height:17px" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/><circle cx="19" cy="18" r="2"/></svg>
    ${t('chatTitle')}
  </button>
  <div class="chat-panel ${state.chatOpen?'open':''}">
    <div class="chat-head">
      <div><span class="t1">${t('chatTitle')}</span><span class="t2">${t('chatSub')}</span></div>
      <button class="close-btn" style="background:rgba(255,255,255,.15)" onclick="toggleChat(false)">
        <svg class="icon" style="width:13px;height:13px;stroke:#fff" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="chat-body" id="chat-body-el">
      ${state.chatLog.length===0?`<div class="ai-msg bot">${state.lang==='ar'?'أهلًا! كيف بقدر ساعدك اليوم؟':'Hi! How can I help you today?'}</div>`:
        state.chatLog.map(m=>`<div class="ai-msg ${m.role}">${m.text}</div>`).join('')}
    </div>
    <div class="chat-suggest">${suggestions.map(s=>`<button class="chat-chip" onclick="chatSuggest('${s.replace(/'/g,"\'")}')">${s}</button>`).join('')}</div>
    <div class="chat-foot">
      <input id="chat-input" placeholder="${t('chatPlaceholder')}" onkeydown="if(event.key==='Enter')submitChat()"/>
      <button class="chat-send" onclick="submitChat()"><svg class="icon" style="width:15px;height:15px;stroke:#fff" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>`;
}

/* ============ MASTER RENDER ============ */
function render(){
  const app = document.getElementById('app');
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr';

  if(state.view==='admin'){
    app.innerHTML = renderAdmin() + renderChat();
  } else {
    let body = '';
    if(state.view==='home') body = renderHome();
    else if(state.view==='product') body = renderProductPage();
    else if(state.view==='checkout') body = renderCheckout();
    else if(state.view==='confirm') body = renderConfirm();
    app.innerHTML = renderHeader() + body + renderFooter() + renderDrawer() + renderChat();
  }

  document.getElementById('overlay').classList.toggle('open', state.drawerOpen);
  document.getElementById('overlay').onclick = ()=>{ toggleDrawer(false); };
}

/* ============ N8N CUSTOMER ASSISTANT INTEGRATION ============ */
// Replace this placeholder with the Production URL from your n8n Webhook node.
https://baghdedi.app.n8n.cloud/webhook/lebanon-store-customer

async function callN8nCustomerBot(payload){
  if(!N8N_CUSTOMER_WEBHOOK || N8N_CUSTOMER_WEBHOOK.includes('YOUR-N8N-DOMAIN')){
    return {reply: state.lang==='ar' ? 'المساعد غير متصل بعد. يرجى التواصل معنا مباشرة.' : 'The assistant is not connected yet. Please contact us directly.'};
  }
  const response = await fetch(N8N_CUSTOMER_WEBHOOK, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      ...payload,
      language: state.lang,
      store: 'Lebanon Store',
      page: window.location.href,
      timestamp: new Date().toISOString()
    })
  });
  if(!response.ok) throw new Error('n8n webhook returned '+response.status);
  return await response.json();
}

async function submitChat(){
  const input = document.getElementById('chat-input');
  if(!input || !input.value.trim()) return;
  const q = input.value.trim();
  state.chatLog.push({role:'user', text:q});
  input.value='';
  state.chatLog.push({role:'bot', text: state.lang==='ar' ? 'لحظة من فضلك...' : 'One moment, please...'});
  render();
  try{
    const result = await callN8nCustomerBot({
      type:'customer_chat',
      message:q,
      cart:state.cart,
      lastOrder:state.lastOrder,
      customer:state.formData
    });
    state.chatLog[state.chatLog.length-1].text = result.reply || result.message || (state.lang==='ar' ? 'لم أتمكن من الحصول على إجابة.' : 'I could not get an answer.');
  }catch(error){
    console.error(error);
    state.chatLog[state.chatLog.length-1].text = state.lang==='ar' ? 'حدث خطأ مؤقت. يرجى المحاولة لاحقًا.' : 'There was a temporary error. Please try again later.';
  }
  render();
  setTimeout(()=>{
    const body=document.getElementById('chat-body-el');
    if(body) body.scrollTop=body.scrollHeight;
    const inp=document.getElementById('chat-input');
    if(inp) inp.focus();
  },0);
}

async function submitProductQuestion(pid){
  const input=document.getElementById('ai-q-input');
  if(!input || !input.value.trim()) return;
  const q=input.value.trim();
  const p=findProduct(pid);
  if(!state.aiLogByProduct[pid]) state.aiLogByProduct[pid]=[];
  state.aiLogByProduct[pid].push({role:'user',text:q});
  state.aiLogByProduct[pid].push({role:'bot',text:state.lang==='ar' ? 'لحظة من فضلك...' : 'One moment, please...'});
  input.value='';
  render();
  try{
    const result=await callN8nCustomerBot({type:'product_question',message:q,product:p,cart:state.cart});
    state.aiLogByProduct[pid][state.aiLogByProduct[pid].length-1].text=result.reply || result.message || '';
  }catch(error){
    console.error(error);
    state.aiLogByProduct[pid][state.aiLogByProduct[pid].length-1].text=state.lang==='ar' ? 'تعذر الاتصال بالمساعد.' : 'The assistant could not be reached.';
  }
  render();
}

async function placeOrder(){
  const f=state.formData;
  if(!f.fullName || !f.phone || !state.selectedGov || !f.city || !f.address){
    showToast(state.lang==='ar'?'يرجى تعبئة الحقول المطلوبة':'Please fill in the required fields');
    return;
  }
  const num='LB-2026-'+String(Math.floor(100000+Math.random()*899999)).slice(0,6);
  const order={
    num,date:new Date().toISOString().slice(0,10),items:[...state.cart],
    total:cartTotal(),gov:state.selectedGov,customer:f.fullName,
    customerDetails:{...f},status:'processing'
  };
  try{
    await callN8nCustomerBot({type:'new_order',message:'New customer order',order});
  }catch(error){
    console.error(error);
    showToast(state.lang==='ar'?'تعذر إرسال الطلب. يرجى المحاولة مرة أخرى.':'The order could not be sent. Please try again.');
    return;
  }
  state.lastOrder=order;
  state.cart=[]; state.coupon=null; state.view='confirm';
  window.scrollTo(0,0); render();
}

render();
</script>
