      <textarea id="desc-en-${p.id}" rows="3" dir="ltr" style="width:100%;padding:10px 12px;border:1.4px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;margin-bottom:12px">${p.desc_en||''}</textarea>
      <button class="btn btn-primary btn-sm" onclick="saveProductDescription(${p.id})">${isAr?'💾 حفظ الوصف':'💾 Save Description'}</button>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <label style="font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px">${isAr?'الألوان (مفصولة بفواصل)':'Colors (comma-separated)'}</label>
        <input type="text" value="${(p.variants||[]).join(', ')}" placeholder="Black, White, Blue" dir="ltr" onchange="adminUpdateVariants(${p.id}, this.value)" style="width:100%;padding:10px 12px;border:1.4px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit"/>
        <p style="font-size:11px;color:var(--ink-soft);margin-top:6px">${isAr?'الألوان التي يختار العميل من بينها. لا تضع المقاسات هنا — استخدم حقل المقاسات أدناه.':'The colours a customer picks from. Don’t put sizes here — use the Sizes field below.'}</p>
        <label style="font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin:14px 0 6px">${isAr?'المقاسات (مفصولة بفواصل)':'Sizes (comma-separated)'}</label>
        <input type="text" value="${productSizes(p).join(', ')}" placeholder="${isAr?'مثال: 40, 41, 42 أو S, M, L':'e.g. 40, 41, 42 or S, M, L'}" dir="ltr" onchange="adminUpdateSizes(${p.id}, this.value)" style="width:100%;padding:10px 12px;border:1.4px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit"/>
        <p style="font-size:11px;color:var(--ink-soft);margin-top:6px">${isAr?'اتركه فارغًا للمنتجات بلا مقاسات. عند تعبئته يجب على العميل اختيار مقاس قبل الإضافة إلى السلة.':'Leave empty for products with no sizes. When filled in, the customer must pick a size before they can add this to their basket.'}</p>
      </div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <label style="font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px">${isAr?'التقييمات':'Reviews'}</label>
        ${REVIEWS.filter(r=>r.prod===p.id).map(r=>`
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;padding:8px 0;border-bottom:1px solid var(--sand-dark)">
            <div style="font-size:12px"><b>${r.name_en}</b> · ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}<br><span style="color:var(--ink-soft)">${r.en}</span></div>
            <button class="btn btn-ghost btn-sm" style="color:var(--brick);flex-shrink:0" onclick="deleteReview('${r.id}')">🗑️</button>
          </div>`).join('') || `<p style="font-size:12px;color:var(--ink-soft)">${isAr?'لا توجد تقييمات':'No reviews yet'}</p>`}
        <div class="form-row" style="margin-top:10px">
          <div class="form-field"><label>${isAr?'اسم العميل':'Customer name'}</label><input id="new-review-name-${p.id}" type="text"/></div>
          <div class="form-field" style="max-width:100px"><label>${isAr?'التقييم':'Rating'}</label>
            <select id="new-review-rating-${p.id}">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ★</option>`).join('')}</select>
          </div>
        </div>
        <div class="form-row"><div class="form-field full"><textarea id="new-review-text-${p.id}" rows="2" placeholder="${isAr?'نص التقييم':'Review text'}"></textarea></div></div>
        <button class="btn btn-secondary btn-sm" onclick="addReview(${p.id})">+ ${isAr?'إضافة تقييم':'Add review'}</button>
      </div>
    </div>
  </div>`;
}

function renderAdmin(){
  const s = adminStats();
  const salesData = last7DaysSales();
  const maxBar = Math.max(1, ...salesData.map(d=>d.v));
  const needsHumanCount = state.adminChats.filter(c=>c.status==='needs_human').length;
  const pendingPaymentsCount = state.orders.filter(o=>o.paymentStatus==='pending_verification').length;
  return `
  <div class="admin-shell">
    <div class="admin-side-overlay ${state.adminSideOpen?'open':''}" onclick="toggleAdminSide(false)"></div>
    <div class="admin-side ${state.adminSideOpen?'open':''}">
      <a class="logo" href="#" onclick="goHome();return false;" style="margin-bottom:24px">
        <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></div>
        <div class="logo-text">${t('storeName')}</div>
      </a>
      <div class="admin-nav">
        <a class="${state.adminView==='overview'?'active':''}" href="#" onclick="setAdminView('overview');return false;">${state.lang==='ar'?'نظرة عامة':'Overview'}</a>
        <a class="${state.adminView==='products'?'active':''}" href="#" onclick="setAdminView('products');return false;">${state.lang==='ar'?'المنتجات':'Products'}</a>
        <a class="${state.adminView==='customers'?'active':''}" href="#" onclick="setAdminView('customers');state.adminSelectedCustomer=null;return false;">${state.lang==='ar'?'العملاء':'Customers'}</a>
        <a class="${state.adminView==='orders'?'active':''}" href="#" onclick="setAdminView('orders');return false;">${state.lang==='ar'?'الطلبات':'Orders'}</a>
        <a class="${state.adminView==='payments'?'active':''}" href="#" onclick="setAdminView('payments');return false;">${state.lang==='ar'?'الدفعات':'Payments'}${pendingPaymentsCount>0?`<span class="admin-nav-badge">${pendingPaymentsCount}</span>`:''}</a>
        <a class="${state.adminView==='settings'?'active':''}" href="#" onclick="setAdminView('settings');return false;">${t('adminSettings')}</a>
        <a class="${state.adminView==='activity'?'active':''}" href="#" onclick="setAdminView('activity');return false;">${state.lang==='ar'?'سجل النشاط':'Activity Log'}</a>
        <a class="${state.adminView==='chats'?'active':''}" href="#" onclick="setAdminView('chats');return false;">${state.lang==='ar'?'المحادثات':'Chats'}${needsHumanCount>0?`<span class="admin-nav-badge">${needsHumanCount}</span>`:''}</a>
        <a href="#" onclick="goHome();return false;" style="margin-top:16px;border-top:1px solid rgba(255,255,255,.15);padding-top:16px">← ${t('backHome')}</a>
      </div>
    </div>
    <div class="admin-main">
      <div class="admin-topline">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="admin-hamburger" onclick="toggleAdminSide(true)" aria-label="Menu">
            <svg class="icon" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <h2 class="font-display">${t('admin')}</h2>
        </div>
      </div>

      ${state.adminView==='overview'?`
      <div class="stat-grid">
        <div class="stat-card"><div class="lbl">${state.lang==='ar'?'إجمالي المبيعات':'Total Sales'}</div><div class="val">${fmt(s.totalSales)}</div></div>
        <div class="stat-card"><div class="lbl">${state.lang==='ar'?'إجمالي الطلبات':'Total Orders'}</div><div class="val">${state.orders.length}</div></div>
        <div class="stat-card"><div class="lbl">${state.lang==='ar'?'العملاء':'Customers'}</div><div class="val">${state.customers.filter(c=>!isAdminUser(c)).length}</div></div>
        <div class="stat-card"><div class="lbl">${state.lang==='ar'?'المنتجات':'Products'}</div><div class="val">${PRODUCTS.length}</div></div>
        <div class="stat-card"><div class="lbl">${state.lang==='ar'?'مخزون منخفض':'Low Stock'}</div><div class="val" style="color:var(--brick)">${s.low}</div></div>
        <div class="stat-card"><div class="lbl">${state.lang==='ar'?'نفذ من المخزون':'Out of Stock'}</div><div class="val" style="color:#999">${s.outOf}</div></div>
      </div>
      <div class="admin-panels">
        <div class="panel">
          <h3>${state.lang==='ar'?'المبيعات (٧ أيام)':'Sales (7 days)'}</h3>
          <div class="bars">
            ${salesData.map(d=>`<div class="bar" style="height:${(d.v/maxBar*100)}%"><span>${d.d}</span></div>`).join('')}
          </div>
        </div>
        <div class="panel">
          <h3>${state.lang==='ar'?'الأكثر مبيعًا':'Best Sellers'}</h3>
          ${PRODUCTS.filter(p=>p.best).map(p=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--sand-dark)"><span>${pname(p)}</span><span class="font-mono">${fmt(p.price)}</span></div>`).join('')}
        </div>
      </div>`:''}

      ${state.adminView==='products'?(function(){
        const isAr = state.lang==='ar';
        const q = (state.adminProductSearch||'').trim().toLowerCase();
        const filtered = q ? PRODUCTS.filter(p=>(p.name_en||'').toLowerCase().includes(q) || (p.name_ar||'').includes(state.adminProductSearch.trim()) || (p.sku||'').toLowerCase().includes(q)) : PRODUCTS;
        return `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px">
          <h3 style="margin:0">${isAr?'إدارة المنتجات':'Product Management'} (${filtered.length}${filtered.length!==PRODUCTS.length?` / ${PRODUCTS.length}`:''})</h3>
          <button class="btn btn-primary btn-sm" onclick="${state.adminAddingProduct?'closeAddProduct()':'openAddProduct()'}">${state.adminAddingProduct?(isAr?'إغلاق ✕':'Close ✕'):(isAr?'➕ إضافة منتج جديد':'➕ Add New Product')}</button>
        </div>
        <p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px">🔒 ${t('supplierLinkPrivacy')}</p>
        ${state.adminAddingProduct ? renderAddProductForm() : ''}
        <input id="admin-product-search-input" type="text" value="${state.adminProductSearch||''}" placeholder="${isAr?'ابحث بالاسم أو SKU':'Search by name or SKU'}" oninput="adminSearchInput('adminProductSearch', this.value, 'admin-product-search-input')" style="width:100%;max-width:320px;margin-bottom:12px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px"/>
        <div style="overflow-x:auto">
        <table class="admin-table">
          <thead><tr>

            <th>${isAr?'المخزون':'Stock'}</th><th>${isAr?'الوزن (كغ)':'Weight (kg)'}</th><th>${t('supplierLink')}</th><th></th><th></th><th></th>
          </tr></thead>
          <tbody>
          ${filtered.map(p=>{
            const {profit, pct} = profitFor(p);
            const profitColor = profit>0 ? 'var(--cedar)' : (profit<0 ? 'var(--brick)' : 'var(--ink-soft)');
            const color = PALETTE[p.color % PALETTE.length];
            return `
            <tr>
              <td>
                <div style="width:38px;height:38px;border-radius:8px;background:${color};display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
                  ${p.imageUrl?`<img src="${p.imageUrl}" alt="${p.name_en}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:`<span style="width:18px;height:18px;color:#fff">${ICONS[p.icon]}</span>`}
                </div>
              </td>
              <td>${pname(p)}</td>
              <td><input type="text" class="font-mono" value="${p.sku}" onchange="adminUpdateSku(${p.id}, this.value)" style="width:100px;font-size:11.5px" title="${state.lang==='ar'?'يمكنك استبداله برقم تتبع المورد':'You can overwrite this with your supplier tracking code'}"/></td>
              <td>
                ${state.adminExpandedCatRow===p.id ? `
                <div style="display:flex;flex-direction:column;gap:2px;font-size:11px;min-width:130px">
                  ${CATS.filter(c=>c.id!=='offers').map(c=>`
                    <label style="display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap">
                      <input type="checkbox" ${productCats(p).includes(c.id)?'checked':''} onchange="adminToggleCategory(${p.id}, '${c.id}', this.checked)"/>
                      ${catName(c)}
                    </label>`).join('')}
                  <a href="#" class="view-all" style="font-size:10.5px;margin-top:2px" onclick="state.adminExpandedCatRow=null;render();return false;">${isAr?'× إغلاق':'× Done'}</a>
                </div>` : `
                <div style="font-size:11.5px;max-width:140px;cursor:pointer" onclick="state.adminExpandedCatRow=${p.id};render()" title="${isAr?'اضغط للتعديل':'Click to edit'}">
                  ${productCats(p).filter(id=>id!=='offers').map(id=>{const c=CATS.find(x=>x.id===id); return c?catName(c):id;}).join(', ') || '—'}
                  <span style="color:var(--cedar);font-weight:700">✎</span>
                </div>`}
                ${p.was>p.price?`<div style="margin-top:4px;font-size:10px;font-weight:700;color:var(--brick)">🔥 ${state.lang==='ar'?'يظهر في العروض تلقائيًا':'Auto-shown in Offers'}</div>`:''}
              </td>
              <td><input type="number" step="0.1" value="${p.cost!==undefined?p.cost:''}" onchange="adminUpdateCost(${p.id}, this.value)" style="width:64px"/></td>
              <td><input type="number" value="${p.price}" onchange="adminUpdatePrice(${p.id}, this.value)" style="width:64px"/></td>
              <td><input type="number" value="${p.was!==undefined?p.was:''}" onchange="adminUpdateWas(${p.id}, this.value)" style="width:64px" title="${state.lang==='ar'?'اتركه مساويًا للسعر لإخفاء الخصم':'Set equal to Price to hide the discount badge'}"/></td>
              <td class="font-mono" style="font-weight:700;color:${profitColor}">${fmt(profit)} <span style="font-size:10.5px;font-weight:600;color:var(--ink-soft)">(${pct}%)</span></td>
              <td><button class="btn btn-ghost btn-sm" onclick="adminSuggestPrice(${p.id})" title="${t('suggestPriceHint')}">${t('suggestPrice')}</button></td>
              <td><input type="number" value="${p.stock}" onchange="adminUpdateStock(${p.id}, this.value)" style="width:56px"/></td>
              <td><input type="number" step="0.01" value="${p.weight!=null?p.weight:''}" placeholder="${isAr?'إن عُرف':'if known'}" onchange="adminUpdateWeight(${p.id}, this.value)" style="width:64px"/></td>
              <td>
                <div style="display:flex;gap:5px;align-items:center">

                </div>
              </td>
              <td>
                <div class="toggle-row">
                  <button class="mini-toggle ${p.featured?'on':''}" onclick="adminToggle(${p.id},'featured')">${state.lang==='ar'?'مميز':'Featured'}</button>
                  <button class="mini-toggle ${p.best?'on':''}" onclick="adminToggle(${p.id},'best')">${state.lang==='ar'?'مبيع':'Best'}</button>
                  <button class="mini-toggle ${p.new?'on':''}" onclick="adminToggle(${p.id},'new')">${state.lang==='ar'?'جديد':'New'}</button>
                </div>
              </td>
              <td><button class="btn btn-cedar btn-sm" onclick="openProductEditor(${p.id})">${state.adminEditingProduct===p.id ? (state.lang==='ar'?'إغلاق ✕':'Close ✕') : (state.lang==='ar'?'✎ صورة/وصف/خيارات':'✎ Photo/Desc/Options')}</button></td>
              <td><button class="btn btn-ghost btn-sm" style="color:var(--brick)" onclick="deleteProduct(${p.id})">${state.lang==='ar'?'🗑️ حذف':'🗑️ Delete'}</button></td>
            </tr>
            ${state.adminEditingProduct===p.id ? `
            <tr>
              <td colspan="14" style="background:var(--sand);padding:0">
                ${renderProductEditorPanel(p)}
              </td>
            </tr>` : ''}`;}).join('')}
          </tbody>
        </table>
        </div>
      </div>`; })():''}

      ${state.adminView==='customers'?renderAdminCustomers():''}

      ${state.adminView==='orders'?(function(){
        const isAr = state.lang==='ar';
        const q = (state.adminOrderSearch||'').trim().toLowerCase();
        const statusF = state.adminOrderStatusFilter||'';
        let filtered = [...state.orders].reverse();
        if(q) filtered = filtered.filter(o=>(o.num||'').toLowerCase().includes(q) || (o.customer||'').toLowerCase().includes(q) || (o.phone||'').toLowerCase().includes(q));
        if(statusF) filtered = filtered.filter(o=>(o.status||'confirmed')===statusF);
        return `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0">${isAr?'الطلبات':'Orders'} (${filtered.length}${filtered.length!==state.orders.length?` / ${state.orders.length}`:''})</h3>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" onclick="refreshAdminData()">🔄 ${isAr?'تحديث':'Refresh'}</button>
            ${state.orders.length>0?`<button class="btn btn-ghost btn-sm" style="color:var(--brick)" onclick="clearAllOrders()">🗑️ ${isAr?'حذف كل الطلبات':'Clear All Orders'}</button>`:''}

        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
          <input id="admin-order-search-input" type="text" value="${state.adminOrderSearch||''}" placeholder="${isAr?'ابحث برقم الطلب أو اسم العميل أو الهاتف':'Search by order #, customer, or phone'}" oninput="adminSearchInput('adminOrderSearch', this.value, 'admin-order-search-input')" style="flex:1;min-width:200px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px"/>
          <select onchange="state.adminOrderStatusFilter=this.value;render()" style="padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-weight:600">
            <option value="">${isAr?'كل الحالات':'All statuses'}</option>
            ${ORDER_STATUSES.map(s=>`<option value="${s}" ${statusF===s?'selected':''}>${ORDER_STATUS_LABELS[state.lang][s]}</option>`).join('')}
          </select>
        </div>
        ${filtered.length===0?`<p style="color:var(--ink-soft);font-size:13.5px">${state.orders.length===0?(isAr?'لا توجد طلبات بعد — أكمل عملية شراء تجريبية من المتجر لرؤيتها هنا.':'No orders yet — complete a demo checkout in the store to see it here.'):(isAr?'لا توجد طلبات مطابقة':'No matching orders')}</p>`:
        filtered.map(o=>`
          <div style="border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--paper)">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px">
              <div>
                <div class="font-mono" style="font-weight:700;font-size:14px">${o.num}</div>
                <div style="font-size:12px;color:var(--ink-soft)">${o.customer} · ${o.phone} · ${o.gov} · ${o.date}</div>
              </div>
              <div style="text-align:end">
                <div class="font-mono" style="font-weight:700">${fmt(o.total)}</div>
                <div style="font-size:11px;color:var(--ink-soft)">${t('estDelivery')}: ${o.deliveryMin}-${o.deliveryMax} ${t('days')}</div>
                <button class="btn btn-ghost btn-sm" style="color:var(--brick);margin-top:6px" onclick="deleteOrder('${o._dbId}')">🗑️ ${state.lang==='ar'?'حذف':'Delete'}</button>
              </div>
            </div>
            <table class="admin-table">
              <thead><tr>
                <th>${state.lang==='ar'?'المنتج':'Product'}</th><th>${state.lang==='ar'?'الخيار':'Variant'}</th><th>${state.lang==='ar'?'الكمية':'Qty'}</th>
                <th>${state.lang==='ar'?'رمز التتبع':'Tracking code'}</th>
                <th>${state.lang==='ar'?'سعر البيع':'Sell Price'}</th><th>${t('costLabel')}</th><th>${t('supplierLink')}</th>
                <th>${state.lang==='ar'?'الحالة/اللوجستيات':'Status / Logistics'}</th>
                <th>${state.lang==='ar'?'تكلفة الشحن من الصين':'China shipping cost'}</th>
              </tr></thead>
              <tbody>
                ${o.items.map((it,i)=>`
                  <tr>
                    <td>${state.lang==='ar'?it.name_ar:it.name_en}</td>
                    <td>${optionLabel(it)}</td>
                    <td>${it.qty}</td>
                    <td><input type="text" class="font-mono" value="${it.sku||''}" onchange="updateItemSku('${o._dbId}', ${i}, this.value)" style="width:100px;font-size:11px"/></td>
                    <td class="font-mono">${fmt(it.price)}</td>
                    <td class="font-mono">${it.cost!==undefined?fmt(it.cost):'—'}</td>
                    <td>${it.supplierUrl?`<a href="${it.supplierUrl}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">${t('openSupplier')} ↗</a>`:'—'}</td>
                    <td>
                      <select onchange="updateItemStatus('${o._dbId}', ${i}, this.value)" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700">
                        ${ORDER_STATUSES.map(s=>`<option value="${s}" ${(it.status||'confirmed')===s?'selected':''}>${ORDER_STATUS_LABELS[state.lang][s]}</option>`).join('')}

/* ============ CHATBOT (persisted, escalation-capable store support agent) ============
   Shared by the desktop widget and the mobile chat screen — one data/send/subscribe path
   (loadChatHistory/subscribeCustomerChat/sendChatMessage), two render functions
   (renderChat here, mChat() in the mobile section). */
let chatBusy = false;
let customerChatChannel = null;
function scrollChat(){
  setTimeout(()=>{
    const deskBody = document.getElementById('chat-body-el');
    if(deskBody) deskBody.scrollTop = deskBody.scrollHeight;
    if(document.getElementById('m-chat-body-el')){
      const scr = document.querySelector('.mstore .m-scr');
      if(scr) scr.scrollTop = scr.scrollHeight;
    }
    const inp = document.getElementById('chat-input') || document.getElementById('m-chat-input');
    if(inp && document.activeElement!==inp) inp.focus();
  },0);
}
function chatInHumanMode(){
  return !!(state.chatConversation && (state.chatConversation.status==='needs_human' || state.chatConversation.status==='human'));
}
async function loadChatHistory(){
  if(state.chatHistoryLoaded) return;
  state.chatHistoryLoaded = true;
  const c = currentCustomer();
  if(!c) return;
  try{
    const { data: convo, error: convoErr } = await sb.from('chat_conversations').select('*').eq('customer_id', c.id).maybeSingle();
    if(convoErr) throw convoErr;
    if(convo){
      state.chatConversation = convo;
      const { data: msgs, error: msgErr } = await sb.from('chat_messages').select('*').eq('conversation_id', convo.id).order('created_at', {ascending:true});
      if(msgErr) throw msgErr;
      state.chatLog = (msgs||[]).map(m=>({
        role: m.sender==='customer' ? 'user' : 'bot',
        text: m.content,
        kind: m.sender==='admin' ? 'admin' : undefined
      }));
    }
  } catch(e){ console.error('Could not load chat history:', e); }
  render();
  scrollChat();
}
/* Only reacts to admin-authored messages: the customer's own messages and every AI reply
   are already shown via the direct sendChatMessage() response, so re-adding them here from
   realtime would duplicate them. Admin replies are the only thing that arrives out-of-band. */
function subscribeCustomerChat(customerId){
  if(customerChatChannel){ sb.removeChannel(customerChatChannel); customerChatChannel = null; }
  if(!customerId) return;
  customerChatChannel = sb.channel('chat-customer-' + customerId)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'chat_conversations', filter:`customer_id=eq.${customerId}` }, payload=>{
      const prevStatus = state.chatConversation && state.chatConversation.status;
      state.chatConversation = payload.new;
      if(payload.new.status==='human' && prevStatus!=='human'){
        showToast(state.lang==='ar' ? 'انضم أحد أفراد فريقنا إلى المحادثة' : 'A team member joined the chat');
      }
      render();
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages', filter:`customer_id=eq.${customerId}` }, payload=>{
      if(payload.new.sender !== 'admin') return;
      if(state.chatHistoryLoaded){
        state.chatLog.push({role:'bot', text:payload.new.content, kind:'admin'});
        render();
        if(state.chatOpen) scrollChat();
      }
      if(!state.chatOpen){
        showToast(state.lang==='ar' ? '💬 رسالة جديدة من فريقنا' : '💬 New message from our team');
      }
    })
    .subscribe();
}
function unsubscribeCustomerChat(){
  if(customerChatChannel){ sb.removeChannel(customerChatChannel); customerChatChannel = null; }
}
async function sendChatMessage(text){
  if(!text || chatBusy) return;
  if(text.length > AI_MAX_INPUT){ showToast(state.lang==='ar' ? 'السؤال طويل جدًا' : 'Question is too long'); return; }
  const humanMode = chatInHumanMode();
  state.chatLog.push({role:'user', text});
  if(!humanMode) state.chatLog.push({role:'bot', text:'', loading:true});
  chatBusy = true;
  render();
  scrollChat();
  const finish = (msgText)=>{
    if(humanMode) state.chatLog.push({role:'bot', text:msgText});
    else state.chatLog[state.chatLog.length-1] = {role:'bot', text:msgText};
  };
  try{
    const data = await callSupportAPI(text);
    if(data.handoff){
      state.chatConversation = state.chatConversation ? {...state.chatConversation, status:'needs_human'} : {status:'needs_human'};
    }
    const ackText = state.lang==='ar' ? 'تم إرسال رسالتك لفريقنا، سيتواصلون معك قريبًا.' : "We've got your message — our team will reply shortly.";
    finish(data.text || ackText);
  } catch(e){
    finish(state.lang==='ar' ? 'حدث خطأ أثناء الاتصال بالمساعد الذكي. حاول مرة أخرى.' : 'There was an error reaching the AI assistant. Please try again.');
  } finally {
    chatBusy = false;
    render();
    scrollChat();
  }
}
function submitChat(){
  const input = document.getElementById('chat-input');
  if(!input || !input.value.trim() || chatBusy) return;
  const q = input.value.trim();
  input.value='';
  sendChatMessage(q);
}
function mSubmitChat(){
  const input = document.getElementById('m-chat-input');
  if(!input || !input.value.trim() || chatBusy) return;
  const q = input.value.trim();
  input.value='';
  sendChatMessage(q);
}
function chatSuggest(q){
  document.getElementById('chat-input').value = q;
  submitChat();
}
function mChatSuggest(q){
  document.getElementById('m-chat-input').value = q;

}

  const opening = v!==undefined ? v : !state.chatOpen;
  state.chatOpen = opening;

}

  return `

    ${t('chatTitle')}
  </button>
  <div class="chat-panel ${state.chatOpen?'open':''}">
    <div class="chat-head">
      <div><span class="t1">${t('chatTitle')}</span><span class="t2">${t('chatSub')}</span></div>
      <button class="close-btn" style="background:rgba(255,255,255,.15)" onclick="toggleChat(false)">
        <svg class="icon" style="width:13px;height:13px;stroke:#fff" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    ${chatStatusBanner()}
    <div class="chat-body" id="chat-body-el">
      ${state.chatLog.length===0?`<div class="ai-msg bot">${state.lang==='ar'?'أهلًا! كيف بقدر ساعدك اليوم؟':'Hi! How can I help you today?'}</div>`:
        state.chatLog.map(m=>`<div class="ai-msg ${m.role}${m.kind==='admin'?' admin':''}">${m.loading?'<span class="typing-dots"><span></span><span></span><span></span></span>':m.text}</div>`).join('')}
    </div>
    ${!chatInHumanMode()?`<div class="chat-suggest">${suggestions.map(s=>`<button class="chat-chip" onclick="chatSuggest('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}</div>`:''}
    <div class="chat-foot">
      <input id="chat-input" placeholder="${t('chatPlaceholder')}" onkeydown="if(event.key==='Enter')submitChat()" ${chatBusy?'disabled':''}/>
      <button class="chat-send" onclick="submitChat()" ${chatBusy?'disabled':''}><svg class="icon" style="width:15px;height:15px;stroke:#fff" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>`;
}

/* ---- navigation ---- */
function mGo(s){ state.mPrev = state.mScreen; state.mScreen = s; window.scrollTo(0,0); render(); }

function mToggleTheme(){
  const mstore = document.querySelector('.mstore');
  const isDark = state.mTheme === 'light'; // switching TO dark
  state.mTheme = isDark ? 'dark' : 'light';
  try{ localStorage.setItem('mstore-theme', state.mTheme); }catch(e){}
  
  // Create a circular wipe from the toggle button
  const btn = document.querySelector('.m-switch') || document.querySelector('[onclick="mToggleTheme()"]');
  const rect = btn ? btn.getBoundingClientRect() : {left:window.innerWidth/2,top:window.innerHeight/2,width:0,height:0};
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const maxR = Math.hypot(Math.max(cx, window.innerWidth - cx), Math.max(cy, window.innerHeight - cy));
  
  // Overlay that expands from the toggle
  const overlay = document.createElement('div');
  overlay.style.cssText = `position:fixed;left:0;top:0;width:100%;height:100%;z-index:9999;pointer-events:none;`
    + `background:${isDark ? '#1c1a18' : '#f5ead8'};`
    + `clip-path:circle(0px at ${cx}px ${cy}px);`
    + `transition:clip-path .6s cubic-bezier(.4,0,.2,1);`;
  document.body.appendChild(overlay);
  
  // Floating sun/moon icon
  const icon = document.createElement('div');
  icon.innerHTML = isDark ? '🌙' : '☀️';
  icon.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;z-index:10000;font-size:32px;pointer-events:none;`
    + `transform:translate(-50%,-50%) scale(0) rotate(-180deg);`
    + `transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;opacity:1;`;
  document.body.appendChild(icon);
  
  requestAnimationFrame(()=>{
    overlay.style.clipPath = `circle(${maxR}px at ${cx}px ${cy}px)`;
    icon.style.transform = 'translate(-50%,-50%) scale(1.5) rotate(0deg)';
    setTimeout(()=>{
      icon.style.transform = 'translate(-50%,-120px) scale(0.5) rotate(360deg)';
      icon.style.opacity = '0';
    }, 350);
    setTimeout(()=>{
      render();
      overlay.style.opacity = '0';
      overlay.style.transition += ',opacity .2s ease';
      setTimeout(()=>{ overlay.remove(); icon.remove(); }, 250);
    }, 550);
  });
}

function mList(){
  const f = state.listFilter;
  let list = PRODUCTS, title = 'All products', emptyMsg = 'No products here yet';
  if(f && f.type==='cat'){ const c = CATS.find(x=>x.id===f.id); list = PRODUCTS.filter(p=>productInCat(p, f.id)); title = c ? c.en : title; }
  else if(f && f.type==='flag'){
    const tests = { best:p=>p.best, new:p=>p.new, featured:p=>p.featured, offer:p=>p.was>p.price };
    const labels = { best:'Best sellers', new:'New arrivals', featured:'Featured', offer:'Special offers' };
    list = PRODUCTS.filter(tests[f.key] || (()=>false)); title = labels[f.key] || title;

    list = PRODUCTS.filter(p=>state.wishlist.has(p.id)); title = 'Wishlist'; emptyMsg = 'Your wishlist is empty';

  return `
  <div style="animation:fadeIn .25s ease">
    <div class="m-list-head"><div class="m-logo-mark" onclick="this.classList.add('m-logo-bounce');setTimeout(()=>this.classList.remove('m-logo-bounce'),600);mGoHome()"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></div><div class="m-list-title">${title}</div></div>

const PAYMENT_STATUS_LABELS = { pending_verification:'Awaiting payment verification', rejected:'Payment not confirmed', auto_cancelled:'Payment not confirmed' };
function mOrders(){

function mTrack(){
  const o = state.orders.find(x=>x._dbId===state.mTrackDbId) || state.orders[state.orders.length-1];
  if(!o) return mOrders();
  const paymentPending = o.paymentStatus && o.paymentStatus!=='verified';
  const status = paymentPending ? o.paymentStatus : ((o.items[0] && o.items[0].status) || o.status || 'confirmed');
  const idx = Math.max(0, TRACK_STATUSES.indexOf(status));
  const steps = TRACK_STATUSES.map((s,i)=>{
    const done = i < idx, current = i === idx, upcoming = i > idx;
    return {
      label: ORDER_STATUS_LABELS.en[s] || s,
      dotBg: done ? 'var(--acc2)' : (current ? 'var(--acc)' : 'var(--card)'),
      dotBorder: upcoming ? 'var(--line)' : 'transparent',
      lineColor: done ? 'var(--acc2)' : 'var(--line)',
      font: current ? "700 14px/1.3 'Figtree',sans-serif" : "600 13.5px/1.3 'Figtree',sans-serif",
      fg: upcoming ? 'var(--muted)' : 'var(--text)',
      isLast: i===TRACK_STATUSES.length-1
    };
  });
  return `
  <div style="animation:fadeIn .25s ease;padding:8px 20px 26px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
      ${mBackBtn('mBack()')}

      <div class="m-disp" style="font-size:22px;line-height:1.25;margin-bottom:8px">${PAYMENT_STATUS_LABELS[status] || ORDER_STATUS_LABELS.en[status] || status}</div>

    </div>
    ${o.items.some(it=>it.shippingCost!=null)?`<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:12px 0">
      <div style="font:600 10px/1.4 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">China shipping cost</div>
      ${o.items.filter(it=>it.shippingCost!=null).map(it=>`
      <div style="display:flex;justify-content:space-between;font:500 13px/1.5 'Figtree',sans-serif">
        <span style="color:var(--text)">${it.name_en}</span>
        <span class="m-mono" style="color:var(--accInk);font-weight:600">${fmt(it.shippingCost)}</span>
      </div>`).join('')}
    </div>`:''}
    ${paymentPending ? '' : `<div style="background:var(--card);border:1px solid var(--line);border-radius:26px;padding:8px 18px 14px">
      ${steps.map(s=>`
      <div class="m-track-step">
        <div class="m-track-dotcol">
          <div class="m-track-dot" style="background:${s.dotBg};border:2px solid ${s.dotBorder}"></div>
          ${!s.isLast?`<div class="m-track-line" style="background:${s.lineColor}"></div>`:''}
        </div>
        <div style="padding:11px 0">
          <div style="font:${s.font};color:${s.fg};line-height:1.3">${s.label}</div>
        </div>
      </div>`).join('')}
    </div>`}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="m-btn-outline" style="flex:1" onclick="goMyOrders()">All orders</button>

  </div>`;

async function mSaveAccountInfo(){
  const c = currentCustomer();
  if(!c) return;
  const name = document.getElementById('m-acct-name').value.trim();
  const phone = document.getElementById('m-acct-phone').value.trim();
  if(!name){ showToast('Please enter a name'); return; }
  c.name = name; c.phone = phone;
  render();
  try{
    const { error } = await sb.from('customers').update({ name, phone }).eq('id', c.id);
    if(error) throw error;
    showToast('Saved');
  } catch(e){ console.error('Account save failed:', e); showToast('Could not save'); }
}
async function mSubmitChangePassword(){
  const pw1 = document.getElementById('m-acct-new-pw').value;
  const pw2 = document.getElementById('m-acct-new-pw2').value;
  if(pw1.length < 6){ showToast('Password must be at least 6 characters'); return; }
  if(pw1 !== pw2){ showToast('Passwords do not match'); return; }
  try{
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if(error){ showToast(error.message); return; }
    document.getElementById('m-acct-new-pw').value = '';
    document.getElementById('m-acct-new-pw2').value = '';
    showToast('Password changed');
  } catch(e){ console.error('Password change failed:', e); showToast('Could not change password'); }
}

        <div style="font:600 14.5px/1.35 'Figtree',sans-serif">${p.name_en}</div>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="m-btn-outline" style="flex:1" onclick="mCloseSheet()">Keep browsing</button>
      <button class="m-btn-primary" style="flex:1" onclick="mGoCartFromSheet()">View basket</button>
    </div>
  </div>`;
}

function renderMobileApp(){
  state.lang = 'en'; // this UI is English-only; keeps shared logic (GOV_FEES, status labels) consistent
  let body = '';
  if(state.mScreen==='home') body = mHome();
  else if(state.mScreen==='list') body = mList();
  else if(state.mScreen==='product') body = mProduct();
  else if(state.mScreen==='cart') body = mCart();
  else if(state.mScreen==='checkout') body = mCheckout();
  else if(state.mScreen==='paymentInstructions') body = mPaymentInstructions();
  else if(state.mScreen==='confirm') body = mConfirm();
  else if(state.mScreen==='orders') body = mOrders();
  else if(state.mScreen==='track') body = mTrack();
  else if(state.mScreen==='chat') body = mChat();
  else if(state.mScreen==='account') body = mAccount();
  else if(state.mScreen==='page') body = mPolicyPage();
  else body = mHome();
  const showTabbar = state.mScreen!=='confirm' && state.mScreen!=='paymentInstructions';
  return `<div class="mstore" data-theme="${state.mTheme}"><div class="m-scr">${body}</div>${showTabbar?mTabBar():''}${mSheet()}</div>`;
}

function render(){
  const app = document.getElementById('app');
  const showMobileApp = state.currentUserId && state.view!=='admin' && state.view!=='login' && isMobileViewport();
  if(showMobileApp) state.lang = 'en'; // mobile UI is English-only; set before dir/lang below

  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr';

  if(state.view==='login' || !state.currentUserId){
    app.innerHTML = renderLogin();
    document.getElementById('overlay').classList.remove('open');
    return;
  }

  if(showMobileApp){
    app.innerHTML = renderMobileApp() + renderShippingModal();
    document.getElementById('overlay').classList.remove('open');
    const scr = document.querySelector('.m-scr');
    if(scr){ scr.onscroll = updateMobileHeaderFade; }
    if(!window._mHeaderFadeBound){ window.addEventListener('scroll', updateMobileHeaderFade, {passive:true}); window._mHeaderFadeBound = true; }
    updateMobileHeaderFade();
    restoreGalleryScroll('pg-mobile');
    initMobileScrollReveal();
    syncMobileBuybarOffset();
    state.qtyBumpLine = null;
    state.mQtyBump = false;
    return;
  }

  if(state.view==='admin'){
    if(!isAdminUser(currentCustomer())){ state.view='home'; render(); return; }
    app.innerHTML = renderAdmin() + renderChat();
  } else {
    let body = '';
    if(state.view==='home') body = renderHome();
    else if(state.view==='product') body = renderProductPage();
    else if(state.view==='checkout') body = renderCheckout();
    else if(state.view==='paymentInstructions') body = renderPaymentInstructions();
    else if(state.view==='confirm') body = renderConfirm();
    else if(state.view==='orders') body = renderMyOrders();
    else if(state.view==='account') body = renderAccount();
    else if(state.view==='page') body = renderPolicyPage();
    app.innerHTML = impersonateBanner() + renderHeader() + body + renderFooter() + renderDrawer() + renderChat() + renderShippingModal();
  }

  document.getElementById('overlay').classList.toggle('open', state.drawerOpen);
  document.getElementById('overlay').onclick = ()=>{ toggleDrawer(false); };
  updateHeaderShrink();
  markFirstHomePaint();
  initScrollReveal();
  restoreGalleryScroll('pg-desktop');
  /* One-shot bumps: the class is already on the freshly built DOM, so clearing the flags here
     means the animation plays exactly once and never replays on an unrelated render. */
  state.qtyBumpLine = null;
  state.mQtyBump = false;
}
/* The hero/billboard entrance only plays the first time the shop itself appears — not on the
   login screen before it, and not again on every later re-render of the same page. */
let _firstHomePaint = false;
function markFirstHomePaint(){
  if(_firstHomePaint || state.view!=='home' || !state.currentUserId) return;
  _firstHomePaint = true;
  document.body.classList.add('first-load');
  setTimeout(()=>document.body.classList.remove('first-load'), 1600);
}
/* Sections fade/rise in as they enter the viewport. The observer is module-level and re-attached
   after every render() because this app replaces #app's innerHTML wholesale, so every .reveal
   node is a brand-new element each time. Class toggle only — never calls render(). */
let _revealObserver = null;
const _revealedSections = new Set();
function initScrollReveal(){
  if(!('IntersectionObserver' in window)) return;
  if(!_revealObserver){
    _revealObserver = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        en.target.classList.add('in');
        if(en.target.id) _revealedSections.add(en.target.id);
        _revealObserver.unobserve(en.target);
      });
    }, {threshold:.12});
  }
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>{
    /* A section that has already been revealed once is shown immediately on later renders —
       otherwise every unrelated render() (add to cart, wishlist toggle) would replay the whole
       page's entrance animation, which reads as a flicker rather than as motion. */
    if(el.id && _revealedSections.has(el.id)){
      el.style.transition = 'none'; // show it outright: a 0→1 transition here would re-fade the page
      el.classList.add('in');
      return;
    }
    _revealObserver.observe(el);
  });
  initMobileScrollReveal();
}
/* The phone layout scrolls inside .m-scr rather than the window, so its sections need an observer
   rooted on that container — and since render() rebuilds that container, the observer is recreated
   whenever the root element changes identity. */
let _mRevealObserver = null;
let _mRevealRoot = null;
function initMobileScrollReveal(){
  if(!('IntersectionObserver' in window)) return;
  const scr = document.querySelector('.mstore .m-scr');
  if(!scr) return;
  if(_mRevealRoot !== scr){
    _mRevealRoot = scr;
    _mRevealObserver = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        en.target.classList.add('in');
        if(en.target.id) _revealedSections.add(en.target.id);
        _mRevealObserver.unobserve(en.target);
      });
    }, {root: scr, threshold:.1});
  }
  scr.querySelectorAll('.m-reveal:not(.in)').forEach(el=>{
    if(el.id && _revealedSections.has(el.id)){
      el.style.transition = 'none';
      el.classList.add('in');
      return;
    }
    _mRevealObserver.observe(el);
  });
}
/* Tightens the sticky header once the page is scrolled at all — a direct DOM patch, so a scroll
   never triggers a re-render. (The old updateHeroFade(), which faded the flat cedar hero out on
   scroll and collapsed its height to avoid leaving a dead zone, is gone: the hero is now a
   photograph worth keeping on screen, and fading a photo out on the first scroll looked broken.) */
function updateHeaderShrink(){
  const h = document.getElementById('siteHeader');
  if(!h) return;
  h.classList.toggle('shrink', window.scrollY > 40);
}
/* Lines the pinned buy bar up with the tab bar above which it sits. Measured rather than assumed:
   the tab bar's height depends on the device's safe-area inset, and the phone shell is centred
   with its own max-width on wide screens, so the bar has to match its box exactly. */
function syncMobileBuybarOffset(){
  const bar = document.querySelector('.m-buybar');
  const tabbar = document.querySelector('.m-tabbar');
  if(!bar || !tabbar) return;
  const tb = tabbar.getBoundingClientRect();
  bar.style.left = tb.left + 'px';
  bar.style.right = 'auto';
  bar.style.width = tb.width + 'px';
  bar.style.bottom = Math.max(0, Math.round(window.innerHeight - tb.top)) + 'px';
}
function updateMobileHeaderFade(){
  const header = document.getElementById('m-header-sec');
  const scr = document.querySelector('.m-scr');
  if(!header || !scr) return;
  const scrollTop = scr.scrollTop || window.scrollY || 0;
  const p = Math.min(1, scrollTop / 90);
  header.style.opacity = String(1 - p);
  header.style.transform = `translateY(${p*-16}px)`;
  const bb = document.getElementById('m-billboard-sec');
  if(bb){
    const bp = Math.min(1, scrollTop / 220);
    bb.style.opacity = String(1 - bp*0.9);
    bb.style.transform = `scale(${1 - bp*0.06}) translateY(${bp*-30}px)`;
    const inner = bb.querySelector('.m-billboard-inner');
    if(inner) inner.style.transform = `translateY(${scrollTop*0.25}px)`;
  }
}

async function loadSettings(){
  try{
    const { data, error } = await sb.from('settings').select('*').eq('id', 1).single();
    if(!error && data){
      state.settings.deliveryMin = data.delivery_min;
      state.settings.deliveryMax = data.delivery_max;
      if(data.billboard_enabled !== undefined && data.billboard_enabled !== null) state.settings.billboardEnabled = !!data.billboard_enabled;
      if(data.billboard_slides){ try{ state.settings.billboardSlides = JSON.parse(data.billboard_slides); }catch(e){} }
      if(data.shipping_fees) state.settings.shippingFees = data.shipping_fees;
      if(data.coupons) state.settings.coupons = data.coupons;
      state.settings.contactPhone = data.contact_phone || '';
      state.settings.contactEmail = data.contact_email || '';
      state.settings.contactAddress = data.contact_address || '';
      if(data.social_links) state.settings.socialLinks = data.social_links;
      if(data.promo_enabled !== undefined && data.promo_enabled !== null) state.settings.promoEnabled = !!data.promo_enabled;
      if(data.promo_popup){ try{ state.settings.promo = Object.assign({}, state.settings.promo, JSON.parse(data.promo_popup)); }catch(e){} }
      state.settings.wishAccountName = data.wish_account_name || '';
      state.settings.wishAccountNumber = data.wish_account_number || '';
      state.settings.wishInstructions = data.wish_instructions || '';
    }
  } catch(e){
    console.error('Could not load settings:', e);
  }
  applySettingsDerived();
}
/* The four content loads are independent of one another, but used to be awaited one after the
   next. The database is in ap-northeast-1 (Tokyo) and the shop's customers are in Lebanon, so
   each `await` was a ~300ms round trip spent staring at an empty #app — four of them in a row
   before a single pixel of the store existed. Issued together they cost one round trip, not four.
   allSettled rather than all: one failing table must not take the whole storefront down with it,
   which is what the four separate try/catch blocks were there to guarantee. */
function loadStoreData(){
  return Promise.allSettled([
    loadSettings(), loadCategories(), loadPublicProducts(), loadReviews()
  ]).then(results=>{
    const names = ['settings','categories','products','reviews'];
    results.forEach((r,i)=>{ if(r.status==='rejected') console.error(`Could not load ${names[i]}:`, r.reason); });
    /* loadReviews() ends by deriving every product's rating from the reviews it just fetched —
       which silently did nothing if reviews happened to land before products. Running it once
       more here makes the arrival order of those two requests irrelevant. */
    recomputeProductRatings();
  });
}
async function initApp(){
  const dataReady = loadStoreData();
  const isRecoveryLink = window.location.hash.includes('type=recovery') || window.location.search.includes('type=recovery');
  let session = null;
  try{
    ({ data:{ session } } = await sb.auth.getSession());
  } catch(e){
    console.error('Session restore failed:', e);
  }
  /* A visitor who is not signed in lands on the login screen, and that screen needs no store
     data whatsoever — no products, categories, reviews or settings appear on it. It used to be
     withheld until all four finished anyway, which meant a first-time visitor (the person most
     likely to give up) waited on a catalogue they could not yet see. Paint it now; the data
     carries on loading behind the form and is ready by the time they finish typing. */
  if(!session){ render(); await dataReady; return; }
  if(isRecoveryLink){ state.authMode = 'recovery'; render(); return; }
  await dataReady;   // the home page, unlike the login screen, genuinely needs the catalogue
  try{
    const c = await findOrCreateCustomer({ email: session.user.email, method:'password' });
    if(c){
      completeLogin(c);
      if(window.location.hash === '#admin-payments' && isAdminUser(c)){
        state.view = 'admin'; state.adminView = 'payments';
        refreshAdminData(); loadPaymentProofUrls(); render();
      }
      return;
    }
  } catch(e){
    console.error('Session restore failed:', e);
  }
  render();
}
let _resizeT = null;
let _lastWidth = window.innerWidth;
window.addEventListener('resize', ()=>{
  clearTimeout(_resizeT);
  _resizeT = setTimeout(()=>{
    /* A mobile on-screen keyboard sliding up also fires 'resize' (it shrinks the viewport
       height), which would re-render the whole app — and yank focus off whatever input the
       customer had just tapped into — every time they started typing. Only react to an actual
       width change (real resize/rotation/breakpoint crossing), which a keyboard never causes. */
    if(window.innerWidth === _lastWidth) return;
    _lastWidth = window.innerWidth;
    if(state.currentUserId) render();
  }, 150);
});
window.addEventListener('scroll', updateHeaderShrink, {passive:true});
/* Advances the hero carousel. It only ever cross-fades the hero's own layers (never render(), and
   never a full outerHTML swap), so it cannot steal focus from the search bar or any other field on
   the page — the bug this codebase has hit twice before, see CLAUDE.md items 19-20. It also stands
   down while the tab is hidden, and entirely when the visitor has asked for reduced motion. */
let _billboardTimer = setInterval(()=>{
  if(!state.currentUserId) return; // the hero only exists once logged in
  if(document.hidden) return;      // no point animating a tab nobody is looking at
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const slides = state.settings.billboardSlides;
  if(!state.settings.billboardEnabled || !slides || slides.length<=1) return;
  /* state.view stays 'home' for the whole mobile session (mGo() only changes state.mScreen), so
     the phone needs its own check — otherwise this fires on search, checkout and account too. */
  const onHome = isMobileViewport() ? state.mScreen==='home' : state.view==='home';
  if(!onHome) return;
  crossfadeHeroTo(state.billboardIndex + 1);
}, 6500);
/* An uploaded photo's best fit depends on the frame's shape, which changes when the window does. */
window.addEventListener('resize', refitHeroLayers, {passive:true});
/* Products only ever loaded once, on initApp() — a customer already browsing never saw anything
   an admin added later without a full page reload. Poll quietly for new/removed products and only
   re-render on an actual count change (not just a price/stock tweak on something already visible),
   and only while sitting on the plain home view with no field focused, so this can't steal focus
   or wipe an in-progress form the way past render()-in-a-timer bugs did (see billboard timer above). */
let _productsRefreshTimer = setInterval(()=>{
  if(!state.currentUserId || state.view!=='home') return;
  const el = document.activeElement;
  if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.isContentEditable)) return;
  const before = PRODUCTS.length;
  loadPublicProducts().then(()=>{
    if(PRODUCTS.length !== before) render();
  }).catch(e=>console.error('Product refresh failed:', e));
}, 60000);
initApp();
</script>
