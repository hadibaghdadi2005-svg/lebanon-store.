async function findOrCreateCustomer({name, email, phone, method}){
  email = (email||'').trim().toLowerCase();
  phone = (phone||'').trim();
  try{
    let existing = null;
    const orFilters = [];
    if(email) orFilters.push(`email.eq.${email}`);
    if(phone) orFilters.push(`phone.eq.${phone}`);
    if(orFilters.length){
      const { data, error } = await sb.from('customers').select('*').or(orFilters.join(',')).limit(1);
      if(error) throw error;
      if(data && data.length) existing = data[0];
    }
    let row;
    if(existing){
      const updates = {};
      if(name) updates.name = name;
      if(email) updates.email = email;
      if(phone) updates.phone = phone;
      const { data, error } = await sb.from('customers').update(updates).eq('id', existing.id).select().single();
      if(error) throw error;
      row = data;
    } else {
      const insertRow = { name: name || (state.lang==='ar'?'زبون':'Customer'), email, phone, method, cart: [], wishlist: [] };
      const { data, error } = await sb.from('customers').insert(insertRow).select().single();
      if(error) throw error;
      row = data;
    }
    const c = dbRowToCustomer(row);
    const idx = state.customers.findIndex(x=>x.id===c.id);
    if(idx>=0) state.customers[idx] = c; else state.customers.push(c);
    return c;
  } catch(e){
    console.error('Login/database error:', e);
    showToast(state.lang==='ar' ? 'تعذر الاتصال بقاعدة البيانات، تحقق من الاتصال وحاول مجددًا' : 'Could not reach the database — check your connection and try again');
    return null;
  }
}
/* ============ REALTIME ORDER TRACKING ============ */
let customerOrderChannel = null;
function subscribeCustomerOrders(customerId){
  if(customerOrderChannel){ sb.removeChannel(customerOrderChannel); customerOrderChannel = null; }
  if(!customerId) return;
  customerOrderChannel = sb.channel('orders-customer-' + customerId)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'orders', filter:`customer_id=eq.${customerId}` }, payload=>{
      const updated = dbRowToOrder(payload.new);
      const idx = state.orders.findIndex(o=>o._dbId===updated._dbId);
      if(idx>=0) state.orders[idx] = updated; else state.orders.push(updated);
      showToast(state.lang==='ar' ? `تم تحديث حالة الطلب ${updated.num}` : `Order ${updated.num} was updated`);
      render();
    })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'orders', filter:`customer_id=eq.${customerId}` }, payload=>{
      const idx = state.orders.findIndex(o=>o._dbId===payload.old.id);
      if(idx>=0){ state.orders.splice(idx,1); render(); }
    })
    .subscribe();
}
function unsubscribeCustomerOrders(){
  if(customerOrderChannel){ sb.removeChannel(customerOrderChannel); customerOrderChannel = null; }
}
let adminOrdersChannel = null;
function subscribeAdminOrders(){
  if(adminOrdersChannel) return;
  adminOrdersChannel = sb.channel('orders-admin-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, ()=>{ refreshAdminData(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'customers' }, ()=>{ refreshAdminData(); })
    .subscribe();
}

let adminChatChannel = null;
function subscribeAdminChats(){
  if(adminChatChannel) return;

    .on('postgres_changes', { event:'*', schema:'public', table:'chat_conversations' }, payload=>{

      }
      loadAdminChats();

async function loadAdminChats(){
  try{
    const { data: convos, error } = await sb.from('chat_conversations').select('*').order('updated_at', {ascending:false});
    if(error) throw error;
    const ids = (convos||[]).map(c=>c.id);
    const lastMsgs = {};
    if(ids.length){
      const { data: msgs } = await sb.from('chat_messages').select('conversation_id, content, sender, created_at').in('conversation_id', ids).order('created_at', {ascending:false});
      (msgs||[]).forEach(m=>{ if(!lastMsgs[m.conversation_id]) lastMsgs[m.conversation_id] = m; });
    }
    state.adminChats = (convos||[]).map(c=>({...c, lastMessage: lastMsgs[c.id]||null}));
    if(state.adminSelectedChat) await refreshAdminChatThread();
    render();
  } catch(e){ console.error('Could not load chats:', e); }
}
async function refreshAdminChatThread(){
  try{
    const { data, error } = await sb.from('chat_messages').select('*').eq('conversation_id', state.adminSelectedChat).order('created_at', {ascending:true});
    if(error) throw error;
    state.adminChatThread = data||[];

async function sendAdminChatReply(id){
  const input = document.getElementById('admin-chat-reply');
  if(!input || !input.value.trim()) return;
  const content = input.value.trim();
  input.value = '';
  const convo = state.adminChats.find(c=>c.id===id);

  try{
    const { error: msgErr } = await sb.from('chat_messages').insert({ conversation_id:id, customer_id:convo.customer_id, sender:'admin', content });

}

function completeLogin(c){
  if(c.blocked && !isAdminUser(c)){
    sb.auth.signOut();
    state.currentUserId = null;
    state.view = 'login';
    showToast(state.lang==='ar' ? 'تم تعليق هذا الحساب. يرجى التواصل مع الدعم.' : 'This account has been suspended. Please contact support.');
    render();
    return;
  }
  state.currentUserId = c.id;
  loadCustomerCart(c);
  state.authMode = 'signin';
  state.loginForm = {};
  state.formData.fullName = c.name || '';
  state.formData.phone = c.phone || '';
  state.formData.email = c.email || '';
  state.formData.city = c.city || '';
  state.formData.area = c.area || '';
  state.formData.building = c.building || '';
  state.formData.floor = c.floor || '';
  state.formData.apartment = c.apartment || '';
  state.formData.address = c.address || '';
  state.formData.notes = c.notes || '';
  state.selectedGov = c.gov || null;
  state.view = 'home';
  subscribeCustomerOrders(c.id);
  subscribeCustomerChat(c.id);
  if(isAdminUser(c)){ subscribeAdminChats(); loadAdminChats(); }
  window.scrollTo(0,0);
  render();
  /* Let the home page paint first — the popup sits over it, so showing it in the same frame
     makes the store look like it loaded as an ad rather than as a shop.
     The wait is also a bandwidth decision, not just a visual one: the promo media is the
     single heaviest file on the page (a 3.28 MB GIF as things stand), so it must not be in
     flight while the product photos a customer actually came for are still arriving. Idle
     time means "the shop has settled"; the timeout is the ceiling for a browser that never
     goes idle, and the plain setTimeout is the fallback for Safari, which has no rIC. */
  if(window.requestIdleCallback) requestIdleCallback(maybeShowPromo, {timeout:4000});
  else setTimeout(maybeShowPromo, 1500);
}
/* ============ REAL AUTH (Supabase Auth — email + password) ============
   Identity is verified by Supabase itself (the account owner is whoever knows
   the password / can confirm the email), not just typed into a form. This is
   what makes the ★ Admin check on ADMIN_EMAIL above actually mean something. */
async function submitAuth(){
  const f = state.loginForm;
  const email = (f.email||'').trim().toLowerCase();
  const password = f.password || '';
  const isAr = state.lang==='ar';
  if(!email || !password){
    showToast(isAr ? 'يرجى تعبئة البريد الإلكتروني وكلمة المرور' : 'Please fill in your email and password');
    return;
  }
  if(state.authMode==='signup' && !f.name){
    showToast(isAr ? 'يرجى تعبئة الاسم الكامل' : 'Please fill in your full name');
    return;
  }
  if(state.authMode==='signup' && password.length < 6){
    showToast(isAr ? 'كلمة المرور يجب أن تكون 6 أحرف على الأقل' : 'Password must be at least 6 characters');
    return;
  }
  if(state.authBusy) return;
  state.authBusy = true;
  showToast(isAr ? 'جارٍ التحقق...' : 'Verifying...');
  try{
    if(state.authMode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name:f.name } } });
      if(error){ showToast(error.message); return; }
      if(!data.session){
        showToast(isAr ? 'تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيده ثم سجّل الدخول.' : 'Account created! Check your email to confirm it, then sign in.');
        state.authMode = 'signin';
        state.loginForm = { email };
        render();
        return;
      }
      const c = await findOrCreateCustomer({ name:f.name, email:data.session.user.email, method:'password' });
      if(!c) return;
      completeLogin(c);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        showToast(isAr ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة' : 'Incorrect email or password');
        return;
      }
      const c = await findOrCreateCustomer({ email:data.session.user.email, method:'password' });
      if(!c) return;
      completeLogin(c);
    }
  } finally {
    state.authBusy = false;
  }
}
async function submitForgotPassword(){
  const isAr = state.lang==='ar';
  const email = (state.loginForm.email||'').trim().toLowerCase();
  if(!email){ showToast(isAr?'يرجى إدخال بريدك الإلكتروني':'Please enter your email'); return; }
  if(state.authBusy) return;

    state.authMode = 'signin';
  } catch(e){
    console.error('Password reset request failed:', e);
    showToast(isAr?'تعذر الإرسال':'Could not send the reset link');
  } finally {
    state.authBusy = false; render();
  }
}
async function submitRecoveryPassword(){
  const isAr = state.lang==='ar';
  const pw1 = document.getElementById('recovery-pw1').value;
  const pw2 = document.getElementById('recovery-pw2').value;
  if(pw1.length < 6){ showToast(isAr?'كلمة المرور يجب أن تكون 6 أحرف على الأقل':'Password must be at least 6 characters'); return; }
  if(pw1 !== pw2){ showToast(isAr?'كلمتا المرور غير متطابقتين':'Passwords do not match'); return; }

    state.authBusy = false; render();

/* ============ PRODUCT OPTIONS ============
   A product has up to two independent option dimensions: `variants` (the original list, used for
   colour) and `sizes` (added for clothing and footwear, where colour alone isn't enough to say
   what the customer actually wants). Sizes are optional and most products have none, so every
   read goes through productSizes() and the whole size UI is skipped when it comes back empty.
   Unlike a variant, a size is never auto-picked: shipping a shoe in a size the customer never
   chose is a return, so an unset size blocks the add instead of silently defaulting to the first. */
function productSizes(p){ return (p && Array.isArray(p.sizes) && p.sizes.length) ? p.sizes : []; }
function needsSize(p){ return productSizes(p).length > 0; }
/* "Black · 42" — the human label for a chosen combination, used in the cart, the checkout
   summary, the order confirmation and every order/tracking view. Also handles orders placed
   before sizes existed, whose items simply have no size field. */
function optionLabel(o){ return [o && o.variant, o && o.size].filter(Boolean).join(' · '); }

/* ============ CART LOGIC ============
   Cart lines are keyed on product + variant + size, so Black/42 and Black/43 are two lines.
   Mutations address a line by its index in state.cart rather than by re-matching those three
   values back out of an HTML attribute — with free-text option names that string round-trip
   was a quoting bug waiting to happen. */
function sameCartLine(l, id, variant, size){
  return l.id===id && l.variant===variant && (l.size||null)===(size||null);
}
function addToCart(id, variant, qty, size){
  const p = findProduct(id);
  if(!p) return false;
  qty = qty || 1;
  variant = variant || p.variants[0];
  const sizes = productSizes(p);
  if(sizes.length && !size){
    showToast(state.lang==='ar' ? 'يرجى اختيار المقاس أولًا' : 'Please choose a size first');
    return false;
  }
  size = sizes.length ? size : null;
  const existing = state.cart.find(l=>sameCartLine(l, id, variant, size));
  if(existing){ existing.qty += qty; }
  else { state.cart.push({id, variant, size, qty}); }
  syncCustomerCart();
  showToast(t('addedToCart'));
  /* Same "added" confirmation everywhere an add-to-cart button lives (grid card, product
     page): render once with justAddedId set so the button shows its checkmark/green state,
     then a single follow-up render clears it. One-shot, user-triggered — not a background
     interval — so this doesn't repeat the render()-in-a-timer bug from CLAUDE.md items 19-20. */
  state.justAddedId = id;
  render();
  clearTimeout(window._addedBtnTimer);
  window._addedBtnTimer = setTimeout(()=>{
    if(state.justAddedId===id){ state.justAddedId = null; render(); }
  }, 1300);
  return true;
}
/* Adds whatever the customer currently has selected on the product page (both layouts). */
function addSelectedToCart(id, qty){
  const p = findProduct(id);
  if(!p) return false;
  return addToCart(id, state.modalVariant || p.variants[0], qty || 1, state.modalSize || null);
}
/* The card's one-tap add can't ask for a size, so a sized product opens instead of guessing. */
function quickAdd(id){
  const p = findProduct(id);
  if(!p) return;
  if(needsSize(p)){
    openProduct(id);
    showToast(state.lang==='ar' ? 'اختر المقاس أولًا' : 'Choose a size first');
    return;
  }
  addToCart(id, p.variants[0], 1);
}
function removeCartLine(i){
  if(i<0 || i>=state.cart.length) return;
  const drop = ()=>{ state.cart.splice(i,1); syncCustomerCart(); render(); };
  /* Let the line slide out and collapse before the state change rebuilds the drawer — an
     instant vanish reads as a glitch rather than as a confirmation. Direct DOM patch only,
     no render() until the animation is done. */
  const line = document.querySelector('.cart-line[data-line="'+i+'"], .m-cart-line[data-line="'+i+'"]');
  if(!line){ drop(); return; }
  line.classList.add('removing');
  setTimeout(drop, 300);
}
function changeCartQty(i, delta){
  const line = state.cart[i];
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0) removeCartLine(i);
  else { state.qtyBumpLine = i; syncCustomerCart(); render(); }
}
function cartCount(){ return state.cart.reduce((s,l)=>s+l.qty,0); }
function cartSubtotal(){
  return state.cart.reduce((s,l)=>{
    const p = findProduct(l.id);
    return p ? s + p.price*l.qty : s;
  },0);
}
function deliveryFee(){
  if(!state.selectedGov) return 0;
  const sub = cartSubtotal();
  if(sub >= FREE_DELIVERY_MIN) return 0;
  return GOV_FEES[state.lang][state.selectedGov] ?? 0;
}
function discountAmount(){
  if(!state.coupon) return 0;
  const sub = cartSubtotal();
  if(state.coupon.type==='pct') return +(sub*state.coupon.value/100).toFixed(2);
  return state.coupon.value;
}
function cartTotal(){
  return Math.max(0, cartSubtotal() - discountAmount() + deliveryFee());
}
function toggleWishlist(id){
  if(state.wishlist.has(id)){ state.wishlist.delete(id); showToast(t('removedFromWish')); }
  else { state.wishlist.add(id); showToast(t('addedToWish')); }
  syncCustomerCart();
  render();
}

/* ============ AI AGENT (REAL — calls the Claude API) ============ */
function specsFor(p){ return state.lang==='ar' ? p.specs.ar : p.specs.en; }
const AI_MAX_INPUT = 400;
const AI_LANG_NOTE = { ar:'أجب دائمًا باللغة العربية، بإيجاز ووضوح (جملة إلى ثلاث جمل).', en:'Always answer in English, briefly and clearly (one to three sentences).' };

function buildCatalogContext(){
  return PRODUCTS.map(p=>{
    const specStr = Object.entries(specsFor(p)).map(([k,v])=>`${k}: ${v}`).join(', ');
    const catList = productCats(p).map(id=>{ const c=CATS.find(x=>x.id===id); return c?catName(c):id; }).join(', ');
    return `- "${pname(p)}" | SKU ${p.sku} | categories: ${catList}${p.was>p.price?' | on offer':''} | price: $${p.price}${p.was>p.price?` (was $${p.was})`:''} | stock: ${p.stock} units | rating: ${p.reviews>0?`${p.rating}/5 (${p.reviews} reviews)`:'no reviews yet'} | specs: ${specStr}`;
  }).join('\n');
}
function buildStoreSystemPrompt(){
  const govLines = Object.entries(GOV_FEES[state.lang]).map(([g,f])=>`${g}: $${f}`).join(', ');
  const lastOrder = state.orders[state.orders.length-1];
  const orderLine = lastOrder
    ? `The current customer has one order on file: #${lastOrder.num}, status "${ORDER_STATUS_LABELS.en[lastOrder.status]}", total $${lastOrder.total.toFixed(2)}, placed ${lastOrder.date}, estimated delivery ${state.settings.deliveryMin}-${state.settings.deliveryMax} days from order date.`
    : `The current customer has no orders on file yet.`;
  return `You are the customer support agent for "HABIBI", an online store serving Lebanon. ${AI_LANG_NOTE[state.lang]}
Ground every answer strictly in the store data listed below. Never invent or guess prices, stock levels, delivery fees, specifications, or order details that aren't listed here — if something isn't covered, say plainly that the information isn't available and suggest contacting support.
You only have access to the current customer's own order — never claim to know about any other customer's orders or data.
You only handle questions about the HABIBI store itself (products, prices, stock, categories, shipping, delivery time, coupons, returns, or the customer's own order). If the customer asks about anything else, use the escalate_to_human tool instead of answering.
Be warm and concise.

PRODUCT CATALOG:
${buildCatalogContext()}

DELIVERY FEES BY GOVERNORATE: ${govLines}. Free delivery on orders over $${FREE_DELIVERY_MIN}.
ESTIMATED DELIVERY TIME: ${state.settings.deliveryMin}-${state.settings.deliveryMax} business days from order confirmation.
RETURN POLICY: Items can be returned within 7 days of delivery if still in original condition.
COUPONS: ${(state.settings.coupons||[]).filter(c=>c.active!==false).map(c=>`code "${c.code}" gives ${c.type==='pct'?c.value+'% off':'$'+c.value+' off'}`).join('; ') || 'no active coupons right now'}.
${orderLine}`;
}
function buildProductSystemPrompt(p){
  const specStr = Object.entries(specsFor(p)).map(([k,v])=>`${k}: ${v}`).join(', ');
  return `You are a product assistant answering questions about ONE specific product on "HABIBI". ${AI_LANG_NOTE[state.lang]}
Only use the facts about this product listed below. Never invent specifications, materials, dimensions, or capabilities that aren't listed. If asked about something not covered, say plainly that this information isn't available for this product.

PRODUCT: ${pname(p)}
SKU: ${p.sku}
Description: ${pdesc(p)}
Price: $${p.price}${p.was>p.price?` (was $${p.was})`:''}
Stock: ${p.stock} units
Available options: ${(p.variants||[]).join(', ') || 'none'}
Available sizes: ${productSizes(p).join(', ') || 'this product has no size options'}
Rating: ${p.reviews>0?`${p.rating}/5 (${p.reviews} reviews)`:'no reviews yet'}
Specifications: ${specStr}`;
}
/* Both call the ai-chat Supabase Edge Function, which holds the Anthropic API key
   server-side. See supabase/functions/ai-chat/index.ts. */
async function callProductAI(systemPrompt, historyMessages){
  const { data, error } = await sb.functions.invoke('ai-chat', { body: { mode:'product', system:systemPrompt, messages:historyMessages } });
  if(error) throw error;
  const text = (data && data.text || '').trim();
  return text || (state.lang==='ar' ? 'عذرًا، لم أتمكن من إيجاد إجابة مناسبة.' : "Sorry, I couldn't find a good answer.");
}
/* The persisted, escalation-capable store-support chat. The function finds-or-creates the
   customer's one conversation, stores this message, and either answers or hands off to a
   human — see the Edge Function for the full flow. */
async function callSupportAPI(message){
  const c = currentCustomer();
  const { data, error } = await sb.functions.invoke('ai-chat', { body: {
    mode:'support', customerId:c.id, customerName:c.name, system:buildStoreSystemPrompt(), message, lang:state.lang
  } });
  if(error) throw error;
  return data || {};
}

/* Shared by both the public (cost/supplier-free) and admin (full) product fetches */
function applyProductRows(data){
  const toRemove = [];
  data.forEach(row=>{
    const existing = row.is_custom ? PRODUCTS.find(p=>p.id===row.id) : findProduct(row.id);
    if(row.is_custom && !existing){
      if(row.deleted) return; // never existed on this device — skip entirely
      const cats = (row.cats && row.cats.length) ? row.cats : (row.cat ? [row.cat] : []);
      const catInfo = CATS.find(c=>c.id===cats[0]);
      PRODUCTS.push({
        id: row.id, cat: cats[0] || null, cats, icon: catInfo ? catInfo.icon : 'offers',
        color: PRODUCTS.length % PALETTE.length,
        name_ar: row.name_ar || 'منتج', name_en: row.name_en || 'Product',
        desc_ar: row.desc_ar || '', desc_en: row.desc_en || '',
        sku: row.sku || ('LB-NEW-' + row.id),
        price: row.price!=null?Number(row.price):0, was: row.was!=null?Number(row.was):(row.price!=null?Number(row.price):0),
        stock: row.stock!=null?Number(row.stock):0, rating:0, reviews:0,
        best: !!row.best, featured: !!row.featured, new: row.new!=null?!!row.new:true,
        cost: row.cost!=null?Number(row.cost):0, marginPct:0, supplierUrl: row.supplier_url || '',
        weight: row.weight!=null?Number(row.weight):null,
        specs:{ar:{}, en:{}}, variants: (row.variants && row.variants.length) ? row.variants : ['Standard'],
        sizes: (row.sizes && row.sizes.length) ? row.sizes : [],
        imageUrl: row.image_url || null, imageUrls: row.image_urls || [], isCustom:true
      });
    } else {
      /* Also handles is_custom rows already loaded locally (e.g. from an earlier public-only
         fetch that had no cost/supplier_url/weight) — without this branch, a later admin fetch
         with the real values would be silently skipped and those fields would look "reset". */
      const p = existing;
      if(!p) return;
      if(row.deleted){ toRemove.push(row.id); return; }
      if(row.price!=null) p.price = Number(row.price);
      if(row.was!=null) p.was = Number(row.was);
      if(row.stock!=null) p.stock = Number(row.stock);
      if(row.cost!=null) p.cost = Number(row.cost);
      if(row.supplier_url!=null) p.supplierUrl = row.supplier_url;
      if(row.weight!=null) p.weight = Number(row.weight);
      if(row.sku) p.sku = row.sku;
      if(row.cats && row.cats.length){ p.cats = row.cats; p.cat = row.cats[0]; const ci = CATS.find(c=>c.id===p.cat); if(ci) p.icon = ci.icon; }
      if(row.variants && row.variants.length) p.variants = row.variants;
      /* Assigned even when empty: clearing a product's sizes in the admin panel has to reach
         the customer, not merely fail to overwrite the old list. */
      if(row.sizes !== undefined) p.sizes = row.sizes || [];
      if(row.featured!=null) p.featured = row.featured;
      if(row.best!=null) p.best = row.best;
      if(row.new!=null) p.new = row.new;
      if(row.desc_ar) p.desc_ar = row.desc_ar;
      if(row.desc_en) p.desc_en = row.desc_en;
      if(row.image_url) p.imageUrl = row.image_url;
      if(row.image_urls) p.imageUrls = row.image_urls;
    }
  });
  toRemove.forEach(id=>{
    const idx = PRODUCTS.findIndex(p=>p.id===id);
    if(idx>=0) PRODUCTS.splice(idx,1);
  });
}

async function refreshAdminData(){
  try{
    const [custRes, orderRes, costRes] = await Promise.all([
      sb.from('customers').select('*').order('created_at', {ascending:false}),
      sb.from('orders').select('*').order('created_at', {ascending:true}),
      sb.from('order_item_costs').select('*')
    ]);
    if(!custRes.error && custRes.data) state.customers = custRes.data.map(dbRowToCustomer);
    if(!orderRes.error && orderRes.data){
      state.orders = orderRes.data.map(dbRowToOrder);
      if(!costRes.error && costRes.data){
        const byOrder = {};
        costRes.data.forEach(c=>{ (byOrder[c.order_id] ||= {})[c.item_index] = c; });
        state.orders.forEach(o=>{
          const costs = byOrder[o._dbId];
          if(!costs) return;
          o.items.forEach((it, i)=>{
            if(costs[i]){ it.cost = Number(costs[i].cost); it.supplierUrl = costs[i].supplier_url || ''; }
          });
        });
      }
    }
    render();
  } catch(e){
    console.error('Admin data refresh failed:', e);
    showToast(state.lang==='ar' ? 'تعذر تحديث البيانات' : 'Could not refresh data');
  }
}

async function adminToggleBlockCustomer(id){

  const msg = next ? (isAr?'هل تريد تعليق حساب هذا العميل؟ لن يتمكن من تسجيل الدخول.':"Suspend this customer's account? They won't be able to sign in.")

  c.blocked = next;
  render();

    if(error) throw error;
    logAdminAction(next?'block_customer':'unblock_customer', { customer_id: id, email: c.email });

function currentAiLog(pid){ return state.aiLogByProduct[pid] || []; }
const aiBusy = {};
function scrollAiLog(pid){
  setTimeout(()=>{
    const log = document.getElementById('ai-log-'+pid);
    if(log) log.scrollTop = log.scrollHeight;
    const inp = document.getElementById('ai-q-input');
    if(inp) inp.focus();
  },0);

async function submitProductQuestion(pid){
  const input = document.getElementById('ai-q-input');
  if(!input || !input.value.trim() || aiBusy[pid]) return;
  const q = input.value.trim();
  if(q.length > AI_MAX_INPUT){ showToast(state.lang==='ar' ? 'السؤال طويل جدًا' : 'Question is too long'); return; }
  const p = findProduct(pid);
  if(!state.aiLogByProduct[pid]) state.aiLogByProduct[pid] = [];
  state.aiLogByProduct[pid].push({role:'user', text:q});
  state.aiLogByProduct[pid].push({role:'bot', text:'', loading:true});
  input.value = '';
  aiBusy[pid] = true;
  render();
  scrollAiLog(pid);
  try{
    const history = state.aiLogByProduct[pid].filter(m=>!m.loading).map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
    const answer = await callProductAI(buildProductSystemPrompt(p), history);
    const log = state.aiLogByProduct[pid];
    log[log.length-1] = {role:'bot', text:answer};
  } catch(e){
    const log = state.aiLogByProduct[pid];
    log[log.length-1] = {role:'bot', text: state.lang==='ar' ? 'حدث خطأ أثناء الاتصال بالمساعد الذكي. حاول مرة أخرى.' : 'There was an error reaching the AI assistant. Please try again.'};
  } finally {
    aiBusy[pid] = false;
    render();
    scrollAiLog(pid);
  }
}

/* Shared swipeable photo gallery for the desktop product page and mobile product screen.
   idPrefix namespaces the track/dots element ids so both can exist in the DOM without
   colliding (they never do, since mobile/desktop render exclusively, but keeps this safe). */
function renderPhotoGallery(p, idPrefix, fallbackIconHtml){
  const photos = productPhotos(p);
  const color = PALETTE[p.color % PALETTE.length];
  if(!photos.length){
    return `<div class="gallery-track" style="background:${color}"><div class="gallery-slide">${fallbackIconHtml}</div></div>`;
  }
  return `
  <div class="gallery-track" id="${idPrefix}-track" onscroll="updateGalleryDots('${idPrefix}')">
    ${/* Only the first frame is on screen; the rest are a swipe away, so they load on demand. */''}
    ${photos.map((url,i)=>`<div class="gallery-slide" style="background:${color}"><img src="${url}" alt="${p.name_en}" ${i===0?'fetchpriority="high"':'loading="lazy"'} decoding="async"></div>`).join('')}
  </div>
  ${photos.length>1?`
  <div class="billboard-dots" id="${idPrefix}-dots">
    ${photos.map((_,i)=>`<button class="billboard-dot ${i===0?'active':''}" onclick="scrollGalleryTo('${idPrefix}',${i})"></button>`).join('')}
  </div>`:''}`;
}
/* Direct DOM patch only — no state mutation triggering render() — so scrolling the gallery
   never fights an in-progress interaction (this app has a history of exactly that bug from
   timers/scroll handlers calling a full render(), see CLAUDE.md items 19-20). */
function updateGalleryDots(idPrefix){
  const track = document.getElementById(idPrefix+'-track');
  const dots = document.getElementById(idPrefix+'-dots');
  if(!track || !dots) return;
  const idx = Math.round(track.scrollLeft / track.clientWidth);
  state.galleryIndex = idx;
  [...dots.children].forEach((d,i)=>d.classList.toggle('active', i===idx));
}
function scrollGalleryTo(idPrefix, idx){
  const track = document.getElementById(idPrefix+'-track');
  if(!track) return;
  track.scrollTo({ left: idx*track.clientWidth, behavior:'smooth' });
}
/* Re-applies the current photo index after a full render() rebuilds the DOM (e.g. picking a
   variant swatch), since innerHTML replacement would otherwise silently snap back to photo 1. */
function restoreGalleryScroll(idPrefix){
  const track = document.getElementById(idPrefix+'-track');
  if(!track || !state.galleryIndex) return;
  track.scrollLeft = state.galleryIndex * track.clientWidth;
}

function updateForm(field, val, el){
  state.formData[field] = val;
  /* Clear that field's error as soon as it's filled. Direct DOM patch, never a render() —
     this form deliberately doesn't re-render on keystroke, which is what keeps focus stable. */
  if(el && state.checkoutErrors && state.checkoutErrors[field] && String(val).trim()){
    delete state.checkoutErrors[field];
    const wrap = el.closest('.form-field'); // desktop: error state lives on the wrapper
    if(wrap){
      wrap.classList.remove('field-error');
      const msg = wrap.querySelector('.field-err-msg');
      if(msg) msg.remove();
    } else if(el.classList.contains('m-input')){ // phone: it lives on the pill input itself
      el.classList.remove('field-error');
      const msg = el.nextElementSibling;
      if(msg && msg.classList.contains('m-field-err')) msg.remove();
    }
  }
}
function applyCoupon(){
  const code = (state.couponInput||'').trim().toUpperCase();
  if(COUPONS[code] && COUPONS[code].active!==false){ state.coupon = COUPONS[code]; showToast(state.lang==='ar'?'تم تطبيق الرمز!':'Coupon applied!'); }
  else { state.coupon = null; showToast(state.lang==='ar'?'رمز غير صالح':'Invalid coupon'); }
  render();
}
function selectGov(g){
  state.selectedGov = g;
  if(g && state.checkoutErrors) delete state.checkoutErrors.gov;
  render();
}

/* Items in these categories are treated as electronics/battery items for the shipping notice */
function cartHasElectronics(){
  return state.cart.some(l=>{ const p = findProduct(l.id); return p && (productCats(p).includes('electronics') || productCats(p).includes('phones')); });
}
function openShippingModal(){
  const f = state.formData;
  /* Mark the specific fields that are missing, so the customer sees which ones rather than
     just a toast telling them something, somewhere, is empty. */
  const errs = {};
  if(!f.fullName) errs.fullName = true;
  if(!f.phone) errs.phone = true;
  if(!state.selectedGov) errs.gov = true;
  if(!f.city) errs.city = true;
  if(!f.address) errs.address = true;
  if(Object.keys(errs).length){
    state.checkoutErrors = errs;
    showToast(state.lang==='ar'?'يرجى تعبئة الحقول المطلوبة':'Please fill in the required fields');
    render();
    const firstBad = document.querySelector('.form-field.field-error input, .form-field.field-error select');
    if(firstBad){ firstBad.scrollIntoView({behavior:'smooth', block:'center'}); firstBad.focus({preventScroll:true}); }
    return;
  }
  state.checkoutErrors = {};
  state.shippingModalOpen = true;
  state.shippingModalCountdown = 3;
  render();
  const tick = ()=>{
    state.shippingModalCountdown--;
    render();
    if(state.shippingModalCountdown > 0) setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
}
function closeShippingModal(){
  state.shippingModalOpen = false;
  state.shippingModalCountdown = 3;
  render();
}
function confirmShippingAndPlaceOrder(){
  if(state.shippingModalCountdown > 0) return;
  /* placeOrder() awaits the network before its own render(), so this modal stays on screen
     for the whole request — without this the button just sits there looking un-clicked. */
  const btn = document.querySelector('.ship-ack-btn');
  if(btn){ btn.classList.add('loading'); btn.disabled = true; }
  state.shippingModalOpen = false;
  state.shippingModalCountdown = 3;
  placeOrder();
}
function renderShippingModal(){
  if(!state.shippingModalOpen) return '';
  const isAr = state.lang==='ar';
  const ready = state.shippingModalCountdown <= 0;
  const hasElectronics = cartHasElectronics();
  const fee = deliveryFee();
  return `
  <div class="ship-modal-overlay">
    <div class="ship-modal">
      <div class="ship-modal-icon">📦</div>
      <h3>${isAr?'قبل تأكيد الطلب':'Before You Confirm'}</h3>
      <p>${isAr
        ? `رسوم التوصيل تُحتسب حسب المحافظة (${fee===0?'مجانية لطلبك الحالي':fmt(fee)+' لطلبك الحالي'})، وهي مجانية تلقائيًا للطلبات فوق $${FREE_DELIVERY_MIN}. المدة المتوقعة للتوصيل ${state.settings.deliveryMin}-${state.settings.deliveryMax} يومًا.`
        : `Delivery is charged as a flat fee based on your governorate (${fee===0?'free for your current order':fmt(fee)+' for your current order'}), and is automatically free on orders over $${FREE_DELIVERY_MIN}. Estimated delivery time is ${state.settings.deliveryMin}-${state.settings.deliveryMax} days.`}</p>
      ${hasElectronics?`
      <div class="ship-modal-note">⚠️ ${isAr?'طلبك يحتوي على منتج إلكتروني — قد تستغرق شحنات الإلكترونيات وقتًا أطول قليلاً بسبب قيود شحن البطاريات.':'Your order includes an electronic item — electronics shipments can take slightly longer due to battery shipping restrictions.'}</div>`:''}
      <button class="btn btn-primary btn-block ship-ack-btn ${ready?'ready':''}" ${ready?'':'disabled'} onclick="confirmShippingAndPlaceOrder()">
        ${ready ? (isAr?'✅ فهمت، تابع الطلب':'✅ I Get It — Continue') : (isAr?`فهمت (${state.shippingModalCountdown})`:`I Get It (${state.shippingModalCountdown})`)}
      </button>
      <button class="ship-modal-cancel" onclick="closeShippingModal()">${isAr?'إلغاء':'Cancel'}</button>
    </div>
  </div>`;
}

async function placeOrder(){
  const f = state.formData;
  if(!f.fullName || !f.phone || !state.selectedGov || !f.city || !f.address){
    showToast(state.lang==='ar'?'يرجى تعبئة الحقول المطلوبة':'Please fill in the required fields');
    return;
  }
  const num = 'LB-' + new Date().getFullYear() + '-' + String(Math.floor(100000+Math.random()*899999)).slice(0,6);
  const items = state.cart.filter(l=>findProduct(l.id)).map(l=>{
    const p = findProduct(l.id);
    return { id:p.id, name_ar:p.name_ar, name_en:p.name_en, variant:l.variant, size:l.size||null, qty:l.qty, price:p.price, sku:p.sku, status:'confirmed' };
  });
  const c = currentCustomer();
  const orderRow = {
    customer_id: c ? c.id : null,
    num, order_date: new Date().toISOString().slice(0,10), items,
    total: cartTotal(), gov: state.selectedGov, customer_name: f.fullName, phone: f.phone,
    status: 'confirmed', delivery_min: state.settings.deliveryMin, delivery_max: state.settings.deliveryMax,
    payment_status: 'pending_verification'
  };
  showToast(state.lang==='ar' ? 'جارٍ إرسال الطلب...' : 'Placing your order...');
  let order;
  try{
    const { data, error } = await sb.from('orders').insert(orderRow).select().single();
    if(error) throw error;
    order = dbRowToOrder(data);
  } catch(e){
    console.error('Order placement failed:', e);
    showToast(state.lang==='ar' ? 'تعذر إرسال الطلب، حاول مرة أخرى' : 'Could not place the order, please try again');
    return;
  }
  state.orders.push(order);
  state.cart = [];
  state.coupon = null;
  syncCustomerCart();
  if(c){
    const addrFields = {
      name: f.fullName||c.name, phone: f.phone||c.phone,
      gov: state.selectedGov, city: f.city||'', area: f.area||'', building: f.building||'',
      floor: f.floor||'', apartment: f.apartment||'', address: f.address||'', notes: f.notes||''
    };
    Object.assign(c, addrFields);
    sb.from('customers').update(addrFields).eq('id', c.id)
      .then(({error})=>{ if(error) console.error('Address save failed:', error); });
  }
  if(isMobileViewport()){ state.mPrev = state.mScreen; state.mScreen = 'paymentInstructions'; }
  else { state.view = 'paymentInstructions'; }
  window.scrollTo(0,0);
  render();
}
/* Each item in an order carries its own logistics status, since items in the same order
   can ship separately. This updates just that one line item, not the whole order. */
async function updateItemStatus(dbId, itemIndex, status){
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o || !o.items[itemIndex]) return;
  o.items[itemIndex].status = status;
  render();
  try{
    const { error } = await sb.from('orders').update({ items: o.items }).eq('id', dbId);
    if(error) throw error;
  } catch(e){
    console.error('Item status update failed:', e);
    showToast(state.lang==='ar' ? 'تعذر حفظ الحالة' : 'Could not save the status');
  }
}
/* Lets admin attach a supplier tracking code to an already-placed order's item,
   separate from the product's own SKU (each purchase from the supplier gets its own). */
async function updateItemSku(dbId, itemIndex, sku){
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o || !o.items[itemIndex]) return;
  o.items[itemIndex].sku = sku.trim();
  render();
  try{
    const { error } = await sb.from('orders').update({ items: o.items }).eq('id', dbId);
    if(error) throw error;
  } catch(e){
    console.error('Item SKU update failed:', e);
    showToast(state.lang==='ar' ? 'تعذر حفظ الرمز' : 'Could not save the code');
  }
}
/* The China-to-Lebanon shipping cost is only known once the item is actually received by our
   agent in China, so it's entered per order-item (like the SKU) rather than guessed up front.
   It's shown to the customer as an informational line — it's not collected as extra payment. */
async function updateItemShippingCost(dbId, itemIndex, value){
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o || !o.items[itemIndex]) return;
  const n = parseFloat(value);
  o.items[itemIndex].shippingCost = (value==='' || isNaN(n)) ? null : n;
  render();
  try{
    const { error } = await sb.from('orders').update({ items: o.items }).eq('id', dbId);
    if(error) throw error;
  } catch(e){
    console.error('Item shipping cost update failed:', e);
    showToast(state.lang==='ar' ? 'تعذر حفظ تكلفة الشحن' : 'Could not save the shipping cost');
  }
}
/* Screenshots live in the private payment-proofs bucket, so admin needs a signed URL per
   order rather than a plain public URL — fetched once when entering the Payments tab. */
async function loadPaymentProofUrls(){
  const withProof = state.orders.filter(o=>o.paymentStatus==='pending_verification' && o.paymentProofPath && !state.adminPaymentProofUrls[o._dbId]);
  for(const o of withProof){
    try{
      const { data, error } = await sb.storage.from('payment-proofs').createSignedUrl(o.paymentProofPath, 300);
      if(error) throw error;
      state.adminPaymentProofUrls[o._dbId] = data.signedUrl;
      render();
    } catch(e){
      console.error('Could not load payment screenshot:', e);
    }
  }
}
async function verifyPayment(dbId){
  const isAr = state.lang==='ar';
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o) return;
  o.paymentStatus = 'verified';
  render();
  try{
    const { error } = await sb.from('orders').update({ payment_status:'verified' }).eq('id', dbId);
    if(error) throw error;
    logAdminAction('verify_payment', { order_id: dbId, order_num: o.num });
    showToast(isAr?'تم تأكيد الدفع':'Payment verified');
  } catch(e){
    console.error('Verify payment failed:', e);
    showToast(isAr?'تعذر تأكيد الدفع':'Could not verify the payment');
  }
}
async function rejectPayment(dbId){
  const isAr = state.lang==='ar';
  if(!confirm(isAr?'هل تريد رفض هذا الدفع؟ سيتم إلغاء الطلب.':'Reject this payment? The order will be cancelled.')) return;
  const o = state.orders.find(o=>o._dbId===dbId);

  o.paymentStatus = 'rejected';
  render();
  try{
    const { error } = await sb.from('orders').update({ payment_status:'rejected' }).eq('id', dbId);
    if(error) throw error;
    logAdminAction('reject_payment', { order_id: dbId, order_num: o.num });
    showToast(isAr?'تم رفض الدفع وإلغاء الطلب':'Payment rejected, order cancelled');
  } catch(e){
    console.error('Reject payment failed:', e);
    showToast(isAr?'تعذر رفض الدفع':'Could not reject the payment');
  }
}
async function deleteOrder(dbId){
  const isAr = state.lang==='ar';
  if(!confirm(isAr ? 'هل تريد حذف هذا الطلب نهائيًا؟ لا يمكن التراجع عن هذا.' : 'Delete this order permanently? This can\'t be undone.')) return;
  const idx = state.orders.findIndex(o=>o._dbId===dbId);
  if(idx>=0) state.orders.splice(idx,1);

function setPaymentProofMode(mode){ state.paymentProofMode = mode; state.paymentProofFile = null; render(); }
function handleProofFileSelect(event){
  const file = event.target.files && event.target.files[0];
  state.paymentProofFile = file || null;
  render();
}
/* Reads the selected screenshot as base64 and posts it (or a typed reference) to the
   submit-payment-proof Edge Function, which verifies the caller owns the order, stores
   the proof, and emails the admin — see supabase/functions/submit-payment-proof/index.ts. */
async function submitPaymentProof(dbId){
  const isAr = state.lang==='ar';
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o) return;
  const body = { order_id: dbId };
  if(state.paymentProofMode==='reference'){
    if(!state.paymentProofReference.trim()){
      showToast(isAr?'يرجى إدخال رقم العملية':'Please enter the transaction reference');
      return;
    }
    body.reference = state.paymentProofReference.trim();
  } else {
    if(!state.paymentProofFile){
      showToast(isAr?'يرجى اختيار صورة':'Please choose a screenshot');
      return;
    }
    try{
      const dataUrl = await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(state.paymentProofFile);
      });
      body.screenshot_base64 = dataUrl.split(',')[1] || '';
      body.screenshot_ext = (state.paymentProofFile.name.split('.').pop() || 'jpg').toLowerCase();
    } catch(e){
      console.error('Reading screenshot failed:', e);
      showToast(isAr?'تعذرت قراءة الصورة':'Could not read the screenshot');
      return;
    }
  }
  state.paymentSubmitting = true;
  render();
  try{
    const { data, error } = await sb.functions.invoke('submit-payment-proof', { body });
    if(error) throw error;
    if(data && data.error) throw new Error(data.error);
    o.paymentSubmittedAt = new Date().toISOString();
    if(body.reference) o.paymentReference = body.reference;
    state.paymentProofFile = null;
    state.paymentProofReference = '';
    showToast(isAr?'تم إرسال إثبات الدفع، سنتحقق منه قريبًا':"Payment confirmation sent — we'll verify it shortly");
    if(isMobileViewport()){ state.mScreen = 'confirm'; } else { state.view = 'confirm'; }
  } catch(e){
    console.error('Submit payment proof failed:', e);
    showToast(isAr?'تعذر إرسال إثبات الدفع، حاول مرة أخرى':'Could not submit, please try again');
  } finally{
    state.paymentSubmitting = false;
    render();
  }
}

async function doNewsletterSignup(inputId){
  const isAr = state.lang==='ar';
  const input = document.getElementById(inputId);
  const email = (input.value||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showToast(isAr?'يرجى إدخال بريد إلكتروني صالح':'Please enter a valid email');
    return;
  }
  try{
    const { error } = await sb.from('newsletter_subscribers').insert({ email });
    if(error && error.code !== '23505') throw error; // 23505 = already subscribed, treat as success
    input.value = '';
    showToast(isAr?'تم الاشتراك!':'Subscribed!');
  } catch(e){
    console.error('Newsletter signup failed:', e);
    showToast(isAr?'تعذر الاشتراك':'Could not subscribe');
  }
}

/* Real sales for the last 7 calendar days, aggregated from state.orders (replaces the old
   MOCK_SALES placeholder — orders carry a plain 'YYYY-MM-DD' date string, see dbRowToOrder). */
function last7DaysSales(){
  const days = [];
  for(let i=6;i>=0;i--){
    const dt = new Date();
    dt.setDate(dt.getDate()-i);
    const key = dt.toISOString().slice(0,10);
    const label = dt.toLocaleDateString('en-US', {weekday:'short'});
    const v = state.orders.filter(o=>o.date===key).reduce((s,o)=>s+(o.total||0),0);
    days.push({d:label, v});
  }
  return days;
}
function adminStats(){
  const totalStock = PRODUCTS.reduce((s,p)=>s+p.stock,0);
  const low = PRODUCTS.filter(p=>p.stock>0 && p.stock<=5).length;
  const outOf = PRODUCTS.filter(p=>p.stock===0).length;
  const totalSales = last7DaysSales().reduce((s,d)=>s+d.v,0);
  return {totalStock, low, outOf, totalSales};
}
/* Persists any product-field edit to the database so it survives refreshes and shows for everyone */
function syncProductField(id, fields){
  sb.from('products').upsert({ id, ...fields }, { onConflict:'id' })
    .then(({error})=>{ if(error) console.error('Product sync failed:', error); });
}

}

function adminToggleCategory(id, catId, checked){
  const p = findProduct(id);
  const cur = new Set(productCats(p));
  if(checked) cur.add(catId); else cur.delete(catId);
  const cats = Array.from(cur);
  p.cats = cats;
  p.cat = cats[0] || null; // keep the legacy single-category field as "primary" for anything still reading it
  const catInfo = CATS.find(c=>c.id===p.cat);
  if(catInfo) p.icon = catInfo.icon;
  render();
  syncProductField(id, { cats, cat: p.cat });
}

function openProductEditor(id){ state.adminEditingProduct = state.adminEditingProduct===id ? null : id; render(); }
function deleteProduct(id){
  const p = findProduct(id);
  if(!p) return;
  const msg = state.lang==='ar' ? `هل تريد حذف "${p.name_ar}" نهائيًا؟ لا يمكن التراجع عن هذا.` : `Delete "${p.name_en}" permanently? This can't be undone.`;
  if(!confirm(msg)) return;
  syncProductField(id, { deleted: true });
  logAdminAction('delete_product', { product_id: id, name_en: p.name_en });
  const idx = PRODUCTS.findIndex(x=>x.id===id);
  if(idx>=0) PRODUCTS.splice(idx,1);
  if(state.adminEditingProduct===id) state.adminEditingProduct = null;
  showToast(state.lang==='ar' ? 'تم حذف المنتج' : 'Product deleted');
  render();
}

async function submitNewProduct(){
  const isAr = state.lang==='ar';
  const nameAr = document.getElementById('new-name-ar').value.trim();
  const nameEn = document.getElementById('new-name-en').value.trim();
  const cats = Array.from(document.querySelectorAll('.new-cat-check:checked')).map(el=>el.value);
  const price = Number(document.getElementById('new-price').value) || 0;
  const cost = Number(document.getElementById('new-cost').value) || 0;
  const stock = Number(document.getElementById('new-stock').value) || 0;
  const weightRaw = document.getElementById('new-weight').value.trim();
  const weight = weightRaw ? Number(weightRaw) : null;
  const descAr = document.getElementById('new-desc-ar').value.trim();
  const descEn = document.getElementById('new-desc-en').value.trim();
  const variantsRaw = document.getElementById('new-variants').value.trim();
  const variants = variantsRaw ? variantsRaw.split(',').map(v=>v.trim()).filter(Boolean) : ['Standard'];
  /* Sizes stay empty unless the admin types some — an empty list is what tells the whole app
     this product has no size choice, so it must not fall back to a placeholder the way
     variants does. */
  const sizesRaw = document.getElementById('new-sizes').value.trim();
  const sizes = sizesRaw ? sizesRaw.split(',').map(v=>v.trim()).filter(Boolean) : [];
  if(!nameAr || !nameEn){
    showToast(isAr ? 'يرجى إدخال اسم المنتج بالعربي والإنكليزي' : 'Please enter a product name in both languages');
    return;
  }
  /* The admin panel loads existing custom products from the DB asynchronously (goAdmin() doesn't
     block on it), so PRODUCTS locally can be missing rows that already exist server-side. Basing
     the new id purely on the local array risked colliding with one of those rows — the upsert
     below would then silently merge the new product's fields into the existing one instead of
     creating a separate row, making the older product look corrupted/"disappeared". Cross-check
     the real max id in the DB right before picking one. */
  const localMax = Math.max(0, ...PRODUCTS.map(p=>p.id));
  let dbMax = 0;
  try{
    const { data } = await sb.from('products').select('id').order('id', {ascending:false}).limit(1);
    if(data && data.length) dbMax = data[0].id;
  } catch(e){ console.error('Could not verify next product id:', e); }
  const newId = Math.max(localMax, dbMax) + 1;
  const primaryCat = cats[0] || null;
  const catInfo = CATS.find(c=>c.id===primaryCat);
  const sku = 'LB-NEW-' + newId;
  const newProduct = {
    id:newId, cat:primaryCat, cats, icon: catInfo?catInfo.icon:'offers', color: PRODUCTS.length % PALETTE.length,
    name_ar:nameAr, name_en:nameEn, desc_ar:descAr, desc_en:descEn, sku,
    price, was:price, stock, rating:0, reviews:0, best:false, featured:false, new:true,
    cost, weight, marginPct:0, supplierUrl:'', specs:{ar:{}, en:{}}, variants, sizes, imageUrl:null, imageUrls:[], isCustom:true
  };
  PRODUCTS.push(newProduct);
  state.adminAddingProduct = false;
  state.adminEditingProduct = newId;
  render();
  /* Wait for the DB write to actually confirm before telling the admin it worked — syncProductField
     used to fire-and-forget, so a failed insert (e.g. an RLS hiccup) still showed a success toast
     and the "added" product would just be gone again on the next reload with no visible error. */
  const { error } = await sb.from('products').upsert({
    id:newId, is_custom:true, name_ar:nameAr, name_en:nameEn, cat:primaryCat, cats, sku, price, cost, stock, weight,
    desc_ar:descAr, desc_en:descEn, variants, sizes, deleted:false, new:true, featured:false, best:false
  }, { onConflict:'id' });
  if(error){
    console.error('Product creation failed to save:', error);
    showToast(isAr ? 'تعذر حفظ المنتج في القاعدة، حاول مجددًا' : 'Could not save the product — please try again');
    const idx = PRODUCTS.findIndex(p=>p.id===newId);
    if(idx>=0) PRODUCTS.splice(idx,1);
    if(state.adminEditingProduct===newId) state.adminEditingProduct = null;
    render();
    return;
  }
  showToast(isAr ? 'تمت إضافة المنتج! يمكنك الآن إضافة صورة له' : 'Product added! You can now add a photo to it');
}

async function addReview(productId){
  const isAr = state.lang==='ar';
  const name = document.getElementById('new-review-name-'+productId).value.trim();
  const rating = Number(document.getElementById('new-review-rating-'+productId).value);
  const text = document.getElementById('new-review-text-'+productId).value.trim();
  if(!name || !text){ showToast(isAr?'يرجى تعبئة الاسم والنص':'Please fill in the name and text'); return; }
  const { data, error } = await sb.from('reviews').insert({ product_id:productId, customer_name:name, rating, review_text:text }).select().single();
  if(error){ console.error('Add review failed:', error); showToast(isAr?'تعذر الإضافة':'Could not add'); return; }
  REVIEWS.unshift({ id:data.id, name_en:data.customer_name, rating:data.rating, prod:data.product_id, en:data.review_text, date:data.review_date });
  recomputeProductRatings();
  render();
}
async function deleteReview(id){
  const { error } = await sb.from('reviews').delete().eq('id', id);
  if(error){ console.error('Delete review failed:', error); return; }
  REVIEWS = REVIEWS.filter(r=>r.id!==id);
  recomputeProductRatings();
  render();
}

/* Lazily migrates a legacy single-photo product to the array form the first time its
   photos are edited, so old products work the same as ones that started with a gallery. */
function ensureProductPhotoArray(p){
  if(!p.imageUrls || !p.imageUrls.length) p.imageUrls = p.imageUrl ? [p.imageUrl] : [];
  return p.imageUrls;
}
function syncProductPhotos(p){
  syncProductField(p.id, { image_urls: p.imageUrls, image_url: p.imageUrl });
}
function adminAddImageUrl(id){
  const input = document.getElementById('image-url-'+id);
  const url = input.value.trim();
  if(!url) return;
  const p = findProduct(id);
  ensureProductPhotoArray(p).push(url);
  p.imageUrl = p.imageUrls[0];
  input.value = '';
  syncProductPhotos(p);
  showToast(state.lang==='ar' ? 'تم إضافة الصورة' : 'Photo added');
  render();
}
function removeProductPhoto(id, idx){
  const p = findProduct(id);
  ensureProductPhotoArray(p).splice(idx, 1);
  p.imageUrl = p.imageUrls[0] || null;
  syncProductPhotos(p);
  render();
}
async function handleProductPhotoUpload(event, id){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    showToast(state.lang==='ar' ? 'يرجى اختيار ملف صورة' : 'Please choose an image file');
    return;
  }
  const heavy = heavyUploadWarning(file);
  showToast(state.lang==='ar' ? 'جارٍ رفع الصورة...' : 'Uploading image...');
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `product-${id}-${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('product-images').upload(path, file, { upsert:true });
    if(upErr) throw upErr;
    const { data } = sb.storage.from('product-images').getPublicUrl(path);
    const p = findProduct(id);
    ensureProductPhotoArray(p).push(data.publicUrl);
    p.imageUrl = p.imageUrls[0];
    syncProductPhotos(p);
    if(heavy) showToast(heavy, 9000);
    else showToast(state.lang==='ar' ? 'تم رفع الصورة!' : 'Image uploaded!');
    render();
  } catch(e){
    console.error('Image upload failed:', e);
    showToast(state.lang==='ar' ? 'تعذر رفع الصورة، تحقق من إعداد التخزين' : 'Could not upload the image — check storage setup');
  }
}

/* Every customer downloads whatever gets uploaded here — on a phone, on Lebanese mobile data,
   before the shop is usable — and nothing in this panel used to say so. That is how a 9.85 MB
   billboard video and a 3.28 MB promo GIF ended up on the live homepage: both uploaded without
   complaint, and neither looks like a problem from the admin's own desk on wifi.
   This warns rather than blocks — it is the owner's store, and a deliberate heavy upload is
   theirs to make — and words its advice from the actual file type. */
const HEAVY_UPLOAD_MB = 2;
/* Returns the warning text, or '' when the file is a reasonable weight. It deliberately does not
   toast by itself: the upload handlers finish with a "File uploaded!" toast, which would simply
   replace anything shown beforehand — so the caller substitutes this for that success message. */
function heavyUploadWarning(file){
  const mb = file.size / (1024*1024);
  if(mb <= HEAVY_UPLOAD_MB) return '';
  const type = file.type || '';
  const advice = type.startsWith('video/')
    ? 'Re-export it around 1600x500, H.264, under 2 MB.'
    : type === 'image/gif'
      ? 'A GIF is the heaviest way to ship animation - the same clip as an MP4 is usually 10x smaller.'
      : 'Resize it to about 1600px wide and save as JPEG at ~75% quality.';
  return `Uploaded, but it is ${mb.toFixed(1)} MB. Every visitor downloads this on mobile data. ${advice}`;
}
/* One place to end an upload, so the size warning can never be clobbered by the success toast. */
function toastUploadDone(warning){
  if(warning) showToast(warning, 9000);
  else showToast(state.lang==='ar' ? 'تم رفع الملف!' : 'File uploaded!');
}
async function handleBillboardSlideUpload(event, idx){
  const file = event.target.files[0];
  if(!file) return;
  const heavy = heavyUploadWarning(file);
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `billboard-${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('product-images').upload(path, file, { upsert:true, contentType: file.type || undefined });
    if(upErr) throw upErr;
    const { data } = sb.storage.from('product-images').getPublicUrl(path);
    /* Trust the file itself over whatever the Type dropdown happens to say. A slide left on
       "Video" while a photo was uploaded rendered a <video> pointing at a .png, which browsers
       can't play — the slide showed as an empty coloured panel with only its text on it. */
    const actualType = (file.type||'').startsWith('video/') ? 'video'
      : (file.type||'').startsWith('image/') ? 'image'
      : null;
    if(actualType && state.settings.billboardSlides[idx].type !== actualType){
      updateBillboardSlide(idx, 'type', actualType);
    }
    updateBillboardSlide(idx, 'mediaUrl', data.publicUrl);
    toastUploadDone(heavy);
  } catch(e){
    console.error('Billboard slide upload failed:', e);
    showToast(state.lang==='ar' ? 'تعذر رفع الملف' : 'Could not upload the file');
  }
}
/* ============ PROMO POPUP ============
   A small centred card on the home page carrying an image or a short video. It is shown once per
   page load — every visit and every refresh, for customers and the admin alike — and nothing about
   the dismissal is remembered across loads (per the store owner's explicit instruction). Closing it
   only sets an in-memory flag, so it does not pop back up while navigating around the same load.
   Lives in #promo-root (outside #app) and is written with direct DOM calls rather than through
   render(), because render() rebuilds #app on every state change — including from background
   timers — which would restart the video from frame one every few seconds. */
let _promoShownThisLoad = false;
function closePromo(){
  const root = document.getElementById('promo-root');
  document.removeEventListener('keydown', promoKeyHandler);
  if(!root) return;
  const backdrop = root.firstElementChild;
  if(!backdrop){ root.innerHTML = ''; return; }
  backdrop.classList.add('is-closing');       // let the exit play, then clear
  setTimeout(()=>{ if(root.firstElementChild === backdrop) root.innerHTML = ''; }, 210);
}

/* ---- Promo media weight ----------------------------------------------------------------
   The promo is a ~10 MB MP4 that autoplays on every visit. Two things soften that without
   touching the file itself:

   1. The first time it plays on a device, one frame is captured to a canvas and kept in
      localStorage. From then on the card paints that frame instantly as the video's poster, so
      the popup is never an empty black rectangle while 10 MB streams in.
   2. If the visitor has Data Saver on, or is on a 2G-class connection, the video isn't requested
      at all — they get the stored frame instead. Nobody on a metered Lebanese connection should
      pay for a 10 MB autoplay they didn't ask for.

   Both degrade quietly: no stored frame yet just means a shimmer for a moment, and everything is
   wrapped in try/catch because private-mode browsers throw on localStorage access. */
function promoPosterKey(url){ return 'habibi-promo-poster:' + url; }
function readPromoPoster(url){
  try{ return localStorage.getItem(promoPosterKey(url)) || ''; }catch(e){ return ''; }
}
function capturePromoPoster(video, url){
  try{
    if(!video.videoWidth || readPromoPoster(url)) return;
    const canvas = document.createElement('canvas');
    canvas.width = 480;
    canvas.height = Math.round(480 * (video.videoHeight / video.videoWidth)) || 600;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    localStorage.setItem(promoPosterKey(url), canvas.toDataURL('image/jpeg', 0.72));
  }catch(e){ /* tainted canvas, quota, or private mode — the popup works fine without a poster */ }
}
/* Whether this visitor should be spared a multi-megabyte decorative autoplay file.
   Worth being blunt about why this exists: the billboard slide live on the site is a 9.85 MB
   MP4 and the promo is a 3.28 MB GIF, and `autoplay` makes a browser fetch the whole video
   regardless of preload="metadata" — so a phone was pulling ~13 MB of pure decoration before
   the shop was usable. Both have a still image standing in for them, so skipping costs a
   campaign its motion, not its message.
   navigator.connection is Chromium-only (absent on iOS Safari and Firefox), which is why the
   viewport check is the fallback rather than the other way round: a phone is the device where
   this hurts most and the one where we can least often measure the connection. */
function shouldSkipHeavyMedia(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(c){
    if(c.saveData) return true;                                   // explicit "I am paying per MB"
    if(['slow-2g','2g','3g'].includes(c.effectiveType)) return true;
  }
  return isMobileViewport();
}
function promoShouldSkipVideo(){ return shouldSkipHeavyMedia(); }
/* What the card shows while the video is still on its way. A stored frame from a previous visit is
   the best match, but on a first visit there isn't one — and measured against the live file, that
   is a ten-second empty rectangle. So it falls back to a photo the page has already downloaded
   anyway (the hero's still, or the newest product's photo), which paints immediately. */
function promoStandInImage(url){
  const stored = readPromoPoster(url);
  if(stored) return stored;
  const still = heroStill();
  if(still) return still;
  const newest = [...PRODUCTS].sort((a,b)=>b.id-a.id).find(p=>productPhotos(p).length);
  return newest ? productPhotos(newest)[0] : '';
}
function promoKeyHandler(e){ if(e.key === 'Escape') closePromo(); }
function promoClickThrough(){
  const p = state.settings.promo || {};
  closePromo();
  if(p.linkType === 'category') { isMobileViewport() ? mFilterByCat(p.linkValue) : filterByCat(p.linkValue); }
  else if(p.linkType === 'url') window.open(p.linkValue, '_blank');
}
function maybeShowPromo(){
  const p = state.settings.promo;
  if(!state.settings.promoEnabled || !p || !p.mediaUrl) return;
  if(!state.currentUserId) return;            // never over the login screen
  if(state.view !== 'home' || state.listFilter) return;
  if(isMobileViewport() && state.mScreen !== 'home') return;
  if(_promoShownThisLoad) return;             // once per page load, reset by any refresh
  _promoShownThisLoad = true;
  const root = document.getElementById('promo-root');
  if(!root || root.firstChild) return;        // already on screen
  const hasLink = p.linkType && p.linkType !== 'none' && !!p.linkValue;
  const closeLabel = state.lang==='ar' ? 'إغلاق' : 'Close';
  const isVideo = p.type === 'video';
  const standIn = isVideo ? promoStandInImage(p.mediaUrl) : '';
  /* Data Saver or a 2G-class connection: don't pull ten megabytes nobody asked for. */
  const skipVideo = isVideo && promoShouldSkipVideo() && !!standIn;
  let media = '';
  if(isVideo){
    /* The stand-in paints first and the video fades in over it once it can actually play, so the
       card is never an empty rectangle — on a first visit the video needs about ten seconds. */
    if(standIn) media += `<img class="promo-standin" src="${standIn}" alt="" aria-hidden="true">`;
    if(!skipVideo){
      media += `<video src="${p.mediaUrl}" crossorigin="anonymous" autoplay muted loop playsinline
        preload="metadata" ${standIn?'style="opacity:0"':''}
        oncanplay="this.style.opacity=1;this.parentNode.classList.remove('is-waiting');capturePromoPoster(this,'${p.mediaUrl}')"></video>`;
    }
  } else {
    /* Low priority and async decoding on purpose. An animated GIF is the worst format a promo
       can be in — no hardware decode, and the live one is 3.28 MB, roughly fifteen product
       photos' worth — so it queues behind the shop rather than in front of it. The real fix for
       a file that size is to re-upload it as an MP4, which the admin panel now warns about. */
    media = `<img src="${p.mediaUrl}" alt="${(p.title||'').replace(/"/g,'&quot;')}"
      fetchpriority="low" decoding="async"
      onload="this.parentNode.classList.remove('is-waiting')"/>`;
  }
  root.innerHTML = `
    <div class="promo-backdrop" role="dialog" aria-modal="true" aria-label="${state.lang==='ar'?'إعلان':'Promotion'}" onclick="if(event.target===this)closePromo()">
      <div class="promo-grain"></div>
      <div class="promo-card">
        <div class="promo-sparkle"></div><div class="promo-sparkle"></div><div class="promo-sparkle"></div><div class="promo-sparkle"></div><div class="promo-sparkle"></div><div class="promo-sparkle"></div>
        <button class="promo-close" aria-label="${closeLabel}" onclick="closePromo()">&times;</button>
        <div class="promo-media${(isVideo && !standIn) ? ' is-waiting' : ''}">${media}</div>
        <div class="promo-rule"></div>
        ${(p.title || p.subtitle || hasLink) ? `
        <div class="promo-body">
          ${p.title?`<div class="promo-title">${p.title}</div>`:''}
          ${p.subtitle?`<div class="promo-sub">${p.subtitle}</div>`:''}
          ${hasLink?`<button class="promo-cta" onclick="promoClickThrough()">${p.buttonLabel || (state.lang==='ar'?'تسوق الآن':'Shop now')}</button>
          <button class="promo-dismiss" onclick="closePromo()">${state.lang==='ar'?'لا شكرًا':'No thanks'}</button>`:''}
        </div>` : ''}
      </div>
    </div>`;
  document.addEventListener('keydown', promoKeyHandler);
  const btn = root.querySelector('.promo-close');
  if(btn) btn.focus();
}
/* The hero and the billboard used to be two stacked blocks fighting for the top of the page —
   a flat cedar panel of text, then a photo carousel underneath. They are now one photographic
   hero: the admin's own billboard slide fills it when there is one (so campaign control is
   unchanged, dots and all), and otherwise it falls back to the newest product's own photo so a
   shop with no campaign set still leads with merchandise rather than a blank colour. */
function heroMedia(){
  const slides = (state.settings.billboardEnabled && state.settings.billboardSlides) || [];
  const withMedia = slides.filter(s=>s && s.mediaUrl);
  if(withMedia.length){
    const s = slides[state.billboardIndex % slides.length];
    if(s && s.mediaUrl) return { slide:s, slides, url:s.mediaUrl, isVideo:s.type==='video' };
  }
  const newest = [...PRODUCTS].sort((a,b)=>b.id-a.id).find(p=>productPhotos(p).length);
  return { slide:null, slides:[], url: newest ? productPhotos(newest)[0] : '', isVideo:false };
}
/* One slide's media, as a two-layer stack: a blurred fill behind, the real image (uncropped) on
   top. Shared by the desktop hero and the phone hero so an upload behaves identically on both. */
function heroLayerHtml(media, idx, active){
  if(!media || !media.url) return '';
  const cls = `hero-layer${active?' is-active':''}`;
  if(media.isVideo){
    const still = heroStill();
    /* A phone or a metered connection gets the still on its own rather than ~10 MB of autoplay
       video for a hero it scrolls past in two seconds. Without a still to fall back on the video
       is still the only thing we have, so it loads regardless — an empty hero is worse. */
    if(still && shouldSkipHeavyMedia()){
      return `<div class="${cls}" data-idx="${idx}">
        <img class="hero-blur" src="${still}" alt="" aria-hidden="true">
        <img class="hero-main" src="${still}" alt="" fetchpriority="high" onload="fitHeroLayer(this)">
      </div>`;
    }
    /* Deliberately not data-fit="cover", which hides the blur layer: a video paints nothing for
       the first seconds, and the blurred still is what stands in for it meanwhile. */
    return `<div class="${cls}" data-idx="${idx}" data-fit="video">
      ${still?`<img class="hero-blur" src="${still}" alt="" aria-hidden="true">`:''}
      <video class="hero-main" src="${media.url}" autoplay muted loop playsinline preload="metadata"></video>
    </div>`;
  }
  /* The hero is the largest thing on the first screen, so it is the page's LCP element —
     it should outrank every other image in the queue, and it must never be lazy. */
  return `<div class="${cls}" data-idx="${idx}">
    <img class="hero-blur" src="${media.url}" alt="" aria-hidden="true">
    <img class="hero-main" src="${media.url}" alt="" fetchpriority="high" onload="fitHeroLayer(this)">
  </div>`;
}
/* Reads the uploaded file's real dimensions and decides how it should sit in the frame. A photo
   whose shape already matches the billboard fills it edge to edge (no blurred border); anything
   else — a square product shot, a portrait phone photo — is shown whole against the blur rather
   than cropped through the middle. */
function fitHeroLayer(img){
  const layer = img.closest('.hero-layer');
  if(!layer || !img.naturalWidth || !img.naturalHeight) return;
  const frame = layer.getBoundingClientRect();
  if(!frame.width || !frame.height) return;
  const imgRatio = img.naturalWidth / img.naturalHeight;
  const frameRatio = frame.width / frame.height;
  const diff = Math.abs(imgRatio - frameRatio) / frameRatio;
  layer.dataset.fit = diff <= 0.12 ? 'cover' : 'contain';
}
function refitHeroLayers(){
  document.querySelectorAll('.hero-layer .hero-main').forEach(img=>{
    if(img.tagName === 'IMG' && img.complete) fitHeroLayer(img);
  });
}
/* A video slide paints nothing until enough of the file has arrived — on a phone connection that
   is seconds of flat green where the shop window should be. This still sits behind it meanwhile. */
function heroStill(){
  const slides = (state.settings.billboardEnabled && state.settings.billboardSlides) || [];
  const stillSlide = slides.find(s=>s && s.mediaUrl && s.type!=='video');
  if(stillSlide) return stillSlide.mediaUrl;
  const newest = [...PRODUCTS].sort((a,b)=>b.id-a.id).find(p=>productPhotos(p).length);
  return newest ? productPhotos(newest)[0] : '';
}
function renderHeroPhoto(){
  const isAr = state.lang==='ar';
  const m = heroMedia();
  const s = m.slide;
  const shopTarget = PRODUCTS.some(p=>p.featured) ? 'featured-sec'
    : PRODUCTS.some(p=>p.best) ? 'best-sec'
    : PRODUCTS.some(p=>p.new) ? 'new-sec'
    : PRODUCTS.some(p=>p.was>p.price) ? 'offers-sec'
    : PRODUCTS.length ? 'all-sec' : 'cats-sec';
  const scrollTo = `document.getElementById('${shopTarget}')&&document.getElementById('${shopTarget}').scrollIntoView({behavior:'smooth'})`;
  const title = (s && s.title) ? s.title : t('heroTitle');
  const sub = (s && s.subtitle) ? s.subtitle : t('heroSub');
  const hasLink = s && s.linkType && s.linkType!=='none' && s.linkValue;
  const primary = hasLink
    ? `<button class="btn btn-primary" onclick="${s.linkType==='category'?`filterByCat('${s.linkValue}')`:`window.open('${s.linkValue}','_blank')`}">${s.buttonLabel || t('shopNow')} →</button>`
    : `<button class="btn btn-primary" onclick="${scrollTo}">${t('shopNow')} →</button>`;
  return `
  <section class="hero-photo" id="hero-sec">
    <div class="hero-photo-media" id="hero-media">${heroLayerHtml(m, state.billboardIndex, true)}</div>
    <div class="container">
      <div class="hero-inner hero-copy" id="hero-copy">
        <div class="eyebrow">${isAr?'سوق لبنان الإلكتروني':'Lebanon\'s Online Souk'}</div>
        <h1 class="font-display">${title}</h1>
        <p>${sub}</p>
        <div class="hero-actions">
          ${primary}
          <button class="btn btn-outline" onclick="${scrollTo}">${t('explore')}</button>
        </div>
      </div>
    </div>
    ${m.slides.length>1?`
    <div class="billboard-dots hero-dots" id="hero-dots">
      ${m.slides.map((_,idx)=>`<button class="billboard-dot ${idx===(state.billboardIndex % m.slides.length)?'active':''}" onclick="goBillboardSlide(${idx})" aria-label="Slide ${idx+1}"></button>`).join('')}
    </div>`:''}
  </section>`;
}
/* Moves the carousel to a slide by cross-fading a freshly built media layer over the current one
   and swapping the copy under it, instead of replacing the whole hero in one frame. Direct DOM
   work only — no render() — so this never disturbs anything else on the page. Returns false when
   there is no hero on screen, which is how the timer knows to leave the state alone. */
function crossfadeHeroTo(idx){
  const desktop = document.getElementById('hero-media');
  const mobile = document.getElementById('m-hero-media');
  const stack = desktop || mobile;
  if(!stack) return false;
  const slides = (state.settings.billboardEnabled && state.settings.billboardSlides) || [];
  if(slides.length < 2) return false;
  state.billboardIndex = ((idx % slides.length) + slides.length) % slides.length;
  const s = slides[state.billboardIndex];
  const media = { slide:s, slides, url:s.mediaUrl, isVideo:s.type==='video' };

  const outgoing = stack.querySelector('.hero-layer.is-active');
  stack.insertAdjacentHTML('beforeend', heroLayerHtml(media, state.billboardIndex, false));
  const incoming = stack.lastElementChild;
  const mainImg = incoming.querySelector('img.hero-main');
  if(mainImg && mainImg.complete) fitHeroLayer(mainImg);
  void incoming.offsetWidth;              // flush, so the opacity transition actually runs
  incoming.classList.add('is-active');
  if(outgoing){
    outgoing.classList.remove('is-active');
    setTimeout(()=>outgoing.remove(), 950);
  }
  swapHeroCopy(s);
  const dots = document.getElementById(desktop ? 'hero-dots' : 'm-hero-dots');
  if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle('active', i===state.billboardIndex));
  return true;
}
/* The words fade down and back rather than snapping, so the two halves of the slide change
   together. Text is set as content, never innerHTML, since it comes from admin input. */
function swapHeroCopy(slide){
  const desktopCopy = document.getElementById('hero-copy');
  const mobileCopy = document.getElementById('m-hero-copy');
  const copy = desktopCopy || mobileCopy;
  if(!copy) return;
  copy.classList.add('is-swapping');
  setTimeout(()=>{
    const titleEl = copy.querySelector(desktopCopy ? 'h1' : '.m-hero-title');
    const subEl = copy.querySelector(desktopCopy ? 'p' : '.m-hero-sub');
    if(titleEl) titleEl.textContent = (slide && slide.title) || t('heroTitle');
    if(subEl) subEl.textContent = (slide && slide.subtitle) || t('heroSub');
    copy.classList.remove('is-swapping');
  }, 450);
}
function setAdminView(v){
  state.adminView=v; state.adminSideOpen=false; render();
  if(v==='activity') loadAuditLog();
  else if(v==='chats') loadAdminChats();
  else if(v==='payments'){ refreshAdminData(); loadPaymentProofUrls(); }
  else refreshAdminData();
}
/* ============ AUDIT LOG (destructive/sensitive admin actions only) ============ */
async function logAdminAction(action, detail){
  const actor = (currentCustomer()||{}).email || ADMIN_EMAIL;
  try{ await sb.from('admin_actions_log').insert({ actor_email: actor, action, detail: detail||null }); }
  catch(e){ console.error('Could not write audit log entry:', e); }
}
async function loadAuditLog(){
  try{
    const { data, error } = await sb.from('admin_actions_log').select('*').order('created_at', {ascending:false}).limit(100);
    if(!error && data) state.auditLog = data;
    render();
  } catch(e){ console.error('Could not load audit log:', e); }
}
function toggleAdminSide(v){ state.adminSideOpen = v!==undefined ? v : !state.adminSideOpen; render(); }
