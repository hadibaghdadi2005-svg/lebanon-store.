<style>
:root{
  --cedar:#0F3D2E;
  --cedar-light:#175943;
  --brass:#C4972A;
  --brass-light:#E0B54A;
  --brick:#C2542D;
  --sand:#F1EAD9;
  --sand-dark:#E7DCC3;
  --paper:#FFFDF8;
  --ink:#1C231F;
  --ink-soft:#5B6259;
  --line:#DDD3B8;
  --radius:14px;
  --shadow:0 4px 18px rgba(15,61,46,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--sand);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
[dir="rtl"] body, [dir="rtl"] .font-body{font-family:'Tajawal',system-ui,sans-serif}
.font-display{font-family:'Fraunces',serif;font-optical-sizing:auto}
[dir="rtl"] .font-display{font-family:'Tajawal',system-ui,sans-serif;font-weight:800}
.font-mono{font-family:'IBM Plex Mono',monospace}
img,svg{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;background:transparent;border:none}
a{color:inherit;text-decoration:none}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
.zellige-divider{
  height:14px;
  background-image: linear-gradient(45deg, var(--brass) 25%, transparent 25%), linear-gradient(-45deg, var(--brass) 25%, transparent 25%);
  background-size:16px 16px;
  opacity:.55;
}
.badge{
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;
  letter-spacing:.02em;
}
.badge-new{background:#DCEFE5;color:var(--cedar)}
.badge-best{background:#FBE9D2;color:#8A5A15}
.badge-offer{background:#FBDACB;color:var(--brick)}
.btn{
  border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brass);color:#221604}
.btn-primary:hover{background:var(--brass-light);box-shadow:0 6px 16px rgba(196,151,42,.35)}
.btn-outline{background:transparent;border:1.6px solid var(--paper);color:var(--paper)}
.btn-cedar{background:var(--cedar);color:var(--paper)}
.btn-cedar:hover{background:var(--cedar-light)}
.btn-ghost{background:var(--sand-dark);color:var(--ink)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:8px}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- HEADER ---------- */
header.site{
  position:sticky;top:0;z-index:40;background:var(--cedar);color:var(--paper);
}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:38px;height:38px;border-radius:9px;background:var(--brass);display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:20px;height:20px;stroke:var(--cedar);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.logo-text{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1}
.logo-sub{font-size:10.5px;color:var(--brass-light);letter-spacing:.08em;text-transform:uppercase}
.searchbar{
  flex:1;display:flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:10px;padding:9px 14px;gap:8px;min-width:0;
}
.searchbar input{background:transparent;border:none;outline:none;color:var(--paper);width:100%;font-size:14px}
.searchbar input::placeholder{color:rgba(255,255,255,.55)}
.search-clear-btn{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.search-clear-btn:hover{background:rgba(255,255,255,.3)}
.topbar-icons{display:flex;align-items:center;gap:16px;flex-shrink:0}
.icon-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:rgba(255,255,255,.85)}
.icon-btn .cart-count{
  position:absolute;top:-6px;inset-inline-end:-8px;background:var(--brick);color:#fff;font-size:10px;font-weight:700;
  width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.lang-switch{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--paper);
  padding:6px 10px;font-size:12.5px;font-weight:700;
}
.hamburger{display:none;background:none;border:none;color:var(--paper)}
.catbar{background:var(--cedar-light);border-top:1px solid rgba(255,255,255,.08)}
.catbar .container{display:flex;gap:22px;overflow-x:auto;padding:9px 20px;scrollbar-width:none}
.catbar .container::-webkit-scrollbar{display:none}
.catbar a{white-space:nowrap;font-size:13px;color:rgba(255,255,255,.82);font-weight:500}
.catbar a:hover{color:var(--brass-light)}

/* ---------- HERO ---------- */
.hero{
  position:relative;background:var(--cedar);color:var(--paper);padding:64px 0 76px;overflow:hidden;will-change:opacity,transform;
}
.hero::after{
  content:'';position:absolute;inset-inline-end:-8%;top:-20%;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle, rgba(196,151,42,.28), transparent 70%);
}
.hero-inner{position:relative;max-width:640px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-light);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--brass-light)}
.hero h1{font-size:44px;line-height:1.08;margin-bottom:16px}
.hero p{font-size:16.5px;color:rgba(255,255,255,.78);margin-bottom:28px;max-width:460px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- BILLBOARD (admin-editable promo carousel) ---------- */
.billboard-full{width:100%;margin-bottom:32px}
.billboard{position:relative;overflow:hidden;background:var(--cedar) center/cover no-repeat;min-height:340px;display:flex;align-items:center}
.billboard::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg, rgba(28,20,15,.74), rgba(28,20,15,.2));z-index:1}
.billboard-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.billboard-inner{position:relative;padding:36px 60px;max-width:560px;color:var(--paper);z-index:2}
.billboard-inner h2{font-size:28px;line-height:1.15;margin-bottom:10px}
.billboard-inner p{font-size:14.5px;color:rgba(255,255,255,.82);margin-bottom:18px}
.billboard-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.billboard-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);border:none;cursor:pointer;padding:0}
.billboard-dot.active{background:#fff}

/* ---------- SECTIONS ---------- */
section{padding:52px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;gap:12px}
.section-head h2{font-size:26px}
.section-head .eyebrow{margin-bottom:6px}
.section-head a.view-all{font-size:13px;font-weight:700;color:var(--cedar);border-bottom:2px solid var(--brass)}

.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat-card{
  background:var(--paper);border-radius:var(--radius);padding:18px 10px;text-align:center;box-shadow:var(--shadow);
  border:1px solid var(--line);transition:transform .18s ease;
}
.cat-card:hover{transform:translateY(-3px)}
.cat-icon{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;background:var(--sand);display:flex;align-items:center;justify-content:center}
.cat-icon svg{width:22px;height:22px;stroke:var(--cedar);fill:none;stroke-width:1.7}
.cat-card span{font-size:12.5px;font-weight:700}

.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.prod-card{
  background:var(--paper);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s ease;
}
.prod-card:hover{transform:translateY(-4px)}
.prod-img{
  aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
}
.prod-img svg{width:46%;height:46%;stroke:rgba(255,255,255,.92);fill:none;stroke-width:1.3}
.prod-badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:5px}
.wish-btn{
  position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,253,248,.9);
  border:none;display:flex;align-items:center;justify-content:center;
}
.wish-btn svg{width:15px;height:15px;stroke:var(--brick);fill:none;stroke-width:2}
.wish-btn.active svg{fill:var(--brick)}
.prod-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.prod-cat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.prod-name{font-size:14px;font-weight:700;line-height:1.3;min-height:36px}
.prod-rating{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.prod-rating svg{width:12px;height:12px;fill:var(--brass);stroke:none}
.prod-price-row{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.price-now{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--cedar)}
.price-was{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);text-decoration:line-through}
.stock-tag{font-size:11px;font-weight:700}
.stock-ok{color:var(--cedar)}
.stock-low{color:var(--brick)}
.stock-out{color:#999}
.add-cart-btn{
  margin-top:6px;width:100%;background:var(--cedar);color:var(--paper);border:none;border-radius:9px;padding:9px;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
}
.add-cart-btn:hover{background:var(--cedar-light)}
.add-cart-btn:disabled{background:#C7C2B4;cursor:not-allowed}

.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.why-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px}
.why-card .cat-icon{margin:0 0 12px}
.why-card h3{font-size:15px;margin-bottom:5px}
.why-card p{font-size:13px;color:var(--ink-soft);line-height:1.5}

.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.review-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.review-name{font-weight:700;font-size:13.5px}
.review-stars{display:flex;gap:2px}
.review-stars svg{width:12px;height:12px;fill:var(--brass);stroke:none}
.review-text{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:8px}
.review-meta{font-size:11.5px;color:#9B9484}

footer.site{background:var(--cedar);color:rgba(255,255,255,.82);padding:48px 0 20px;margin-top:20px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.3fr;gap:24px;margin-bottom:32px}
.footer-grid h4{color:var(--paper);font-size:13.5px;margin-bottom:14px}
.footer-grid ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.footer-grid a{font-size:13px;color:rgba(255,255,255,.7)}
.footer-grid a:hover{color:var(--brass-light)}
.footer-grid p{font-size:13px;color:rgba(255,255,255,.7);line-height:1.6}
.newsletter{display:flex;gap:8px;margin-top:10px}
.newsletter input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:12.5px}
.footer-bottom{border-top:1px solid rgba(255,255,255,.14);padding-top:18px;display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);flex-wrap:wrap;gap:10px}

/* ---------- DRAWER / MODALS ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,17,.5);z-index:90;display:none}
.overlay.open{display:block}
.drawer{
  position:fixed;top:0;inset-inline-end:0;height:100%;width:420px;max-width:92vw;background:var(--paper);z-index:95;
  transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;
}
[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:17px}
.close-btn{background:var(--sand);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.cart-line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--sand-dark)}
.cart-thumb{width:60px;height:60px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cart-thumb svg{width:50%;height:50%;stroke:#fff;fill:none;stroke-width:1.4}
.cart-info{flex:1;min-width:0}
.cart-info .name{font-size:13.5px;font-weight:700;margin-bottom:3px}
.cart-info .variant{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px}
.qty-row{display:flex;align-items:center;gap:8px}
.qty-btn{width:24px;height:24px;border-radius:6px;background:var(--sand-dark);border:none;font-weight:700;font-size:13px}
.qty-val{font-size:13px;font-weight:600;min-width:16px;text-align:center}
.remove-btn{font-size:11.5px;color:var(--brick);font-weight:700;margin-inline-start:auto;background:none;border:none}
.line-total{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.drawer-foot{border-top:1px solid var(--line);padding:16px 20px 20px;background:var(--sand)}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;color:var(--ink-soft)}
.sum-row.total{color:var(--ink);font-weight:800;font-size:16px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.empty-state{text-align:center;padding:60px 10px;color:var(--ink-soft)}
.empty-state svg{width:52px;height:52px;stroke:var(--line);fill:none;margin:0 auto 14px}

/* ---------- PRODUCT MODAL ---------- */
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--paper);z-index:95;border-radius:18px;
  width:920px;max-width:94vw;max-height:90vh;overflow-y:auto;display:none;box-shadow:0 30px 60px rgba(0,0,0,.35);
}
.modal.open{display:block}
.modal-close{position:sticky;top:14px;float:inline-end;margin-inline-end:14px;z-index:5;background:var(--paper);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.modal-gallery{background:var(--cedar);display:flex;flex-direction:column}
.gallery-main{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gallery-main svg{width:38%;height:38%;stroke:rgba(255,255,255,.9);fill:none;stroke-width:1.2}
/* Swipeable product photo gallery — native scroll-snap, no hand-rolled touch JS, shared by
   the desktop .gallery-main and mobile .m-product-hero via renderPhotoGallery(). */
.gallery-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-slide{flex:0 0 100%;scroll-snap-align:center;position:relative;display:flex;align-items:center;justify-content:center}
.gallery-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gallery-swatches{display:flex;gap:8px;padding:14px;justify-content:center}
.swatch{width:44px;height:44px;border-radius:8px;border:2px solid rgba(255,255,255,.25);cursor:pointer}
.swatch.active{border-color:var(--brass)}
.modal-info{padding:26px 26px 30px;display:flex;flex-direction:column;gap:12px}
.modal-info h2{font-size:21px;line-height:1.3}
.modal-stars-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.modal-price-row{display:flex;align-items:baseline;gap:10px}
.modal-price-row .price-now{font-size:24px}
.discount-tag{background:#FBDACB;color:var(--brick);font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px}
.modal-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.variant-block label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px}
.variant-opts{display:flex;gap:8px;flex-wrap:wrap}
.variant-opt{padding:6px 14px;border-radius:8px;border:1.4px solid var(--line);font-size:12.5px;font-weight:600;background:var(--paper)}
.variant-opt.active{border-color:var(--cedar);background:var(--cedar);color:#fff}
.modal-actions{display:flex;gap:10px;align-items:center}
.spec-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.spec-table td{padding:7px 0;border-bottom:1px solid var(--sand-dark)}
.spec-table td:first-child{color:var(--ink-soft);width:38%}
.ai-box{background:var(--sand);border:1px dashed var(--brass);border-radius:12px;padding:14px}
.ai-box-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--cedar);margin-bottom:8px}
.ai-box-head svg{width:16px;height:16px}
.ai-log{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:150px;overflow-y:auto}
.ai-msg{font-size:12.5px;padding:8px 11px;border-radius:9px;max-width:88%;line-height:1.5}
.ai-msg.user{background:var(--cedar);color:#fff;align-self:flex-end;margin-inline-start:auto}
.ai-msg.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start}
.ai-msg.bot.admin{background:var(--brass);border-color:var(--brass);color:#221604}
.chat-status-banner{background:var(--sand);border-bottom:1px solid var(--line);padding:8px 14px;font-size:11.5px;font-weight:600;color:var(--cedar)}
.chat-status-pill{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700}
.chat-status-pill.ai{background:var(--sand);color:var(--ink-soft)}
.chat-status-pill.needs_human{background:#f6d9d0;color:var(--brick)}
.chat-status-pill.human{background:#dcecdf;color:var(--cedar)}
.chat-status-pill.resolved{background:var(--sand);color:var(--ink-soft)}
.ai-input-row{display:flex;gap:6px}
.ai-input-row input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;outline:none}

/* ---------- CHATBOT ---------- */
.chat-fab{
  position:fixed;bottom:22px;inset-inline-end:22px;background:var(--brass);color:#221604;border:none;border-radius:30px;
  padding:13px 20px;font-weight:800;font-size:13.5px;box-shadow:0 8px 22px rgba(196,151,42,.4);z-index:80;display:flex;align-items:center;gap:8px;
}
.chat-panel{
  position:fixed;bottom:88px;inset-inline-end:22px;width:340px;max-width:90vw;height:440px;background:var(--paper);
  border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.28);z-index:80;display:none;flex-direction:column;overflow:hidden;
}
.chat-panel.open{display:flex}
.chat-head{background:var(--cedar);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.chat-head div span{display:block}
.chat-head .t1{font-weight:800;font-size:13.5px}
.chat-head .t2{font-size:11px;color:rgba(255,255,255,.65)}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sand)}
.chat-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:var(--sand)}
.chat-chip{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px 10px;font-size:11px}
.chat-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:6px}
.chat-foot input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;outline:none}
.chat-send{background:var(--cedar);color:#fff;border:none;border-radius:9px;width:38px;display:flex;align-items:center;justify-content:center}
.chat-send:disabled,.chat-foot input:disabled{opacity:.5;cursor:not-allowed}
.typing-dots{display:inline-flex;gap:4px;align-items:center;padding:2px 0}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:typing-bounce 1.1s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes typing-bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* ---------- CHECKOUT / ACCOUNT PAGES ---------- */
.page{padding:36px 0 60px}
.breadcrumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px}
.checkout-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:26px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h3{font-size:16px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:12px;font-weight:700;color:var(--ink-soft)}
.form-field input,.form-field select,.form-field textarea{
  padding:10px 12px;border:1.4px solid var(--line);border-radius:9px;font-size:13.5px;outline:none;font-family:inherit;background:var(--paper);color:var(--ink);
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--cedar)}
.pay-option{display:flex;align-items:center;gap:10px;border:1.4px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.pay-option.active{border-color:var(--cedar);background:var(--sand)}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--cedar);padding:32px 20px;position:relative;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior-x:none}
.login-wrap::before{content:'';position:absolute;inset-inline-end:-12%;top:-18%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle, rgba(196,151,42,.22), transparent 70%);pointer-events:none}
.login-wrap::after{content:'';position:absolute;inset-inline-start:-14%;bottom:-16%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle, rgba(194,84,45,.16), transparent 70%);pointer-events:none}
.login-shell{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:900px;background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login-brand{
  background:linear-gradient(158deg, var(--cedar) 0%, var(--cedar-light) 62%, #0c2e22 100%);
  color:var(--paper);padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.login-brand::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle, rgba(224,181,74,.35) 1px, transparent 1.6px);background-size:22px 22px;opacity:.35}
.login-brand-top{position:relative;z-index:1}
.login-brand-logo{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.login-brand-logo .logo-mark{background:var(--brass)}
.login-brand-logo .logo-mark svg{stroke:#2b1c05}
.login-brand-wordmark{font-size:20px;font-weight:800;letter-spacing:.02em}
.login-brand-title{font-size:28px;line-height:1.25;margin-bottom:14px;max-width:280px}
.login-brand-sub{font-size:14px;line-height:1.6;color:rgba(255,253,248,.78);max-width:280px}
.login-brand-feats{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;margin-top:30px}
.login-brand-feat{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:rgba(255,253,248,.9)}
.login-brand-feat svg{width:18px;height:18px;flex-shrink:0;stroke:var(--brass-light);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.login-panel{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.login-title{font-size:24px;margin-bottom:6px}
.login-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:26px}
.login-form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.login-form-field label{font-size:12px;font-weight:700;color:var(--ink-soft)}
.login-input-wrap{position:relative;display:flex;align-items:center}
.login-input-wrap svg{position:absolute;inset-inline-start:13px;width:16px;height:16px;stroke:var(--ink-soft);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;z-index:1}
.login-form-field input{width:100%;padding:12px 44px 12px 38px;border:1.4px solid var(--line);border-radius:10px;font-size:16px;outline:none;background:var(--paper);transition:border-color .15s ease,box-shadow .15s ease}
[dir="rtl"] .login-form-field input{padding:12px 38px 12px 44px}
[dir="rtl"] .login-input-wrap svg{inset-inline-start:auto;inset-inline-end:13px}
.login-form-field input:focus{border-color:var(--cedar);box-shadow:0 0 0 3px rgba(15,61,46,.1)}
/* Full-height, generously-sized tap target (not just the icon's own bounds) positioned clear
   of the input's own padding, so it's never obscured by or fighting with typed text/autofill
   UI, and z-index:2 keeps it clickable above the input on every browser. */
.login-pw-toggle{position:absolute;inset-inline-end:2px;top:2px;bottom:2px;width:40px;background:none;border:none;padding:0;margin:0;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
[dir="rtl"] .login-pw-toggle{inset-inline-end:auto;inset-inline-start:2px}
.login-pw-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
input[type="password"]::-ms-reveal,input[type="password"]::-ms-clear{display:none}
/* Reusable show/hide toggle for any other password field (account pages, reset-password
   screen) — same generously-sized, clearly-positioned tap target as the login screen's,
   toggled directly via togglePwField() rather than a re-render so focus/typing is never
   interrupted. */
.pw-field-wrap{position:relative;display:flex;align-items:center}
.pw-field-wrap input{padding-inline-end:42px}
.pw-toggle-btn{position:absolute;inset-inline-end:2px;top:2px;bottom:2px;width:38px;background:none;border:none;padding:0;margin:0;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.pw-toggle-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mstore .pw-toggle-btn{color:var(--muted)}
.login-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-soft)}
.login-switch a{color:var(--cedar);font-weight:700;border-bottom:1.5px solid var(--brass);margin-inline-start:4px}
.login-back{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin-bottom:14px;display:inline-flex;align-items:center;gap:4px}
.login-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:22px;line-height:1.6;display:flex;align-items:center;justify-content:center;gap:6px}
.login-note svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;flex-shrink:0}
@media (max-width:760px){
  .login-wrap{padding:0}
  .login-shell{grid-template-columns:1fr;max-width:460px;border-radius:0;min-height:100dvh;box-shadow:none}
  .login-brand{padding:32px 28px 26px}
  .login-brand-feats{display:none}
  .login-brand-title{font-size:23px}
  .login-panel{padding:32px 28px 40px}
}

/* ---------- IMPERSONATION BANNER ---------- */
.impersonate-bar{
  position:sticky;top:0;z-index:50;background:var(--brick);color:#fff;display:flex;align-items:center;justify-content:center;
  gap:14px;padding:9px 16px;font-size:13px;font-weight:700;flex-wrap:wrap;text-align:center;
}
.impersonate-bar button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:700}

/* ---------- ADMIN: CUSTOMERS ---------- */
.cust-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 4px;border-bottom:1px solid var(--sand-dark);flex-wrap:wrap}
.cust-row-info{display:flex;align-items:center;gap:12px;min-width:0}
.cust-row-stats{display:flex;align-items:center;gap:16px;flex-shrink:0}
.cust-avatar{width:38px;height:38px;border-radius:50%;background:var(--cedar);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.cust-meta{font-size:12px;color:var(--ink-soft)}
.method-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--sand);color:var(--cedar)}

/* ---------- SHIPPING CONSENT MODAL ---------- */
.ship-modal-overlay{position:fixed;inset:0;background:rgba(15,20,17,.62);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.ship-modal{background:var(--paper);border-radius:18px;padding:30px 26px;max-width:420px;width:100%;box-shadow:0 25px 70px rgba(0,0,0,.4);text-align:center}
.ship-modal-icon{font-size:34px;margin-bottom:10px}
.ship-modal h3{font-size:18px;margin-bottom:12px}
.ship-modal p{font-size:13.5px;line-height:1.75;color:var(--ink);text-align:start}
.ship-modal-note{background:#FBE9D2;color:#8A5A15;border-radius:9px;padding:11px 13px;font-size:12.5px;margin:14px 0;font-weight:600;text-align:start}
.ship-ack-btn{margin-top:18px;transition:box-shadow .3s ease, opacity .2s ease}
.ship-ack-btn:disabled{opacity:.45;cursor:not-allowed}
.ship-ack-btn.ready{animation:ackGlow 1.3s ease-in-out infinite}
@keyframes ackGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(224,181,74,.55)}
  50%{box-shadow:0 0 0 12px rgba(224,181,74,0)}
}
.ship-modal-cancel{margin-top:10px;background:none;border:none;font-size:12.5px;color:var(--ink-soft);font-weight:600;text-decoration:underline}
.order-conf{text-align:center;padding:60px 20px}
.order-conf .check-circle{width:70px;height:70px;border-radius:50%;background:#DCEFE5;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.order-conf .check-circle svg{width:34px;height:34px;stroke:var(--cedar);stroke-width:2.4}
.order-num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--cedar);margin:12px 0}

/* ---------- ORDER TRACKING ---------- */
.order-card-mini{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;background:var(--paper)}
.order-track{display:flex;align-items:flex-start;gap:2px;margin:20px 0 6px;overflow-x:auto;padding-bottom:4px}
.track-step{flex:1;min-width:76px;text-align:center;position:relative}
.track-step::after{content:'';position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--line);z-index:1}
.track-step:last-child::after{display:none}
.track-step.done::after{background:var(--cedar)}
.track-dot{width:23px;height:23px;border-radius:50%;background:var(--sand-dark);border:2px solid var(--line);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-soft);position:relative;z-index:2}
.track-step.done .track-dot{background:var(--cedar);border-color:var(--cedar);color:#fff}
.track-step.current .track-dot{background:var(--brass);border-color:var(--brass);color:#221604;box-shadow:0 0 0 4px rgba(196,151,42,.22)}
.track-label{font-size:10.5px;color:var(--ink-soft);line-height:1.3;padding:0 2px}
.track-step.current .track-label{color:var(--ink);font-weight:700}

/* ---------- ADMIN ---------- */
.admin-shell{display:flex;min-height:100vh}
.admin-side{width:220px;background:var(--cedar);color:#fff;padding:20px 14px;flex-shrink:0}
.admin-side .logo{margin-bottom:26px;padding:0 6px}
.admin-nav a{display:block;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.75);margin-bottom:3px}
.admin-nav a.active,.admin-nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.admin-nav-badge{display:inline-block;min-width:17px;height:17px;border-radius:999px;background:var(--acc2Ink,#c2542d);color:#fff;font:700 10px/17px 'IBM Plex Mono',monospace;text-align:center;margin-inline-start:6px;padding:0 4px}
.admin-main{flex:1;background:var(--sand);padding:26px 30px;overflow-x:hidden}
.admin-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-bottom:6px}
.stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}
.admin-panels{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:20px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.bar{flex:1;background:var(--brass);border-radius:6px 6px 0 0;position:relative}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--ink-soft)}
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th{text-align:start;font-size:11px;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line)}
.admin-table td{padding:9px 10px;border-bottom:1px solid var(--sand-dark);vertical-align:middle}
.admin-table input[type="number"], .admin-table input[type="text"]{width:80px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.toggle-row{display:flex;gap:6px}
.mini-toggle{font-size:10.5px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font-weight:700}
.mini-toggle.on{background:var(--cedar);color:#fff;border-color:var(--cedar)}

/* ---------- MISC ---------- */
.nav-link{background:none;border:none;color:inherit;font:inherit}
.toast{
  position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:var(--cedar);color:#fff;
  padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(0,0,0,.25);
}
[dir="rtl"] .toast{transform:translateX(50%)}
.toast.show{opacity:1}

.admin-hamburger{display:none;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;background:var(--paper);border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.admin-side-overlay{display:none;position:fixed;inset:0;background:rgba(15,20,17,.5);z-index:59}
@media (max-width:980px){
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .prod-grid{grid-template-columns:repeat(2,1fr)}
  .why-grid{grid-template-columns:repeat(2,1fr)}
  .review-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .modal-grid{grid-template-columns:1fr}
  .checkout-grid{grid-template-columns:1fr}
  .admin-panels{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .admin-side{position:fixed;height:100%;transform:translateX(-100%);transition:transform .2s ease;z-index:60}
  [dir="rtl"] .admin-side{transform:translateX(100%)}
  .admin-side.open{transform:translateX(0)}
  .admin-hamburger{display:flex}
  .admin-side-overlay.open{display:block}
}
@media (max-width:640px){
  .searchbar{display:none}
  .hamburger{display:block}
  .hero h1{font-size:30px}
  .hero p{font-size:14.5px}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
  .drawer{width:100%}
  .form-row{grid-template-columns:1fr}
  .cust-row{flex-direction:column;align-items:flex-start}
  .cust-row-stats{width:100%;justify-content:space-between}
}

/* ============================================================
   MOBILE APP UI — phone-width customer experience.
   Own design language (Caprasimo/Figtree/IBM Plex Mono, warm
   terracotta palette), English-only, entirely separate from the
   desktop CSS above. Only ever mounted below MOBILE_BP by JS.
   ============================================================ */
.mstore{
  --bg:#f5ead8;--card:#fffcf4;--surf:#ebddc5;--text:#201e1d;--muted:#645c50;--line:rgba(32,30,29,.12);
  --acc:#c67139;--accInk:#8c491a;--acc2:#7a8a5e;--acc2Ink:#56633f;
  --shadow:0 3px 10px rgba(46,43,37,.14);--shadowLg:0 14px 34px rgba(46,43,37,.2);
  min-height:100vh;background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,sans-serif;
  display:flex;flex-direction:column;position:relative;
}
.mstore[data-theme="dark"]{
  --bg:#1c1a18;--card:#272320;--surf:#332d28;--text:#f5ead8;--muted:#c0b6a5;--line:rgba(245,234,216,.14);
  --acc:#f6a06b;--accInk:#f6a06b;--acc2:#aebf92;--acc2Ink:#ccdbb2;
  --shadow:0 3px 10px rgba(0,0,0,.4);--shadowLg:0 14px 34px rgba(0,0,0,.5);
}
.mstore *{box-sizing:border-box}
.mstore .m-scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:112px}
.mstore .m-disp{font-family:'Caprasimo',serif}
.mstore .m-mono{font-family:'IBM Plex Mono',monospace}
.mstore button{font-family:inherit}
.mstore img,.mstore svg{display:block}

.m-header{padding:16px 20px 14px;display:flex;align-items:center;gap:12px;transition:opacity .08s linear,transform .08s linear;will-change:opacity,transform}
.m-logo-mark{width:38px;height:38px;border-radius:14px;background:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.m-logo-mark svg{width:20px;height:20px;fill:none;stroke:#2e1a0a;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
.m-kicker{font:600 10px/1.2 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accInk)}
.m-title{font-family:'Caprasimo',serif;font-size:19px;line-height:1.2;color:var(--text)}
.m-iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.m-iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.m-search{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:13px 18px;cursor:pointer;color:var(--muted);font:400 14px/1 'Figtree',sans-serif;text-align:left;box-shadow:var(--shadow);margin:0 20px 16px;width:calc(100% - 40px)}
.m-search svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;flex:none}

.m-feature{margin:0 20px 20px;position:relative;border-radius:28px;overflow:hidden;cursor:pointer;background:var(--acc2Ink);box-shadow:var(--shadowLg)}
.m-feature-img{position:relative;height:170px;display:flex;align-items:center;justify-content:center}
.m-feature-img svg{width:90px;height:90px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.m-feature-badge{position:absolute;top:16px;left:16px;background:var(--acc);color:#2e1a0a;font:700 10px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border-radius:999px}
.m-feature-body{padding:16px 18px 18px;background:var(--card)}

async function loadReviews(){
  const { data, error } = await sb.from('reviews').select('*').order('review_date', {ascending:false});
  if(error || !data) return;
  REVIEWS = data.map(r=>({ id:r.id, name_en:r.customer_name, rating:r.rating, prod:r.product_id, en:r.review_text, date:r.review_date }));
  recomputeProductRatings();
}
/* Product cards/pages show p.rating/p.reviews as real social proof, so they must be derived
   from the actual reviews table rather than carrying invented seed numbers. */
function recomputeProductRatings(){
  PRODUCTS.forEach(p=>{
    const prodReviews = REVIEWS.filter(r=>r.prod===p.id);
    p.reviews = prodReviews.length;
    p.rating = prodReviews.length ? Math.round(prodReviews.reduce((s,r)=>s+r.rating,0)/prodReviews.length*10)/10 : 0;
  });
}

/* Suggested-price margin curve: cheaper items need a higher % markup to be worth handling */
function suggestedMarginPct(cost){
  if(cost < 5) return 45;
  if(cost < 20) return 25;
  return 12;
}
function computeSuggestedPrice(cost, marginPctOverride){
  const pct = (marginPctOverride!==undefined && marginPctOverride!==null && marginPctOverride!=='') ? Number(marginPctOverride) : suggestedMarginPct(cost);
  return +(cost * (1 + pct/100)).toFixed(2);
}

function t(key){ return T[state.lang][key]; }
function fmt(n){ return '$' + n.toFixed(2); }
function pname(p){ return state.lang==='ar' ? p.name_ar : p.name_en; }
function pdesc(p){ return state.lang==='ar' ? p.desc_ar : p.desc_en; }
function catName(c){ return state.lang==='ar' ? c.ar : c.en; }
function findProduct(id){ return PRODUCTS.find(p=>p.id===id); }
/* Multi-photo products store an ordered array in imageUrls; legacy/seed products only ever
   have the single imageUrl. This is the one place that reconciles both so every gallery and
   thumbnail reads a consistent list without needing imageUrls populated on every product. */
function productPhotos(p){
  if(p.imageUrls && p.imageUrls.length) return p.imageUrls;
  return p.imageUrl ? [p.imageUrl] : [];
}
function searchProducts(query){
  const raw = (query||'').trim();
  if(!raw) return [];
  const q = raw.toLowerCase();
  return PRODUCTS.filter(p=>
    (p.name_en||'').toLowerCase().includes(q) || (p.name_ar||'').includes(raw) ||
    (p.desc_en||'').toLowerCase().includes(q) || (p.desc_ar||'').includes(raw) ||
    (p.sku||'').toLowerCase().includes(q)
  );
}
/* A product can belong to several real categories at once (p.cats); "offers" isn't
   a real category at all — it's automatic, true whenever there's a genuine discount. */
function productCats(p){ return (p.cats && p.cats.length) ? p.cats : (p.cat ? [p.cat] : []); }
function productInCat(p, catId){
  if(catId==='offers') return p.was > p.price;
  return productCats(p).includes(catId);
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* Generic show/hide toggle for any password field outside the login screen — flips the
   input's type and the button's icon directly via the DOM rather than a full render(), so
   it never disrupts focus or whatever the customer has already typed. */
function togglePwField(inputId, btnEl){
  const inp = document.getElementById(inputId);
  if(!inp) return;
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  btnEl.innerHTML = showing ? EYE_CLOSED_SVG : EYE_OPEN_SVG;
}

async function findOrCreateCustomer({name, email, phone, method}){
  email = (email||'').trim().toLowerCase();
  phone = (phone||'').trim();
  try{
    let existing = null;
    const orFilters = [];
    if(email) orFilters.push(`email.eq.${email}`);
    if(phone) orFilters.push(`phone.eq.${phone}`);
    if(orFilters.length){
      const { data, error } = await sb.from('customers').select('*').or(orFilters.join(',')).limit(1);
      if(error) throw error;
      if(data && data.length) existing = data[0];
    }
    let row;
    if(existing){
      const updates = {};
      if(name) updates.name = name;
      if(email) updates.email = email;
      if(phone) updates.phone = phone;
      const { data, error } = await sb.from('customers').update(updates).eq('id', existing.id).select().single();
      if(error) throw error;
      row = data;
    } else {
      const insertRow = { name: name || (state.lang==='ar'?'زبون':'Customer'), email, phone, method, cart: [], wishlist: [] };
      const { data, error } = await sb.from('customers').insert(insertRow).select().single();
      if(error) throw error;
      row = data;
    }
    const c = dbRowToCustomer(row);
    const idx = state.customers.findIndex(x=>x.id===c.id);
    if(idx>=0) state.customers[idx] = c; else state.customers.push(c);
    return c;
  } catch(e){
    console.error('Login/database error:', e);
    showToast(state.lang==='ar' ? 'تعذر الاتصال بقاعدة البيانات، تحقق من الاتصال وحاول مجددًا' : 'Could not reach the database — check your connection and try again');
    return null;
  }
}
/* ============ REALTIME ORDER TRACKING ============ */
let customerOrderChannel = null;
function subscribeCustomerOrders(customerId){
  if(customerOrderChannel){ sb.removeChannel(customerOrderChannel); customerOrderChannel = null; }
  if(!customerId) return;
  customerOrderChannel = sb.channel('orders-customer-' + customerId)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'orders', filter:`customer_id=eq.${customerId}` }, payload=>{
      const updated = dbRowToOrder(payload.new);
      const idx = state.orders.findIndex(o=>o._dbId===updated._dbId);
      if(idx>=0) state.orders[idx] = updated; else state.orders.push(updated);
      showToast(state.lang==='ar' ? `تم تحديث حالة الطلب ${updated.num}` : `Order ${updated.num} was updated`);
      render();
    })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'orders', filter:`customer_id=eq.${customerId}` }, payload=>{
      const idx = state.orders.findIndex(o=>o._dbId===payload.old.id);
      if(idx>=0){ state.orders.splice(idx,1); render(); }
    })
    .subscribe();
}
function unsubscribeCustomerOrders(){
  if(customerOrderChannel){ sb.removeChannel(customerOrderChannel); customerOrderChannel = null; }
}
let adminOrdersChannel = null;
function subscribeAdminOrders(){
  if(adminOrdersChannel) return;
  adminOrdersChannel = sb.channel('orders-admin-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, ()=>{ refreshAdminData(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'customers' }, ()=>{ refreshAdminData(); })
    .subscribe();
}
/* Runs from the moment an admin logs in (not just while inside /admin), so the badge/toast
   alert reaches them anywhere on the site — see completeLogin(). */
let adminChatChannel = null;
function subscribeAdminChats(){
  if(adminChatChannel) return;
  adminChatChannel = sb.channel('chat-admin-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'chat_conversations' }, payload=>{
      const prevStatus = payload.old && payload.old.status;
      if(payload.eventType!=='DELETE' && payload.new.status==='needs_human' && prevStatus!=='needs_human'){
        showToast(state.lang==='ar' ? '📨 محادثة جديدة تحتاج ردك' : '📨 New chat needs your attention');
      }
      loadAdminChats();
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages' }, ()=>{ loadAdminChats(); })
    .subscribe();
}
function unsubscribeAdminChats(){
  if(adminChatChannel){ sb.removeChannel(adminChatChannel); adminChatChannel = null; }
}
async function loadAdminChats(){
  try{
    const { data: convos, error } = await sb.from('chat_conversations').select('*').order('updated_at', {ascending:false});
    if(error) throw error;
    const ids = (convos||[]).map(c=>c.id);
    const lastMsgs = {};
    if(ids.length){
      const { data: msgs } = await sb.from('chat_messages').select('conversation_id, content, sender, created_at').in('conversation_id', ids).order('created_at', {ascending:false});
      (msgs||[]).forEach(m=>{ if(!lastMsgs[m.conversation_id]) lastMsgs[m.conversation_id] = m; });
    }
    state.adminChats = (convos||[]).map(c=>({...c, lastMessage: lastMsgs[c.id]||null}));
    if(state.adminSelectedChat) await refreshAdminChatThread();
    render();
  } catch(e){ console.error('Could not load chats:', e); }
}
async function refreshAdminChatThread(){
  try{
    const { data, error } = await sb.from('chat_messages').select('*').eq('conversation_id', state.adminSelectedChat).order('created_at', {ascending:true});
    if(error) throw error;
    state.adminChatThread = data||[];
  } catch(e){ console.error('Could not load chat thread:', e); }
}
async function openAdminChat(id){
  state.adminSelectedChat = id;
  state.adminChatThread = [];
  render();
  await refreshAdminChatThread();
  render();
}
function closeAdminChat(){ state.adminSelectedChat = null; state.adminChatThread = []; render(); }
async function sendAdminChatReply(id){
  const input = document.getElementById('admin-chat-reply');
  if(!input || !input.value.trim()) return;
  const content = input.value.trim();
  input.value = '';
  const convo = state.adminChats.find(c=>c.id===id);
  if(!convo) return;
  try{
    const { error: msgErr } = await sb.from('chat_messages').insert({ conversation_id:id, customer_id:convo.customer_id, sender:'admin', content });
    if(msgErr) throw msgErr;
    const { error: updErr } = await sb.from('chat_conversations').update({ status:'human', updated_at:new Date().toISOString() }).eq('id', id);
    if(updErr) throw updErr;
    await loadAdminChats();
  } catch(e){ console.error('Reply failed:', e); showToast(state.lang==='ar'?'تعذر الإرسال':'Could not send'); }
}
async function takeOverChat(id){
  try{
    await sb.from('chat_conversations').update({ status:'human', updated_at:new Date().toISOString() }).eq('id', id);
    await loadAdminChats();
  } catch(e){ console.error('Take over failed:', e); }
}
async function resolveChat(id){
  try{
    await sb.from('chat_conversations').update({ status:'resolved', updated_at:new Date().toISOString() }).eq('id', id);
    await loadAdminChats();
    closeAdminChat();
  } catch(e){ console.error('Resolve failed:', e); }
}

  state.loginForm = {};
  state.formData.fullName = c.name || '';
  state.formData.phone = c.phone || '';
  state.formData.email = c.email || '';
  state.formData.city = c.city || '';
  state.formData.area = c.area || '';
  state.formData.building = c.building || '';
  state.formData.floor = c.floor || '';
  state.formData.apartment = c.apartment || '';
  state.formData.address = c.address || '';

  if(isAdminUser(c)){ subscribeAdminChats(); loadAdminChats(); }

  render();

/* ============ REAL AUTH (Supabase Auth — email + password) ============
   Identity is verified by Supabase itself (the account owner is whoever knows
   the password / can confirm the email), not just typed into a form. This is
   what makes the ★ Admin check on ADMIN_EMAIL above actually mean something. */
async function submitAuth(){
  const f = state.loginForm;
  const email = (f.email||'').trim().toLowerCase();
  const password = f.password || '';
  const isAr = state.lang==='ar';
  if(!email || !password){
    showToast(isAr ? 'يرجى تعبئة البريد الإلكتروني وكلمة المرور' : 'Please fill in your email and password');
    return;
  }
  if(state.authMode==='signup' && !f.name){
    showToast(isAr ? 'يرجى تعبئة الاسم الكامل' : 'Please fill in your full name');
    return;
  }
  if(state.authMode==='signup' && password.length < 6){
    showToast(isAr ? 'كلمة المرور يجب أن تكون 6 أحرف على الأقل' : 'Password must be at least 6 characters');
    return;
  }
  if(state.authBusy) return;
  state.authBusy = true;
  showToast(isAr ? 'جارٍ التحقق...' : 'Verifying...');
  try{
    if(state.authMode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name:f.name } } });
      if(error){ showToast(error.message); return; }
      if(!data.session){
        showToast(isAr ? 'تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيده ثم سجّل الدخول.' : 'Account created! Check your email to confirm it, then sign in.');
        state.authMode = 'signin';
        state.loginForm = { email };
        render();
        return;
      }
      const c = await findOrCreateCustomer({ name:f.name, email:data.session.user.email, method:'password' });
      if(!c) return;
      completeLogin(c);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        showToast(isAr ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة' : 'Incorrect email or password');
        return;
      }
      const c = await findOrCreateCustomer({ email:data.session.user.email, method:'password' });
      if(!c) return;
      completeLogin(c);
    }
  } finally {
    state.authBusy = false;
  }
}
async function submitForgotPassword(){
  const isAr = state.lang==='ar';
  const email = (state.loginForm.email||'').trim().toLowerCase();
  if(!email){ showToast(isAr?'يرجى إدخال بريدك الإلكتروني':'Please enter your email'); return; }
  if(state.authBusy) return;
  state.authBusy = true; render();
  try{
    const redirectTo = window.location.href.split('#')[0].split('?')[0];
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if(error){ showToast(error.message); return; }
    showToast(isAr?'تحقق من بريدك الإلكتروني لرابط إعادة التعيين':'Check your email for a reset link');
    state.authMode = 'signin';
  } catch(e){
    console.error('Password reset request failed:', e);
    showToast(isAr?'تعذر الإرسال':'Could not send the reset link');
  } finally {
    state.authBusy = false; render();
  }
}
async function submitRecoveryPassword(){
  const isAr = state.lang==='ar';
  const pw1 = document.getElementById('recovery-pw1').value;
  const pw2 = document.getElementById('recovery-pw2').value;
  if(pw1.length < 6){ showToast(isAr?'كلمة المرور يجب أن تكون 6 أحرف على الأقل':'Password must be at least 6 characters'); return; }
  if(pw1 !== pw2){ showToast(isAr?'كلمتا المرور غير متطابقتين':'Passwords do not match'); return; }
  if(state.authBusy) return;
  state.authBusy = true; render();
  try{
    const { data, error } = await sb.auth.updateUser({ password: pw1 });
    if(error){ showToast(error.message); return; }
    showToast(isAr?'تم تحديث كلمة المرور!':'Password updated!');
    const c = await findOrCreateCustomer({ email: data.user.email, method:'password' });
    if(c){ completeLogin(c); return; }
  } catch(e){
    console.error('Password update failed:', e);
    showToast(isAr?'تعذر تحديث كلمة المرور':'Could not update the password');
  } finally {
    state.authBusy = false; render();
  }
}

/* ============ CART LOGIC ============ */
function addToCart(id, variant, qty){
  qty = qty || 1;
  variant = variant || (findProduct(id).variants[0]);
  const existing = state.cart.find(l=>l.id===id && l.variant===variant);
  if(existing){ existing.qty += qty; }
  else { state.cart.push({id, variant, qty}); }
  syncCustomerCart();
  showToast(t('addedToCart'));
  render();
}
function removeFromCart(id, variant){
  state.cart = state.cart.filter(l=>!(l.id===id && l.variant===variant));
  syncCustomerCart();
  render();
}
function changeQty(id, variant, delta){
  const line = state.cart.find(l=>l.id===id && l.variant===variant);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0) removeFromCart(id, variant);
  else { syncCustomerCart(); render(); }
}
function cartCount(){ return state.cart.reduce((s,l)=>s+l.qty,0); }
function cartSubtotal(){
  return state.cart.reduce((s,l)=>{
    const p = findProduct(l.id);
    return p ? s + p.price*l.qty : s;
  },0);
}
function deliveryFee(){
  if(!state.selectedGov) return 0;
  const sub = cartSubtotal();
  if(sub >= FREE_DELIVERY_MIN) return 0;
  return GOV_FEES[state.lang][state.selectedGov] ?? 0;
}
function discountAmount(){
  if(!state.coupon) return 0;
  const sub = cartSubtotal();
  if(state.coupon.type==='pct') return +(sub*state.coupon.value/100).toFixed(2);
  return state.coupon.value;
}
function cartTotal(){
  return Math.max(0, cartSubtotal() - discountAmount() + deliveryFee());
}
function toggleWishlist(id){
  if(state.wishlist.has(id)){ state.wishlist.delete(id); showToast(t('removedFromWish')); }
  else { state.wishlist.add(id); showToast(t('addedToWish')); }
  syncCustomerCart();
  render();
}

function buildCatalogContext(){
  return PRODUCTS.map(p=>{
    const specStr = Object.entries(specsFor(p)).map(([k,v])=>`${k}: ${v}`).join(', ');
    const catList = productCats(p).map(id=>{ const c=CATS.find(x=>x.id===id); return c?catName(c):id; }).join(', ');
    return `- "${pname(p)}" | SKU ${p.sku} | categories: ${catList}${p.was>p.price?' | on offer':''} | price: $${p.price}${p.was>p.price?` (was $${p.was})`:''} | stock: ${p.stock} units | rating: ${p.reviews>0?`${p.rating}/5 (${p.reviews} reviews)`:'no reviews yet'} | specs: ${specStr}`;
  }).join('\n');
}

${buildCatalogContext()}

RETURN POLICY: Items can be returned within 7 days of delivery if still in original condition.

/* Both call the ai-chat Supabase Edge Function, which holds the Anthropic API key
   server-side. See supabase/functions/ai-chat/index.ts. */
async function callProductAI(systemPrompt, historyMessages){
  const { data, error } = await sb.functions.invoke('ai-chat', { body: { mode:'product', system:systemPrompt, messages:historyMessages } });
  if(error) throw error;
  const text = (data && data.text || '').trim();
  return text || (state.lang==='ar' ? 'عذرًا، لم أتمكن من إيجاد إجابة مناسبة.' : "Sorry, I couldn't find a good answer.");
}
/* The persisted, escalation-capable store-support chat. The function finds-or-creates the
   customer's one conversation, stores this message, and either answers or hands off to a
   human — see the Edge Function for the full flow. */
async function callSupportAPI(message){
  const c = currentCustomer();
  const { data, error } = await sb.functions.invoke('ai-chat', { body: {
    mode:'support', customerId:c.id, customerName:c.name, system:buildStoreSystemPrompt(), message, lang:state.lang
  } });
  if(error) throw error;
  return data || {};
}

/* Shared by both the public (cost/supplier-free) and admin (full) product fetches */
function applyProductRows(data){
  const toRemove = [];
  data.forEach(row=>{
    if(row.is_custom){
      if(row.deleted) return; // never existed on this device — skip entirely
      if(PRODUCTS.find(p=>p.id===row.id)) return; // already added (shouldn't normally happen on a fresh load)
      const cats = (row.cats && row.cats.length) ? row.cats : (row.cat ? [row.cat] : []);
      const catInfo = CATS.find(c=>c.id===cats[0]);
      PRODUCTS.push({
        id: row.id, cat: cats[0] || null, cats, icon: catInfo ? catInfo.icon : 'offers',
        color: PRODUCTS.length % PALETTE.length,
        name_ar: row.name_ar || 'منتج', name_en: row.name_en || 'Product',
        desc_ar: row.desc_ar || '', desc_en: row.desc_en || '',
        sku: row.sku || ('LB-NEW-' + row.id),
        price: row.price!=null?Number(row.price):0, was: row.was!=null?Number(row.was):(row.price!=null?Number(row.price):0),
        stock: row.stock!=null?Number(row.stock):0, rating:0, reviews:0,
        best: !!row.best, featured: !!row.featured, new: row.new!=null?!!row.new:true,
        cost: row.cost!=null?Number(row.cost):0, marginPct:0, supplierUrl: row.supplier_url || '',
        specs:{ar:{}, en:{}}, variants: (row.variants && row.variants.length) ? row.variants : ['Standard'],
        imageUrl: row.image_url || null, imageUrls: row.image_urls || [], isCustom:true
      });
    } else {
      const p = findProduct(row.id);
      if(!p) return;
      if(row.deleted){ toRemove.push(row.id); return; }
      if(row.price!=null) p.price = Number(row.price);
      if(row.was!=null) p.was = Number(row.was);
      if(row.stock!=null) p.stock = Number(row.stock);
      if(row.cost!=null) p.cost = Number(row.cost);
      if(row.supplier_url!=null) p.supplierUrl = row.supplier_url;
      if(row.sku) p.sku = row.sku;
      if(row.cats && row.cats.length){ p.cats = row.cats; p.cat = row.cats[0]; const ci = CATS.find(c=>c.id===p.cat); if(ci) p.icon = ci.icon; }
      if(row.variants && row.variants.length) p.variants = row.variants;
      if(row.featured!=null) p.featured = row.featured;
      if(row.best!=null) p.best = row.best;
      if(row.new!=null) p.new = row.new;
      if(row.desc_ar) p.desc_ar = row.desc_ar;
      if(row.desc_en) p.desc_en = row.desc_en;
      if(row.image_url) p.imageUrl = row.image_url;
      if(row.image_urls) p.imageUrls = row.image_urls;
    }
  });
  toRemove.forEach(id=>{
    const idx = PRODUCTS.findIndex(p=>p.id===id);
    if(idx>=0) PRODUCTS.splice(idx,1);
  });
}

async function refreshAdminData(){
  try{
    const [custRes, orderRes, costRes] = await Promise.all([
      sb.from('customers').select('*').order('created_at', {ascending:false}),
      sb.from('orders').select('*').order('created_at', {ascending:true}),
      sb.from('order_item_costs').select('*')
    ]);
    if(!custRes.error && custRes.data) state.customers = custRes.data.map(dbRowToCustomer);
    if(!orderRes.error && orderRes.data){
      state.orders = orderRes.data.map(dbRowToOrder);
      if(!costRes.error && costRes.data){
        const byOrder = {};
        costRes.data.forEach(c=>{ (byOrder[c.order_id] ||= {})[c.item_index] = c; });
        state.orders.forEach(o=>{
          const costs = byOrder[o._dbId];
          if(!costs) return;
          o.items.forEach((it, i)=>{
            if(costs[i]){ it.cost = Number(costs[i].cost); it.supplierUrl = costs[i].supplier_url || ''; }
          });
        });
      }
    }
    render();
  } catch(e){
    console.error('Admin data refresh failed:', e);
    showToast(state.lang==='ar' ? 'تعذر تحديث البيانات' : 'Could not refresh data');
  }
}

async function adminToggleBlockCustomer(id){
  const c = state.customers.find(x=>x.id===id);
  if(!c) return;
  const isAr = state.lang==='ar';
  const next = !c.blocked;
  const msg = next ? (isAr?'هل تريد تعليق حساب هذا العميل؟ لن يتمكن من تسجيل الدخول.':"Suspend this customer's account? They won't be able to sign in.")
                    : (isAr?'هل تريد إعادة تفعيل الحساب؟':'Reactivate this account?');
  if(!confirm(msg)) return;
  c.blocked = next;
  render();
  try{
    const { error } = await sb.from('customers').update({ blocked: next }).eq('id', id);
    if(error) throw error;
    logAdminAction(next?'block_customer':'unblock_customer', { customer_id: id, email: c.email });
    showToast(next ? (isAr?'تم تعليق الحساب':'Account suspended') : (isAr?'تم تفعيل الحساب':'Account reactivated'));
  } catch(e){
    console.error('Block toggle failed:', e);
    c.blocked = !next;
    render();
    showToast(isAr?'تعذر الحفظ':'Could not save');
  }
}
async function adminDeleteCustomer(id){
  const c = state.customers.find(x=>x.id===id);

  const isAr = state.lang==='ar';
  if(state.orders.some(o=>o.customerId===id)){ showToast(isAr?'احذف طلبات هذا العميل أولاً':"Delete this customer's orders first"); return; }
  if(!confirm(isAr?`هل تريد حذف حساب "${c.name}" نهائيًا؟ لا يمكن التراجع عن هذا.`:`Delete "${c.name}"'s account permanently? This can't be undone.`)) return;
  try{
    const { error } = await sb.from('customers').delete().eq('id', id);
    if(error) throw error;
    logAdminAction('delete_customer', { customer_id: id, email: c.email });

function currentAiLog(pid){ return state.aiLogByProduct[pid] || []; }
const aiBusy = {};
function scrollAiLog(pid){
  setTimeout(()=>{
    const log = document.getElementById('ai-log-'+pid);
    if(log) log.scrollTop = log.scrollHeight;
    const inp = document.getElementById('ai-q-input');
    if(inp) inp.focus();
  },0);
}
async function submitProductQuestion(pid){
  const input = document.getElementById('ai-q-input');
  if(!input || !input.value.trim() || aiBusy[pid]) return;
  const q = input.value.trim();
  if(q.length > AI_MAX_INPUT){ showToast(state.lang==='ar' ? 'السؤال طويل جدًا' : 'Question is too long'); return; }
  const p = findProduct(pid);
  if(!state.aiLogByProduct[pid]) state.aiLogByProduct[pid] = [];
  state.aiLogByProduct[pid].push({role:'user', text:q});
  state.aiLogByProduct[pid].push({role:'bot', text:'', loading:true});
  input.value = '';
  aiBusy[pid] = true;
  render();
  scrollAiLog(pid);
  try{
    const history = state.aiLogByProduct[pid].filter(m=>!m.loading).map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
    const answer = await callProductAI(buildProductSystemPrompt(p), history);
    const log = state.aiLogByProduct[pid];
    log[log.length-1] = {role:'bot', text:answer};
  } catch(e){
    const log = state.aiLogByProduct[pid];
    log[log.length-1] = {role:'bot', text: state.lang==='ar' ? 'حدث خطأ أثناء الاتصال بالمساعد الذكي. حاول مرة أخرى.' : 'There was an error reaching the AI assistant. Please try again.'};
  } finally {
    aiBusy[pid] = false;
    render();
    scrollAiLog(pid);
  }
}

/* Shared swipeable photo gallery for the desktop product page and mobile product screen.
   idPrefix namespaces the track/dots element ids so both can exist in the DOM without
   colliding (they never do, since mobile/desktop render exclusively, but keeps this safe). */
function renderPhotoGallery(p, idPrefix, fallbackIconHtml){
  const photos = productPhotos(p);
  const color = PALETTE[p.color % PALETTE.length];
  if(!photos.length){
    return `<div class="gallery-track" style="background:${color}"><div class="gallery-slide">${fallbackIconHtml}</div></div>`;
  }
  return `
  <div class="gallery-track" id="${idPrefix}-track" onscroll="updateGalleryDots('${idPrefix}')">
    ${photos.map(url=>`<div class="gallery-slide" style="background:${color}"><img src="${url}" alt="${p.name_en}"></div>`).join('')}
  </div>
  ${photos.length>1?`
  <div class="billboard-dots" id="${idPrefix}-dots">
    ${photos.map((_,i)=>`<button class="billboard-dot ${i===0?'active':''}" onclick="scrollGalleryTo('${idPrefix}',${i})"></button>`).join('')}
  </div>`:''}`;
}
/* Direct DOM patch only — no state mutation triggering render() — so scrolling the gallery
   never fights an in-progress interaction (this app has a history of exactly that bug from
   timers/scroll handlers calling a full render(), see CLAUDE.md items 19-20). */
function updateGalleryDots(idPrefix){
  const track = document.getElementById(idPrefix+'-track');
  const dots = document.getElementById(idPrefix+'-dots');
  if(!track || !dots) return;
  const idx = Math.round(track.scrollLeft / track.clientWidth);
  state.galleryIndex = idx;
  [...dots.children].forEach((d,i)=>d.classList.toggle('active', i===idx));
}
function scrollGalleryTo(idPrefix, idx){
  const track = document.getElementById(idPrefix+'-track');
  if(!track) return;
  track.scrollTo({ left: idx*track.clientWidth, behavior:'smooth' });
}
/* Re-applies the current photo index after a full render() rebuilds the DOM (e.g. picking a
   variant swatch), since innerHTML replacement would otherwise silently snap back to photo 1. */
function restoreGalleryScroll(idPrefix){
  const track = document.getElementById(idPrefix+'-track');
  if(!track || !state.galleryIndex) return;
  track.scrollLeft = state.galleryIndex * track.clientWidth;
}

/* Items in these categories are treated as electronics/battery items for the shipping notice */
function cartHasElectronics(){
  return state.cart.some(l=>{ const p = findProduct(l.id); return p && (productCats(p).includes('electronics') || productCats(p).includes('phones')); });
}
function openShippingModal(){
  const f = state.formData;
  if(!f.fullName || !f.phone || !state.selectedGov || !f.city || !f.address){
    showToast(state.lang==='ar'?'يرجى تعبئة الحقول المطلوبة':'Please fill in the required fields');
    return;
  }
  state.shippingModalOpen = true;
  state.shippingModalCountdown = 3;
  render();
  const tick = ()=>{
    state.shippingModalCountdown--;
    render();
    if(state.shippingModalCountdown > 0) setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
}
function closeShippingModal(){
  state.shippingModalOpen = false;
  state.shippingModalCountdown = 3;
  render();
}
function confirmShippingAndPlaceOrder(){
  if(state.shippingModalCountdown > 0) return;
  state.shippingModalOpen = false;
  state.shippingModalCountdown = 3;
  placeOrder();
}
function renderShippingModal(){
  if(!state.shippingModalOpen) return '';
  const isAr = state.lang==='ar';
  const ready = state.shippingModalCountdown <= 0;
  const hasElectronics = cartHasElectronics();
  const fee = deliveryFee();
  return `

        : `Delivery is charged as a flat fee based on your governorate (${fee===0?'free for your current order':fmt(fee)+' for your current order'}), and is automatically free on orders over $${FREE_DELIVERY_MIN}. Estimated delivery time is ${state.settings.deliveryMin}-${state.settings.deliveryMax} days.`}</p>

async function placeOrder(){
  const f = state.formData;
  if(!f.fullName || !f.phone || !state.selectedGov || !f.city || !f.address){
    showToast(state.lang==='ar'?'يرجى تعبئة الحقول المطلوبة':'Please fill in the required fields');
    return;
  }
  const num = 'LB-' + new Date().getFullYear() + '-' + String(Math.floor(100000+Math.random()*899999)).slice(0,6);
  const items = state.cart.filter(l=>findProduct(l.id)).map(l=>{
    const p = findProduct(l.id);
    return { id:p.id, name_ar:p.name_ar, name_en:p.name_en, variant:l.variant, qty:l.qty, price:p.price, sku:p.sku, status:'confirmed' };
  });
  const c = currentCustomer();
  const orderRow = {
    customer_id: c ? c.id : null,
    num, order_date: new Date().toISOString().slice(0,10), items,
    total: cartTotal(), gov: state.selectedGov, customer_name: f.fullName, phone: f.phone,
    status: 'confirmed', delivery_min: state.settings.deliveryMin, delivery_max: state.settings.deliveryMax,
    payment_status: 'pending_verification'
  };
  showToast(state.lang==='ar' ? 'جارٍ إرسال الطلب...' : 'Placing your order...');
  let order;
  try{
    const { data, error } = await sb.from('orders').insert(orderRow).select().single();
    if(error) throw error;
    order = dbRowToOrder(data);
  } catch(e){
    console.error('Order placement failed:', e);
    showToast(state.lang==='ar' ? 'تعذر إرسال الطلب، حاول مرة أخرى' : 'Could not place the order, please try again');
    return;
  }
  state.orders.push(order);
  state.cart = [];
  state.coupon = null;
  syncCustomerCart();
  if(c){
    const addrFields = {
      name: f.fullName||c.name, phone: f.phone||c.phone,
      gov: state.selectedGov, city: f.city||'', area: f.area||'', building: f.building||'',
      floor: f.floor||'', apartment: f.apartment||'', address: f.address||'', notes: f.notes||''
    };
    Object.assign(c, addrFields);
    sb.from('customers').update(addrFields).eq('id', c.id)
      .then(({error})=>{ if(error) console.error('Address save failed:', error); });
  }
  if(isMobileViewport()){ state.mPrev = state.mScreen; state.mScreen = 'paymentInstructions'; }
  else { state.view = 'paymentInstructions'; }
  window.scrollTo(0,0);
  render();
}
/* Each item in an order carries its own logistics status, since items in the same order
   can ship separately. This updates just that one line item, not the whole order. */
async function updateItemStatus(dbId, itemIndex, status){
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o || !o.items[itemIndex]) return;
  o.items[itemIndex].status = status;
  render();
  try{
    const { error } = await sb.from('orders').update({ items: o.items }).eq('id', dbId);
    if(error) throw error;
  } catch(e){
    console.error('Item status update failed:', e);
    showToast(state.lang==='ar' ? 'تعذر حفظ الحالة' : 'Could not save the status');
  }
}
/* Lets admin attach a supplier tracking code to an already-placed order's item,
   separate from the product's own SKU (each purchase from the supplier gets its own). */
async function updateItemSku(dbId, itemIndex, sku){
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o || !o.items[itemIndex]) return;
  o.items[itemIndex].sku = sku.trim();
  render();
  try{
    const { error } = await sb.from('orders').update({ items: o.items }).eq('id', dbId);
    if(error) throw error;
  } catch(e){
    console.error('Item SKU update failed:', e);
    showToast(state.lang==='ar' ? 'تعذر حفظ الرمز' : 'Could not save the code');
  }
}
/* Screenshots live in the private payment-proofs bucket, so admin needs a signed URL per
   order rather than a plain public URL — fetched once when entering the Payments tab. */
async function loadPaymentProofUrls(){
  const withProof = state.orders.filter(o=>o.paymentStatus==='pending_verification' && o.paymentProofPath && !state.adminPaymentProofUrls[o._dbId]);
  for(const o of withProof){
    try{
      const { data, error } = await sb.storage.from('payment-proofs').createSignedUrl(o.paymentProofPath, 300);
      if(error) throw error;
      state.adminPaymentProofUrls[o._dbId] = data.signedUrl;
      render();
    } catch(e){
      console.error('Could not load payment screenshot:', e);
    }
  }
}

  const o = state.orders.find(o=>o._dbId===dbId);

  o.paymentStatus = 'verified';

    if(error) throw error;

    showToast(isAr?'تعذر تأكيد الدفع':'Could not verify the payment');

async function rejectPayment(dbId){

async function deleteOrder(dbId){
  const isAr = state.lang==='ar';
  if(!confirm(isAr ? 'هل تريد حذف هذا الطلب نهائيًا؟ لا يمكن التراجع عن هذا.' : 'Delete this order permanently? This can\'t be undone.')) return;
  const idx = state.orders.findIndex(o=>o._dbId===dbId);
  if(idx>=0) state.orders.splice(idx,1);
  render();
  try{
    const { error } = await sb.from('orders').delete().eq('id', dbId);
    if(error) throw error;
    logAdminAction('delete_order', { order_id: dbId });
    showToast(isAr ? 'تم حذف الطلب' : 'Order deleted');
  } catch(e){
    console.error('Order delete failed:', e);
    showToast(isAr ? 'تعذر حذف الطلب' : 'Could not delete the order');
  }
}
async function clearAllOrders(){
  const isAr = state.lang==='ar';
  if(!confirm(isAr ? `هل تريد حذف جميع الطلبات (${state.orders.length})؟ لا يمكن التراجع عن هذا.` : `Delete ALL ${state.orders.length} orders? This can't be undone.`)) return;
  if(!confirm(isAr ? 'تأكيد أخير: سيتم حذف كل الطلبات نهائيًا.' : 'Final confirmation: all orders will be permanently deleted.')) return;
  const ids = state.orders.map(o=>o._dbId).filter(Boolean);
  state.orders = [];
  render();
  try{
    const { error } = await sb.from('orders').delete().in('id', ids);
    if(error) throw error;
    logAdminAction('clear_all_orders', { count: ids.length });
    showToast(isAr ? 'تم حذف جميع الطلبات' : 'All orders deleted');
  } catch(e){
    console.error('Clear all orders failed:', e);
    showToast(isAr ? 'تعذر حذف جميع الطلبات' : 'Could not delete all orders');
  }
}
async function clearCustomerOrders(customerId){
  const isAr = state.lang==='ar';
  const custOrders = state.orders.filter(o=>o.customerId===customerId);
  if(custOrders.length===0) return;
  if(!confirm(isAr ? `هل تريد حذف جميع طلبات هذا العميل (${custOrders.length})؟ لا يمكن التراجع عن هذا.` : `Delete all ${custOrders.length} orders for this customer? This can't be undone.`)) return;
  const ids = custOrders.map(o=>o._dbId).filter(Boolean);
  state.orders = state.orders.filter(o=>o.customerId!==customerId);
  render();
  try{
    const { error } = await sb.from('orders').delete().in('id', ids);
    if(error) throw error;
    logAdminAction('clear_customer_orders', { customer_id: customerId, count: ids.length });
    showToast(isAr ? 'تم حذف طلبات العميل' : "Customer's orders deleted");
  } catch(e){
    console.error('Clear customer orders failed:', e);
    showToast(isAr ? 'تعذر الحذف' : 'Could not delete');
  }
}

/* Reads the selected screenshot as base64 and posts it (or a typed reference) to the
   submit-payment-proof Edge Function, which verifies the caller owns the order, stores
   the proof, and emails the admin — see supabase/functions/submit-payment-proof/index.ts. */
async function submitPaymentProof(dbId){
  const isAr = state.lang==='ar';
  const o = state.orders.find(o=>o._dbId===dbId);
  if(!o) return;
  const body = { order_id: dbId };
  if(state.paymentProofMode==='reference'){
    if(!state.paymentProofReference.trim()){
      showToast(isAr?'يرجى إدخال رقم العملية':'Please enter the transaction reference');
      return;
    }
    body.reference = state.paymentProofReference.trim();
  } else {
    if(!state.paymentProofFile){
      showToast(isAr?'يرجى اختيار صورة':'Please choose a screenshot');
      return;
    }
    try{
      const dataUrl = await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(state.paymentProofFile);
      });
      body.screenshot_base64 = dataUrl.split(',')[1] || '';
      body.screenshot_ext = (state.paymentProofFile.name.split('.').pop() || 'jpg').toLowerCase();
    } catch(e){
      console.error('Reading screenshot failed:', e);
      showToast(isAr?'تعذرت قراءة الصورة':'Could not read the screenshot');
      return;
    }
  }
  state.paymentSubmitting = true;
  render();
  try{
    const { data, error } = await sb.functions.invoke('submit-payment-proof', { body });
    if(error) throw error;
    if(data && data.error) throw new Error(data.error);
    o.paymentSubmittedAt = new Date().toISOString();
    if(body.reference) o.paymentReference = body.reference;
    state.paymentProofFile = null;
    state.paymentProofReference = '';
    showToast(isAr?'تم إرسال إثبات الدفع، سنتحقق منه قريبًا':"Payment confirmation sent — we'll verify it shortly");
    if(isMobileViewport()){ state.mScreen = 'confirm'; } else { state.view = 'confirm'; }
  } catch(e){
    console.error('Submit payment proof failed:', e);
    showToast(isAr?'تعذر إرسال إثبات الدفع، حاول مرة أخرى':'Could not submit, please try again');
  } finally{
    state.paymentSubmitting = false;
    render();
  }
}

/* Real sales for the last 7 calendar days, aggregated from state.orders (replaces the old
   MOCK_SALES placeholder — orders carry a plain 'YYYY-MM-DD' date string, see dbRowToOrder). */
function last7DaysSales(){
  const days = [];
  for(let i=6;i>=0;i--){
    const dt = new Date();
    dt.setDate(dt.getDate()-i);
    const key = dt.toISOString().slice(0,10);
    const label = dt.toLocaleDateString('en-US', {weekday:'short'});
    const v = state.orders.filter(o=>o.date===key).reduce((s,o)=>s+(o.total||0),0);
    days.push({d:label, v});
  }
  return days;
}
function adminStats(){
  const totalStock = PRODUCTS.reduce((s,p)=>s+p.stock,0);
  const low = PRODUCTS.filter(p=>p.stock>0 && p.stock<=5).length;
  const outOf = PRODUCTS.filter(p=>p.stock===0).length;
  const totalSales = last7DaysSales().reduce((s,d)=>s+d.v,0);
  return {totalStock, low, outOf, totalSales};
}
